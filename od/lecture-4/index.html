<style>
/* Una sola hoja para las tres caras del HTML del curso: el test (body.test), la página de estudio (body.estudio) y la parrilla (body.parrilla). Las reglas sin clase de body son del test o comunes. */
:root{color-scheme:light;--ok:#1a7f37;--ko:#c62828;--ac:#1e6fd9;--qt:#b07d00;--me:#7b3fc4;--bg:#fff;--fg:#1d1d1f;--mute:#666;--box:#f4f5f7;--hov:#e9eaed;--math:#d9730d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--ok:#3fb950;--ko:#f05252;--ac:#5b9dff;--qt:#e0b040;--me:#b48cf0;--bg:#161618;--fg:#e8e8ea;--mute:#9a9aa0;--box:#222226;--hov:#2e2e33;--math:#ffa344}}
:root[data-theme=dark]{color-scheme:dark;--ok:#3fb950;--ko:#f05252;--ac:#5b9dff;--qt:#e0b040;--me:#b48cf0;--bg:#161618;--fg:#e8e8ea;--mute:#9a9aa0;--box:#222226;--hov:#2e2e33;--math:#ffa344}
body{background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif;max-width:max(760px,50vw);margin:0 auto;padding:16px 16px calc(var(--fh, 140px) + 16px);box-sizing:border-box;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
#n,.n{color:var(--mute);margin:8px 0}
/* El cluster de la pregunta, siempre a la vista encima del enunciado. En la página de estudio, el mismo estilo titula cada bloque. */
#c,.estudio h2{color:var(--k,var(--ac));font-size:1.05em;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0 0 22px}
/* Un hueco claro separa el enunciado de la primera opción. */
#q,.q{font-size:1.05em;margin:0 0 22px}
#q p,.q p{margin:.4em 0}
button{font:inherit;color:inherit;background:none;cursor:pointer}
.row{display:flex;gap:6px;margin:8px 0}
.opt{flex:1;min-width:0;display:flex;gap:10px;text-align:left;padding:8px 12px;border:0;border-radius:4px;background:var(--box);overflow-x:auto}
.opt:not(:disabled):hover,.x:hover,#m button:hover,#u a:hover,.tile a:hover,#th:hover,#hq:hover{background:var(--hov)}
.x{flex:none;width:40px;border:0;border-radius:4px;background:var(--box);color:var(--mute)}
.x[aria-pressed=true]{color:var(--fg);background:var(--hov)}
.row.out .opt{opacity:.45;text-decoration:line-through}
/* El tachado no entra en las cajas inline-block de KaTeX: cada fórmula lleva el suyo. */
.row.out .opt .katex .base{text-decoration:line-through}
.opt b{flex:none}
.cb{flex:none;width:.95em;height:.95em;margin-top:.25em;border:1.5px solid currentColor;border-radius:3px;display:grid;place-items:center;font-style:normal;font-size:.95em;line-height:1}
.opt.sel .cb::after{content:"✓";font-weight:700}
.opt.sel{background:color-mix(in srgb,var(--ac) 22%,var(--bg))}.opt.sel:not(:disabled):hover{background:color-mix(in srgb,var(--ac) 32%,var(--bg))}
.opt.ok,.opt.ok:hover{background:color-mix(in srgb,var(--ok) 22%,transparent)}
.opt.ko,.opt.ko:hover{background:color-mix(in srgb,var(--ko) 22%,transparent)}
.opt:disabled{cursor:default}
#e,.e{background:var(--box);border-radius:6px;padding:4px 14px;margin-top:12px;overflow-x:auto}
[hidden]{display:none!important}
/* El mapa siempre está a la vista. Si cabe junto al test, es la lista de preguntas, con el número y el comienzo del enunciado,
   a 24px del borde izquierdo, con la mitad del ancho del hueco hasta la pregunta, centrada en vertical en el espacio que queda sobre la botonera.
   --fh es la altura de la botonera. Si no cabe, es una barra de números fija arriba.
   El mapa se desplaza sin barra de scroll visible. Cada fila recorta su texto y lo difumina al final: los puntos suspensivos no tapan los subíndices de KaTeX, que están posicionados.
   position:relative recorta también el MathML oculto de KaTeX, que es absoluto y si no ensancha la lista. */
#m{display:flex;gap:4px;position:sticky;top:var(--uh,0px);z-index:1;background:var(--bg);overflow-x:auto;padding:6px 3px;margin:0 0 8px;scrollbar-width:none}
#m button{flex:none;min-width:30px;padding:2px 4px;font-size:.75em;border:0;border-radius:4px;background:var(--box)}
#m button:not(.tog)>span{display:none}
#m .tog{display:none}
/* Cada cluster abre su bloque en el mapa. En la barra y en la columna comprimida, su cabecera es un punto; en la columna, también el primero, que guarda el sitio de su nombre. */
#m .grp{flex:none;align-self:center;font-size:0;color:var(--k,var(--mute))}
#m .grp::before{content:"•";font-size:14px}
#m .tog+.grp{display:none}
@media (min-width:1140px){
  /* El mapa se centra en el hueco entre la barra de arriba, --uh, y la botonera, --fh, para que la barra no tape su botón de comprimir. */
  #m{position:fixed;top:calc((100vh - var(--fh, 140px) + var(--uh, 0px)) / 2);transform:translateY(-50%);left:24px;width:calc((50vw - max(380px, 25vw) - 32px) / 2);max-height:calc(100vh - var(--fh, 140px) - var(--uh, 0px) - 48px);flex-direction:column;overflow:auto;padding:4px;margin:0;box-sizing:border-box;scroll-padding-top:2.6em}
  #m button{display:flex;gap:8px;align-items:baseline;text-align:left;font-size:.8em;padding:4px 8px}
  /* La columna de la etiqueta cabe T10 o P10, así que los títulos empiezan todos a la misma altura. */
  #m button>b{flex:none;min-width:2.4em}
  /* Alto fijo: una fórmula en el comienzo del enunciado no alarga su fila, y la lista comprimida mide lo mismo. */
  #m button:not(.tog){height:calc(1.5em + 10px);box-sizing:border-box}
  /* flex:1 lleva la caja al borde de la fila: el difuminado cae donde se corta el texto, y un texto que cabe no se difumina. */
  #m button:not(.tog)>span{display:block;flex:1;position:relative;min-width:0;white-space:nowrap;overflow:hidden;mask-image:linear-gradient(to right,#000 calc(100% - 2.5em),transparent)}
  /* El botón de arriba comprime la lista y la vuelve a desplegar. Comprimida, es una columna de casillas numeradas en el mismo sitio: cada fila y cada cabecera conservan su altura, así que la lista no se mueve.
     La cabecera es entonces un punto, y su nombre, transparente y de ancho 0, guarda el alto sin ensanchar la columna. */
  /* Un halo del color de la página tapa el relleno de arriba y el hueco de abajo: ninguna fila asoma por encima ni pasa visible por debajo. */
  #m .tog{display:block;position:sticky;top:-4px;z-index:1;background:var(--box);font-weight:600;box-shadow:0 0 0 4px var(--bg)}
  #m .grp{align-self:stretch;position:relative;font-size:.7em;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:10px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #m .grp::before{content:none}
  #m .tog+.grp{display:block;padding-top:4px}
  body.fold #m{width:auto}
  body.fold #m .grp{color:transparent;width:0;min-width:100%;box-sizing:border-box}
  body.fold #m .grp::before{content:"•";position:absolute;left:0;right:0;bottom:0;text-align:center;color:var(--k,var(--mute))}
  body.fold #m button:not(.tog){justify-content:center;padding:4px 6px}
  body.fold #m button>b{min-width:0}
  body.fold #m button:not(.tog)>span{display:none}
}
#m .ans{background:color-mix(in srgb,#1e6fd9 45%,transparent)}#m .ans:hover{background:color-mix(in srgb,#1e6fd9 62%,transparent)}
#m .ok{background:color-mix(in srgb,var(--ok) 45%,transparent)}#m .ok:hover{background:color-mix(in srgb,var(--ok) 62%,transparent)}
#m .ko{background:color-mix(in srgb,var(--ko) 45%,transparent)}#m .ko:hover{background:color-mix(in srgb,var(--ko) 62%,transparent)}
#m .part{background:color-mix(in srgb,#e0b000 50%,transparent)}#m .part:hover{background:color-mix(in srgb,#e0b000 68%,transparent)}
/* La pregunta o la sección donde estás va resaltada en amarillo claro, en los dos temas, con el texto oscuro para que se lea. */
#m .cur{font-weight:700;background:#fff1a8;color:#1d1d1f}#m .cur:hover{background:#ffe57a}
/* Los botones que piden a Claude una explicación son solo un «?», con su texto al pasar el ratón; al pasar el ratón o al pulsarlos, el fondo se vuelve naranja Claude. */
/* El «?» lleva un velo del color del texto, y no un gris fijo: así contrasta con cualquier fondo, también con el gris del panel de la solución. */
.ask{width:40px;padding:4px 0;border:0;border-radius:4px;background:color-mix(in srgb,var(--fg) 14%,transparent);font-weight:700}
.ask:hover,.ask:active,.ask:focus-visible{background:#d97757;color:#fff}
/* Los tres van en la esquina superior derecha de su marco, en la cabecera .hd: el de explicar la pregunta, el de un apartado y el de la solución.
   En un apartado van fuera de la cabecera, en .her, con el ✎ a la izquierda del «?». */
.hd{display:flex;align-items:center;gap:12px}.hd>.ask{order:1;flex:none;margin-left:auto}
/* La fila del botón de la solución, al pie de una tarjeta de la página de estudio. */
.qa{display:flex;justify-content:flex-end;margin:6px 0 0}
/* Una sola fila de botones del mismo tamaño, para dejar el alto a la pregunta: repasar y volver a la izquierda, la solución a la derecha.
   La fila va centrada en la pantalla. Cada botón mide hasta 240px, lo que pide la etiqueta más larga; si no cabe, encoge y parte su etiqueta.
   En una pantalla estrecha, la fila se parte en dos. El botón de la solución de una pregunta de la página de estudio, .chk, es el mismo botón. */
nav{display:flex;justify-content:center;gap:8px}
nav button,.chk{flex:0 1 240px;min-width:0;padding:10px;border:0;border-radius:6px;font-weight:600;background:color-mix(in srgb,var(--c,#888) 28%,transparent)}
nav button:disabled{opacity:.4;cursor:default}
/* Todo lo que se pulsa se resalta un poco al pasar el ratón: los botones de color ganan color, y un enlace del texto lleva un fondo suave. */
nav button:not(:disabled):hover,.chk:hover{background:color-mix(in srgb,var(--c,#888) 45%,transparent)}
@media (max-width:700px){nav{flex-wrap:wrap}nav button{flex:1 1 30%}}
#p,#x{--c:#1e6fd9}#s,.chk{--c:#e08a00}#r{--c:#c62828}#t{--c:#7b3fc4}
button:focus-visible{outline:2px solid currentColor}
.ic{display:inline-block;font-weight:400;font-size:1.15em;line-height:1}
.katex{color:var(--math)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* En una opción, la columna de ecuaciones arranca a la izquierda, junto a su letra.
   El texto ocupa todo el ancho: encogido a su contenido, el bloque desborda 2px y saca una barra de scroll. */
.opt>span{flex:1;min-width:0}.opt .katex-display{margin:.2em 0}.opt .katex-display>.katex{text-align:left}
#q img,#e img,.q img,.e img,.h img{display:block;max-width:100%;height:auto;margin:8px auto;border:1px solid #8888;border-radius:4px}
figcaption{text-align:center;font-size:.85em;color:var(--mute)}
/* Código de colores de la solución: respuesta en verde, títulos de paso en azul, comentario de cada opción con la banda de su veredicto, extractos de la lecture en ámbar.
   En la página de estudio, el ámbar marca también la cita literal del curso. */
#e blockquote,.e blockquote,.h blockquote{margin:8px 0;padding:4px 12px;border-radius:4px;background:color-mix(in srgb,var(--qt) 12%,transparent)}
#e .ansl,.e .ansl{color:var(--ok)}
#e p>b:first-child,.e p>b:first-child{color:var(--ac)}
#e .cm,.e .cm{padding:4px 10px;margin:10px 0;border-radius:4px;background:color-mix(in srgb,var(--c) 10%,transparent)}
#e .cok,.e .cok{--c:var(--ok)}#e .cko,.e .cko{--c:var(--ko)}
#e .ansl>b:first-child,#e .cok>b:first-child,.e .ansl>b:first-child,.e .cok>b:first-child{color:var(--ok)}#e .cko>b:first-child,.e .cko>b:first-child{color:var(--ko)}
/* Todo va con las esquinas redondeadas, también una tabla: su borde exterior es el de la tabla, y cada celda pinta solo su línea izquierda y la de arriba. */
table{border-collapse:separate;border-spacing:0;border:1px solid #888;border-radius:4px;margin:6px 0}td,th{border:0;border-left:1px solid #888;border-top:1px solid #888;padding:2px 8px;text-align:center}th::first-letter{text-transform:uppercase}
tr>:first-child{border-left:0}table>:first-child>tr:first-child>*{border-top:0}
pre,code{border-radius:4px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid #8886}
footer>div{margin:0 auto;padding:10px 16px;box-sizing:border-box}
#th,#hq{position:fixed;right:12px;bottom:12px;z-index:2;width:38px;height:38px;border:0;border-radius:50%;background:var(--box);font-size:18px}
/* En la página de estudio con preguntas, el botón P, a la izquierda del de tema, oculta las preguntas y sus filas del índice, para leer solo la teoría. */
/* Con las preguntas ocultas, un tachón rojo en diagonal cruza el botón (decisión del usuario). */
#hq{right:58px;font-size:15px;font-weight:700}#hq[aria-pressed=true]{color:var(--mute)}
#hq[aria-pressed=true]::after{content:"";position:absolute;left:7px;right:7px;top:calc(50% - 1.5px);height:3px;border-radius:2px;background:var(--ko);transform:rotate(-45deg)}
body.sinp .p,body.sinp #m button:not(.tog,.sr){display:none}
/* El botón de tema no tapa la botonera: el mismo relleno a los dos lados la deja centrada. */
@media (max-width:1620px){footer>div{padding:10px 62px}}
/* La pregunta va siempre centrada y no se mueve. La solución abierta es un rectángulo fijo en el hueco entre la pregunta y el borde derecho,
   a 24px de la pregunta, de los bordes y de la línea de la botonera, con su propio scroll. La columna mide max(760px, 50vw), así que 50vw + max(380px, 25vw) es el borde derecho de la pregunta, y 8px más su relleno de 16px dan los 24px.
   El panel mide 25vw - 32px, y su texto 25vw - 75px, con el relleno y la barra de scroll. Desde 3340px cabe en él una fórmula de 760px,
   la que cabe en la columna de lectura (decisión del usuario): por debajo, el panel cortaría las fórmulas, y la solución sale debajo de las opciones. */
@media (min-width:3340px){
  body.split #e{position:fixed;z-index:3;top:calc(var(--uh, 0px) + 24px);bottom:calc(var(--fh, 140px) + 24px);left:calc(50vw + max(380px, 25vw) + 8px);right:24px;margin:0;overflow-y:auto;box-sizing:border-box;border-radius:6px;box-shadow:0 8px 28px #0005}
}

/* La página de estudio y la parrilla del curso: la lectura ocupa la mitad de la pantalla, centrada, y nunca menos que el test. Sin botonera, el mapa se centra en toda la altura. */
body.estudio,body.parrilla{display:block;min-height:0;max-width:max(760px,50vw);padding-bottom:64px}
/* La barra de la unidad: la parrilla y las pestañas de las vistas, centradas arriba y fijas al hacer scroll, sobre el mapa de la barra estrecha. barra() fija --uh, su alto.
   En el test va encima de la página, que se centra en vertical. */
#u{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;padding:8px 0;position:sticky;top:0;z-index:2;background:var(--bg)}
.test #u{position:fixed;left:0;right:0}body.test:has(#u:not([hidden])){padding-top:60px}
#u a,.tile a{padding:4px 12px;border-radius:4px;color:inherit;text-decoration:none;font-size:.85em;background:var(--box)}
#u a[aria-current]{background:var(--ac);color:#fff}#u a[aria-current]:hover{background:color-mix(in srgb,var(--ac) 85%,var(--fg))}
/* Una casilla por unidad. Todas miden lo mismo, la fila más alta fija el alto de todas, y van sin color: grises sobre negro o sobre blanco, según el tema. Solo el título de la página lleva color. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-rows:1fr;gap:16px;margin:28px 0}
/* Con varios grupos, cada parrilla lleva su título, sin color: en la parrilla, solo el título de la página lleva color. */
.parrilla h2{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;font-size:1.6em;font-weight:700;margin:44px 0 0}.parrilla h2+.grid{margin-top:16px}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:6px;background:var(--box);cursor:pointer}
.tile:hover{background:var(--hov)}
/* Sin borde, el enlace de una vista se separa de su casilla con un velo del color del texto, que se nota sobre el gris y sobre el gris oscurecido. */
.tile a{background:color-mix(in srgb,var(--fg) 8%,transparent)}.tile a:hover{background:color-mix(in srgb,var(--fg) 16%,transparent)}
.tile>b{color:var(--mute);font-size:.8em;text-transform:uppercase;letter-spacing:.04em}
.tile>span{flex:1;font-weight:600;line-height:1.3}
.tile>p{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.h a[data-t]{cursor:pointer}
.h a:hover{background:color-mix(in srgb,var(--ac) 16%,transparent);border-radius:3px}
.estudio #m .grp:hover{background:var(--hov);border-radius:4px}
/* Los títulos van en color, para distinguirlos del texto: la página en el azul del cluster, y cada bloque, o cada cluster del test, en el suyo, --k.
   Es uno de cinco colores, que se repiten: lo llevan el título del bloque o el nombre del cluster, el título y el fondo de sus apartados, el marco de sus preguntas y su cabecera en el índice.
   Ninguno es el verde, el rojo, el amarillo, el morado ni el ámbar, que ya dicen acierto, fallo, incompleta, lo mío y cita. */
/* --sf es cuánto color del bloque lleva el fondo de un apartado: sobre blanco hace falta más que sobre negro para que se note. */
:root{--k0:#1e6fd9;--k1:#0a8a80;--k2:#5f6b7a;--k3:#b8327a;--k4:#5b5bd6;--sf:16%}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--k0:#5b9dff;--k1:#2cc0b2;--k2:#a3aebb;--k3:#e86aa8;--k4:#9a9af2;--sf:9%}}
:root[data-theme=dark]{--k0:#5b9dff;--k1:#2cc0b2;--k2:#a3aebb;--k3:#e86aa8;--k4:#9a9af2;--sf:9%}
.estudio h1,.parrilla h1{color:var(--ac)}
.estudio section h3{color:var(--k)}
/* La tarjeta de una pregunta, en el test (#k) y en la página de estudio, lleva el fondo de la página y un borde fino del color de su sección. */
.p{background:none;border:1px solid color-mix(in srgb,var(--k) 60%,transparent)}
/* Los títulos llevan una fuente distinta de la del texto (serif del sistema, sin descargar nada) y son más grandes. */
.estudio h1,.parrilla h1,.estudio h2,.estudio h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;overflow-wrap:anywhere}
.estudio h1,.parrilla h1{font-size:2.5em;line-height:1.2;margin:28px 0 4px}
.estudio .sub,.parrilla .sub{color:var(--mute);margin:0 0 8px}
/* El título de un bloque es grande y deja un hueco claro con lo anterior. */
.estudio h2{font-size:2.1em;line-height:1.2;margin:140px 0 16px}
.estudio h3{font-size:1.5em;line-height:1.25;margin:28px 0 6px}
/* Cada apartado va en un recuadro con las esquinas redondeadas, a todo el ancho de la columna, con un fondo del color de su bloque (decisión del usuario). Lo separa de los demás un hueco grande. */
.estudio section{border-radius:6px;padding:2px 20px 12px;margin:64px 0;background:color-mix(in srgb,var(--k) var(--sf),transparent)}
/* El primer apartado de un bloque queda cerca del título del bloque: el hueco grande es solo entre apartados. */
.estudio h2+section{margin-top:0}
.estudio section>.hd{margin:14px 0 6px}.estudio .hd>h3{margin:0;padding-right:98px}
/* El ✎ y el «?» de un apartado bajan con el scroll mientras el apartado está en pantalla (decisión del usuario), y se paran en el borde inferior de su recuadro.
   .her es sticky y alto como sus botones, 14px de margen y 34px de botón: un sticky se para cuando su caja con márgenes toca el final del contenido del apartado.
   Su margin-bottom de -12px, el padding inferior del apartado, lleva ese tope hasta el borde del recuadro.
   El margin-top de -34px del título le devuelve el sitio que .her ocupa: se funde con el -12px y deja el título a 14px del borde, como si .her no estuviera.
   El título les deja el hueco a la derecha. Sobre el texto llevan un fondo opaco, el mismo velo sobre el fondo del apartado.
   Por debajo de 1140px el índice es una barra fija arriba, de unos 30px de alto, y los botones quedan 10px por debajo de ella. */
.estudio section>.her{position:sticky;top:calc(var(--uh,0px) + 12px);z-index:1;height:48px;margin-bottom:-12px;display:flex;justify-content:flex-end;gap:6px}
.estudio section>.her+.hd{margin-top:-34px}
.her>.ask{margin-top:14px;height:34px}.her>.ask:not(:hover,:active,:focus-visible){background:color-mix(in srgb,var(--fg) 14%,color-mix(in srgb,var(--k) var(--sf),var(--bg)))}
@media (max-width:1139px){.estudio section>.her{top:calc(var(--uh,0px) + 26px)}}
.estudio [id^=b]{scroll-margin-top:calc(var(--uh,0px) + 56px)}
.h td,.h th{text-align:left}
/* Una tabla más ancha que la columna se desplaza dentro de su caja, y no ensancha la página a 375px.
   position:relative la hace contenedora del MathML oculto de KaTeX, que va en absoluto y si no escapa del recorte. */
#q table,#e table,.q table,.e table,.h table{display:block;position:relative;width:fit-content;max-width:100%;overflow-x:auto}
/* Una foto o un objeto va al 40% de la columna, y un esquema que se lee al 70%. Sin clase, la imagen ocupa la columna. */
.h img.cosa{max-width:40%}.h img.esq{max-width:70%}
/* Un esquema SVG con width fijo encoge en una pantalla estrecha: su viewBox conserva la proporción. */
/* Solo los esquemas: KaTeX dibuja la raíz y las flechas con SVG de alto fijo, y height:auto los deja a 0 de alto.
   Un esquema va centrado en la columna, como una imagen, en una sección, en un enunciado y en una solución. */
#q svg:not(.katex svg),#e svg:not(.katex svg),.q svg:not(.katex svg),.e svg:not(.katex svg),.h svg:not(.katex svg){display:block;margin-left:auto;margin-right:auto;max-width:100%;height:auto}
/* Lo que no es del curso va en un recuadro sin borde, con su etiqueta escrita en color y un fondo tenue del mismo color: morado lo mío, azul el rumbo que abre cada apartado, gris la duda, rojo el error de la diapositiva. */
.b{padding:4px 12px;margin:12px 0;border-radius:4px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.b>b:first-child,.b>p:first-child>b:first-child,.rumbo p>b:first-child{color:var(--c)}
.mio{--c:var(--me)}.rumbo{--c:var(--ac)}.err{--c:var(--ko)}.duda{--c:var(--mute)}
span.mio,td.mio{background:color-mix(in srgb,var(--me) 14%,transparent);border-radius:3px}
/* Una cadena A → B → C en cajas con borde fino, unidas por una línea con su punta, como un esquema SVG. Se parte sola en una pantalla estrecha.
   La sangría francesa deja dentro de la caja la flecha que abre cada línea partida: la cadena reserva su hueco a la izquierda, y el primer paso lo recupera. */
.flow{--ln:color-mix(in srgb,var(--fg) 65%,transparent);display:flex;flex-wrap:wrap;align-items:center;gap:10px 30px;margin:16px 0;padding-left:30px}
.flow>:first-child{margin-left:-30px}
.flow>*{position:relative;border-radius:6px;padding:5px 14px;border:1.5px solid var(--ln)}
.flow>*+*::before{content:"";position:absolute;left:-31.5px;top:calc(50% - .75px);width:24px;border-top:1.5px solid var(--ln)}
.flow>*+*::after{content:"";position:absolute;left:-8px;top:calc(50% - 4px);border:4px solid transparent;border-right:0;border-left:6.5px solid var(--ln)}
/* El hilo de la clase: una línea de tiempo vertical, con un punto numerado por parte. Debajo del nombre de la parte va su pregunta, y en gris lo que deja, con el relevo en blanco. */
ol.hilo{list-style:none;counter-reset:hilo;margin:16px 0 16px 13px;padding:0 0 0 28px;border-left:2px solid color-mix(in srgb,var(--k,var(--ac)) 45%,transparent)}
ol.hilo>li{counter-increment:hilo;position:relative;padding:0 0 22px;margin:0}
ol.hilo>li:last-child{padding-bottom:0}
ol.hilo>li::before{content:counter(hilo);position:absolute;left:-43px;top:0;width:26px;height:26px;border-radius:50%;background:var(--k,var(--ac));color:#fff;font-size:.8em;font-weight:700;display:grid;place-items:center}
ol.hilo>li>span{display:block;color:var(--k,var(--ac));font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.85em}
ol.hilo>li>b{display:block}
ol.hilo>li>p{margin:4px 0 0;color:var(--mute)}
ol.hilo>li>p b{color:var(--fg)}
/* Una gráfica de grafica(): el SVG y un deslizador por parámetro. */
.viz{background:var(--box);border-radius:6px;padding:8px 12px;margin:12px auto;max-width:728px;box-sizing:border-box}
.viz svg{display:block;width:100%;height:auto}
.viz label{display:flex;gap:10px;align-items:center;font-size:.9em}.viz input{flex:1;accent-color:var(--ac)}
/* Una pregunta es una tarjeta del ancho del test, con su «?» y su contador arriba. En la página de estudio va centrada, con el botón de la solución al pie; en el test, #k, va bajo el cluster. */
.p{position:relative;box-sizing:border-box;margin:20px auto;padding:10px 16px 14px;border-radius:6px}
#k.p{margin:0;width:100%}
/* Desde 3340px, la solución abierta es el panel del test, a 24px de la tarjeta y del borde derecho, a la altura de su pregunta: con menos, no cabe una fórmula de 760px. */
@media (min-width:3340px){
  .estudio .p .e{position:absolute;z-index:3;top:0;left:calc(100% + 24px);width:calc(var(--cw, 100vw) / 2 - max(380px, 25vw) - 32px);max-height:calc(100vh - 48px);margin:0;overflow-y:auto;box-sizing:border-box;border-radius:6px;box-shadow:0 8px 28px #0005}
}
/* El mapa es el índice de la página: una cabecera por bloque, una fila T1, T2… por apartado y una P1, P2… por pregunta. Ocupa el hueco a la izquierda de la lectura.
   --cw es el ancho visible sin la barra de scroll de la página, que el test no tiene; lo fija estudio(). */
@media (min-width:1140px){.estudio #m{width:calc((var(--cw, 100vw) - max(760px, 50vw)) / 2 - 48px)}.estudio #m .grp{cursor:pointer}}
/* En la barra estrecha, cada bloque lleva su nombre corto, para navegar también la página sin preguntas; los apartados se quedan en la lista ancha. */
@media (max-width:1139px){
  .estudio #m .grp,.estudio #m .tog+.grp{display:block;font-size:.7em;font-weight:600;text-transform:uppercase;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:0 4px}
  .estudio #m .grp::before{content:none}
  .estudio #m .sr{display:none}
}
</style>
</head>
<body>
<div id="u" hidden></div>
<div id="m"></div>
<p id="c"></p>
<div id="k" class="p"><p class="n hd"><button id="w" class="ask">?</button><span id="n"></span></p><div id="q"></div><div id="o"></div></div>
<div id="e" hidden></div>
<footer><div>
<nav><button id="r"></button><button id="t" hidden></button><button id="p"></button><button id="x"></button><button id="s"></button></nav>
</div></footer>
<button id="hq" hidden>P</button>
<button id="th" aria-label="Light / dark">◐</button>

<!-- Los bloques de cada vista, como texto: solo se evalúan los de la vista que se abre. -->
<script type="text/plain" id="d0-test">
{i:"Why constraints need special care", c: "The Lagrange relaxation",q:String.raw`<p>Consider the single-variable nonlinear program</p>$$\begin{aligned}\min\ & f(x)=3x^2-12x+7\\ \text{s.t.}\ & 2x+3\le 5\\ & x\ge -1.\end{aligned}$$<p>What is its optimal solution?</p>`,
o:[String.raw`$x^*=1$, with $f(x^*)=-2$.`,String.raw`$x^*=2$, with $f(x^*)=-5$.`,String.raw`$x^*=-1$, with $f(x^*)=22$.`,String.raw`$x^*=1$, with $f(x^*)=-5$.`,NONE],ok:[0],
e:String.raw`<p><b>1. Convexity.</b> $$\begin{aligned}f''(x)&=6\\ &&gt;0,\end{aligned}$$ so $f$ is convex.</p>
<p><b>2. FOC.</b></p>
$$\begin{aligned}f'(x)&=6x-12\\ &=0\\ 6x&=12\\ \bar x&=\tfrac{12}{6}\\ &=2\end{aligned}$$
<p><b>3. Feasible set.</b></p>
$$\begin{aligned}2x+3\le 5\ &\Leftrightarrow\ x\le 1\\ x&\ge -1\end{aligned}$$
<p>So $\bar x=2$ is infeasible.</p>
<blockquote>For a single-variate convex NLP, the feasible solution that is closest to the FOC solution is optimal.</blockquote>
<p>The feasible point closest to 2 is $x^*=1$:</p>
$$\begin{aligned}f(x^*)&=f(1)\\ &=3\cdot1^2-12\cdot1+7\\ &=3-12+7\\ &=-2\end{aligned}$$`,
d:["",String.raw`Ignores the constraints: $\bar x=2$ violates $x\le 1$.`,
String.raw`Takes the feasible point farthest from the FOC solution: $f(-1)=22$ is the worst value of the interval.$$\begin{aligned}f(-1)&=3\cdot(-1)^2-12\cdot(-1)+7\\ &=3+12+7\\ &=22\end{aligned}$$`,
String.raw`Keeps the right point but reports the unconstrained value $f(2)=-5$, which no feasible point reaches.$$\begin{aligned}f(2)&=3\cdot2^2-12\cdot2+7\\ &=12-24+7\\ &=-5\end{aligned}$$`,""]},

{i:"Why constraints need special care", c: "The Lagrange relaxation",q:String.raw`<p>Consider</p>$$\begin{aligned}\min_{x\in\mathbb{R}^2}\ & f(x)=4(x_1-2)^2+(x_2-3)^2\\ \text{s.t.}\ & x_1+x_2\le 3.\end{aligned}$$<p>Which statements are correct?</p>`,m:true,
o:[String.raw`The FOC solution $\bar x=(2,3)$ is infeasible.`,
String.raw`The feasible point closest to $\bar x$, in Euclidean distance, is $(1,2)$.`,
String.raw`The feasible point closest to $\bar x$ is optimal, because $f$ is convex.`,
String.raw`The point $(\tfrac85,\tfrac75)$ has a lower objective value than $(1,2)$.`,
String.raw`At any optimal solution the constraint is nonbinding: $x_1+x_2&lt;3$.`],ok:[0,1,3],
e:String.raw`<p><b>1. FOC.</b></p>
$$\begin{aligned}\nabla f(x)&=\big(8(x_1-2),\ 2(x_2-3)\big)\\ &=(0,0)\\ \bar x&=(2,3)\\ \bar x_1+\bar x_2&=2+3\\ &=5\\ &&gt;3\end{aligned}$$
<p><b>2. Closest feasible point.</b> Move from $\bar x$ along the normal $(1,1)$ of the line $x_1+x_2=3$:</p>
$$\begin{aligned}(2-t)+(3-t)&=3\\ 5-2t&=3\\ t&=1\\ \text{point}&=(2-1,\ 3-1)\\ &=(1,2)\\ f(1,2)&=4\,(1-2)^2+(2-3)^2\\ &=4\cdot(-1)^2+(-1)^2\\ &=4+1\\ &=5\end{aligned}$$
<p><b>3. A better point on the line.</b> Substitute $x_2=3-x_1$:</p>
$$\begin{aligned}h(x_1)&=4(x_1-2)^2+(3-x_1-3)^2\\ &=4(x_1-2)^2+x_1^2\\ h'(x_1)&=8(x_1-2)+2x_1\\ &=8x_1-16+2x_1\\ &=10x_1-16\\ &=0\\ x_1&=\tfrac{16}{10}\\ &=\tfrac85\\ x_2&=3-\tfrac85\\ &=\tfrac75\\ f(\tfrac85,\tfrac75)&=4\big(\tfrac85-2\big)^2+\big(\tfrac75-3\big)^2\\ &=4\cdot\big(-\tfrac25\big)^2+\big(-\tfrac85\big)^2\\ &=4\cdot\tfrac{4}{25}+\tfrac{64}{25}\\ &=\tfrac{16}{25}+\tfrac{64}{25}\\ &=\tfrac{80}{25}\\ &=\tfrac{16}{5}\end{aligned}$$
<p>$\tfrac{16}{5}&lt;5$: the closest feasible point is not optimal. The rule "closest is optimal" holds for a single variable only. With two variables, unequal weights stretch the level sets into ellipses:</p>

{i:"The Lagrangian and its rewards", c: "The Lagrange relaxation",q:String.raw`<p>Consider the nonlinear program</p>$$\begin{aligned}\max\ & x_1+2x_2\\ \text{s.t.}\ & x_1^2+x_2^2\le 9\\ & x_1-x_2\ge 1.\end{aligned}$$<p>You relax both constraints with Lagrange multipliers $\lambda_1,\lambda_2\ge 0$, with each constraint written as $g_i(x)\le b_i$. What is the Lagrangian $\mathcal{L}(x|\lambda)$?</p>`,
o:[String.raw`$x_1+2x_2+\lambda_1(9-x_1^2-x_2^2)+\lambda_2(x_1-x_2-1)$`,
String.raw`$x_1+2x_2+\lambda_1(9-x_1^2-x_2^2)+\lambda_2(1-x_1+x_2)$`,
String.raw`$x_1+2x_2-\lambda_1(9-x_1^2-x_2^2)-\lambda_2(x_1-x_2-1)$`,
String.raw`$x_1+2x_2+\lambda_1(x_1^2+x_2^2-9)+\lambda_2(x_1-x_2-1)$`,NONE],ok:[0],
e:String.raw`<p><b>1. Write each constraint as $g_i(x)\le b_i$.</b></p>
$$\begin{aligned}g_1(x)&=x_1^2+x_2^2\\ &\le 9\\ g_2(x)&=-x_1+x_2\\ &\le -1\end{aligned}$$
<p><b>2. Add the reward $\lambda_i[b_i-g_i(x)]$ of each constraint.</b></p>
$$\begin{aligned}\lambda_1[b_1-g_1(x)]&=\lambda_1(9-x_1^2-x_2^2)\\ \lambda_2[b_2-g_2(x)]&=\lambda_2(-1+x_1-x_2)\end{aligned}$$
<blockquote>$\mathcal{L}(x|\lambda)=f(x)+\sum_{i=1}^m\lambda_i[b_i-g_i(x)]$ is the Lagrangian given $\lambda$.</blockquote>
<p><b>Check.</b> A feasible point, for example $(2,0)$, gets nonnegative rewards:</p>
$$\begin{aligned}b_1-g_1(2,0)&=9-2^2-0^2\\ &=9-4-0\\ &=5\\ &\ge 0\\ b_2-g_2(2,0)&=-1+2-0\\ &=1\\ &\ge 0\end{aligned}$$`,
d:["",String.raw`Applies $b_i-g_i$ to the $\ge$ constraint without rewriting it. The term is then negative at every strictly feasible point: it penalizes feasibility.`,
String.raw`Subtracts the rewards: with $\lambda\ge 0$, this penalizes feasible points and rewards violations.`,
String.raw`Uses $g_1-b_1$ for the first constraint, so the sign of its reward is reversed.`,""]},

{i:"The Lagrangian and its rewards", c: "The Lagrange relaxation",q:String.raw`<p>For a maximization NLP with constraints $g_i(x)\le b_i$, the Lagrange relaxation with multipliers $\lambda$ is</p>$$z^L(\lambda)=\max_{x\in\mathbb{R}^n}\ f(x)+\sum_{i=1}^m\lambda_i\big[b_i-g_i(x)\big].$$<p>Which statements are correct?</p>`,m:true,
o:[String.raw`If $\lambda_i&gt;0$ and $\bar x$ satisfies constraint $i$ with slack, the term $\lambda_i[b_i-g_i(\bar x)]$ is positive and raises the relaxed objective.`,
String.raw`If $\lambda_i&gt;0$ and $\bar x$ violates constraint $i$, the term $\lambda_i[b_i-g_i(\bar x)]$ is negative: the violation is penalized.`,
String.raw`The relaxed problem still forbids any violation of the constraints; it only adds rewards.`,
String.raw`With $\lambda=0$, the relaxed problem always has the same optimal value as the original NLP.`,
String.raw`In this form, the multipliers must satisfy $\lambda_i\le 0$ to reward feasibility.`],ok:[0,1],
e:String.raw`<blockquote>For constraint $i$, let's associate a unit reward $\lambda_i\ge 0$ with it. If a solution $\bar x$ satisfies constraint $i$ (so $b_i-g_i(\bar x)\ge 0$), "reward" the solution by $\lambda_i[b_i-g_i(\bar x)]$.</blockquote>
<p>When $\lambda_i&gt;0$, the sign of the term is the sign of the slack $b_i-g_i(\bar x)$:</p>
$$\begin{aligned}\text{slack}&gt;0:&\quad \text{term}&gt;0\ \text{(reward)}\\ \text{slack}&lt;0:&\quad \text{term}&lt;0\ \text{(penalty)}\end{aligned}$$
<p>The constraints are removed: a violation is allowed, but it costs. With $\lambda=0$ nothing is left of them, so $z^L(0)$ is the unconstrained maximum, which is only an upper bound on $z^*$.</p>`,
d:[String.raw`Correct: positive slack times positive multiplier.`,
String.raw`Correct: negative slack times positive multiplier.`,
String.raw`Wrong. The constraints are relaxed: the relaxed problem is solved over all of $\mathbb{R}^n$.`,
String.raw`Wrong. $z^L(0)$ is the unconstrained maximum. It equals $z^*$ only when an unconstrained optimum happens to be feasible.`,
String.raw`Wrong. A negative multiplier rewards violations; the multipliers must satisfy $\lambda_i\ge 0$.`]},

{i:"Computing the Lagrange relaxation", c: "The Lagrange relaxation",q:String.raw`<p>Consider</p>$$\begin{aligned}z^*=\max\ & 2x_1+4x_2\\ \text{s.t.}\ & x_1^2+x_2^2\le 5\\ & x_2\le 1.\end{aligned}$$<p>What is the value of its Lagrange relaxation $z^L(\lambda)$ at $$\begin{aligned}\lambda&=(\lambda_1,\lambda_2)\\ &=(1,2)\end{aligned}$$?</p>`,
o:[String.raw`$z^L(1,2)=2$`,String.raw`$z^L(1,2)=13$`,String.raw`$z^L(1,2)=6$`,String.raw`$z^L(1,2)=10$`,NONE],ok:[4],
e:String.raw`<p><b>1. The Lagrangian at $\lambda=(1,2)$.</b></p>
$$\begin{aligned}\mathcal{L}(x|\lambda)&=2x_1+4x_2+1\cdot(5-x_1^2-x_2^2)+2\,(1-x_2)\\ &=2x_1+4x_2+5-x_1^2-x_2^2+2-2x_2\\ &=(2x_1-x_1^2)+(4x_2-2x_2-x_2^2)+(5+2)\\ &=(2x_1-x_1^2)+(2x_2-x_2^2)+7\end{aligned}$$
<p><b>2. Maximize over $x\in\mathbb{R}^2$.</b> Each part is a concave parabola:</p>
$$\begin{aligned}\frac{\partial\mathcal{L}}{\partial x_1}&=2-2x_1\\ &=0\\ &\Rightarrow\ x_1=1\\ 2x_1-x_1^2&=2\cdot1-1^2\\ &=2-1\\ &=1\\ \frac{\partial\mathcal{L}}{\partial x_2}&=2-2x_2\\ &=0\\ &\Rightarrow\ x_2=1\\ 2x_2-x_2^2&=2\cdot1-1^2\\ &=2-1\\ &=1\end{aligned}$$
<p><b>3. Value.</b></p>
$$\begin{aligned}z^L(1,2)&=(2\cdot1-1^2)+(2\cdot1-1^2)+7\\ &=1+1+7\\ &=9\end{aligned}$$
<p>No option gives 9. For reference, $z^*=8$ at $x^*=(2,1)$, so 9 is a valid upper bound.</p>
$$\begin{aligned}f(x^*)&=2\cdot2+4\cdot1\\ &=4+4\\ &=8\end{aligned}$$`,
d:[String.raw`Forgets the constant terms of the rewards:$$\begin{aligned}5\lambda_1+1\cdot\lambda_2&=5\cdot1+1\cdot2\\ &=5+2\\ &=7\\ \max_x\big[(2x_1-x_1^2)+(2x_2-x_2^2)\big]&=1+1\\ &=2\end{aligned}$$`,
String.raw`Writes the second reward as $\lambda_2(x_2-1)$: the coefficient of $x_2$ becomes 6 and the constant 3.$$\begin{aligned}\mathcal{L}(x|\lambda)&=2x_1+4x_2+1\cdot(5-x_1^2-x_2^2)+2\,(x_2-1)\\ &=(2x_1-x_1^2)+(4x_2+2x_2-x_2^2)+(5-2)\\ &=(2x_1-x_1^2)+(6x_2-x_2^2)+3\\ \max_{x_2}\,(6x_2-x_2^2)&=6\cdot3-3^2\quad(x_2=3)\\ &=18-9\\ &=9\\ z^L&=1+9+3\\ &=13\end{aligned}$$`,
String.raw`Reports the objective at the maximizer $\hat x=(1,1)$ instead of the value of the Lagrangian:$$\begin{aligned}f(\hat x)&=2\cdot1+4\cdot1\\ &=2+4\\ &=6\end{aligned}$$`,
String.raw`Ignores the second multiplier: this is $z^L(1,0)$, where $4x_2-x_2^2$ peaks at $x_2=2$.$$\begin{aligned}z^L(1,0)&=(2\cdot1-1^2)+(4\cdot2-2^2)+5\cdot1\\ &=1+4+5\\ &=10\end{aligned}$$`,""]},

{i:"Computing the Lagrange relaxation", c: "The Lagrange relaxation",q:String.raw`<p>Consider</p>$$\begin{aligned}z^*=\max\ & 4x_1+2x_2\\ \text{s.t.}\ & x_1^2+x_2^2\le 25\\ & x_1\le 3.\end{aligned}$$<p>Let $z^L(\lambda)$ be its Lagrange relaxation. Which statements are correct?</p>`,m:true,
o:[String.raw`$z^L(1,0)=30$.`,String.raw`$z^L(0,4)=12$.`,String.raw`$z^L(\tfrac12,2)=22.5$.`,String.raw`$\lambda=(1,4)$ proves $z^*\le 38$.`,
String.raw`Since $z^L(\tfrac14,2)=20.25$, the optimal value is $z^*=20.25$.`],ok:[0,2,3],
e:String.raw`<p><b>1. The relaxation for $\lambda_1&gt;0$.</b> The Lagrangian separates:</p>
$$\begin{aligned}\mathcal{L}(x|\lambda)&=4x_1+2x_2+\lambda_1(25-x_1^2-x_2^2)+\lambda_2(3-x_1)\\ &=\big[(4-\lambda_2)x_1-\lambda_1x_1^2\big]\\ &\quad+\big[2x_2-\lambda_1x_2^2\big]+25\lambda_1+3\lambda_2\end{aligned}$$
<p>A concave parabola $ax-\lambda_1x^2$ peaks at $x=\tfrac{a}{2\lambda_1}$, with value $\tfrac{a^2}{4\lambda_1}$, so</p>
$$\begin{aligned}z^L(\lambda)&=\frac{(4-\lambda_2)^2}{4\lambda_1}+\frac{2^2}{4\lambda_1}+25\lambda_1+3\lambda_2\\ &=\frac{(4-\lambda_2)^2+4}{4\lambda_1}+25\lambda_1+3\lambda_2\end{aligned}$$
<p><b>2. Evaluate.</b></p>
$$\begin{aligned}z^L(1,0)&=\frac{(4-0)^2}{4\cdot1}+\frac{4}{4\cdot1}+25\cdot1+3\cdot0\\ &=\frac{16}{4}+\frac44+25+0\\ &=4+1+25+0\\ &=30\\[1mm] z^L(\tfrac12,2)&=\frac{(4-2)^2}{4\cdot\frac12}+\frac{4}{4\cdot\frac12}+25\cdot\tfrac12+3\cdot2\\ &=\frac42+\frac42+12.5+6\\ &=2+2+12.5+6\\ &=22.5\\[1mm] z^L(1,4)&=\frac{(4-4)^2}{4\cdot1}+\frac{4}{4\cdot1}+25\cdot1+3\cdot4\\ &=\frac04+\frac44+25+12\\ &=0+1+25+12\\ &=38\\[1mm] z^L(\tfrac14,2)&=\frac{(4-2)^2}{4\cdot\frac14}+\frac{4}{4\cdot\frac14}+25\cdot\tfrac14+3\cdot2\\ &=\frac41+\frac41+6.25+6\\ &=4+4+6.25+6\\ &=20.25\end{aligned}$$
<p><b>3. $\lambda_1=0$.</b> $\mathcal{L}=(4-\lambda_2)x_1+2x_2+3\lambda_2$ is linear, and $x_2\to\infty$ makes it unbounded: $z^L(0,\lambda_2)=\infty$.</p>
<blockquote><b>Proposition 1.</b> $z^L(\lambda)\ge z^*$ for all $\lambda\ge 0$.</blockquote>
<p>So every value is an upper bound, not the optimum itself. In fact $z^*=20$, at $x^*=(3,4)$.</p>
$$\begin{aligned}f(x^*)&=4\cdot3+2\cdot4\\ &=12+8\\ &=20\end{aligned}$$`,
d:[String.raw`Correct.`,String.raw`Wrong. $\lambda_2=4$ cancels the $x_1$ term, but $2x_2$ is still unbounded, so $z^L(0,4)=\infty$.`,
String.raw`Correct.`,String.raw`Correct: a valid but loose upper bound.`,
String.raw`Wrong. $z^L$ only bounds $z^*$ from above. Here $$\begin{aligned}z^*&=20\\ &&lt;20.25\end{aligned}$$`]},

{i:"Weak duality", c: "Weak duality and the Lagrange dual",q:String.raw`<p>The proof of weak duality for Lagrange relaxation reads</p>$$\begin{aligned}z^*&=\max_{x}\big\{f(x)\,\big|\,g_i(x)\le b_i\ \forall i\big\}\\ &\le\max_{x}\Big\{f(x)+\sum_i\lambda_i[b_i-g_i(x)]\,\Big|\,g_i(x)\le b_i\ \forall i\Big\}\\ &\le\max_{x}\Big\{f(x)+\sum_i\lambda_i[b_i-g_i(x)]\Big\}\\ &=z^L(\lambda).\end{aligned}$$<p>Why does the <i>first</i> inequality hold?</p>`,
o:[String.raw`Because $\lambda\ge 0$ and every feasible $x$ has $b_i-g_i(x)\ge 0$, so the added term is nonnegative.`,
String.raw`Because removing constraints cannot decrease the maximum.`,
String.raw`Because $f$ is concave and each $g_i$ is convex.`,
String.raw`Because, by complementary slackness, the added term is zero at the optimum.`,NONE],ok:[0],
e:String.raw`<p>The first step keeps the same feasible set and only adds $\sum_i\lambda_i[b_i-g_i(x)]$ to the objective. On the feasible set each slack $b_i-g_i(x)$ is $\ge 0$, and $\lambda_i\ge 0$, so the new objective is $\ge f(x)$ at every feasible $x$. The second step drops the constraints, which can only enlarge the set over which we maximize.</p>
<blockquote>The first inequality holds because $\lambda\ge 0$ (the added term is nonnegative for every feasible $x$), and the second because removing constraints cannot decrease the maximum.</blockquote>`,
d:["",String.raw`Is the reason for the <i>second</i> inequality, where the constraints are dropped.`,
String.raw`Is not used: weak duality holds for any NLP, convex or not.`,
String.raw`Complementary slackness is a KKT condition. The proof does not use it, and it compares the objectives at every feasible $x$, not only at the optimum.`,""]},

{i:"Weak duality", c: "Weak duality and the Lagrange dual",q:String.raw`<p>Consider</p>$$\begin{aligned}z^*=\max\ & x_1+x_2\\ \text{s.t.}\ & x_1^2+2x_2^2\le 6.\end{aligned}$$<p>You know the points</p>$$\begin{aligned}\hat x&=(1,1)\\ \tilde x&=(2,1)\end{aligned}$$<p>and three multipliers:</p>$$\begin{aligned}\lambda^A&=\tfrac12\\ \lambda^B&=\tfrac13\\ \lambda^C&=1\end{aligned}$$<p>What is the tightest interval for $z^*$ that these data prove?</p>`,
o:[String.raw`$3\le z^*\le 3.125$`,String.raw`$2\le z^*\le 3.125$`,String.raw`$3\le z^*\le 6.375$`,String.raw`$z^*=3.125$, the smallest value of $z^L$`,NONE],ok:[0],
e:String.raw`<p><b>1. Lower bound: feasible points.</b></p>
$$\begin{aligned}g(\hat x)&=1^2+2\cdot1^2\\ &=1+2\\ &=3\\ &\le 6\\ f(\hat x)&=1+1\\ &=2\\ g(\tilde x)&=2^2+2\cdot1^2\\ &=4+2\\ &=6\\ &\le 6\\ f(\tilde x)&=2+1\\ &=3\end{aligned}$$
<p>The best one gives $z^*\ge 3$.</p>
<p><b>2. Upper bounds: the relaxation.</b></p>
$$\begin{aligned}\mathcal{L}(x|\lambda)&=x_1+x_2+\lambda(6-x_1^2-2x_2^2)\\ &=\big[x_1-\lambda x_1^2\big]+\big[x_2-2\lambda x_2^2\big]+6\lambda\end{aligned}$$
<p>For $\lambda&gt;0$, each bracket is a concave parabola:</p>
$$\begin{aligned}\frac{\partial\mathcal{L}}{\partial x_1}&=1-2\lambda x_1\\ &=0\\ &\Rightarrow\ x_1=\frac{1}{2\lambda}\\ \max_{x_1}\big[x_1-\lambda x_1^2\big]&=\frac{1}{2\lambda}-\lambda\cdot\frac{1}{4\lambda^2}\\ &=\frac{1}{2\lambda}-\frac{1}{4\lambda}\\ &=\frac{1}{4\lambda}\\ \frac{\partial\mathcal{L}}{\partial x_2}&=1-4\lambda x_2\\ &=0\\ &\Rightarrow\ x_2=\frac{1}{4\lambda}\\ \max_{x_2}\big[x_2-2\lambda x_2^2\big]&=\frac{1}{4\lambda}-2\lambda\cdot\frac{1}{16\lambda^2}\\ &=\frac{1}{4\lambda}-\frac{1}{8\lambda}\\ &=\frac{1}{8\lambda}\end{aligned}$$
<p>So</p>
$$z^L(\lambda)=\frac{1}{4\lambda}+\frac{1}{8\lambda}+6\lambda$$
$$\begin{aligned}z^L(\tfrac12)&=\frac{1}{4\cdot\frac12}+\frac{1}{8\cdot\frac12}+6\cdot\tfrac12\\ &=\tfrac12+\tfrac14+3\\ &=3.75\\[1mm] z^L(\tfrac13)&=\frac{1}{4\cdot\frac13}+\frac{1}{8\cdot\frac13}+6\cdot\tfrac13\\ &=\tfrac34+\tfrac38+2\\ &=3.125\\[1mm] z^L(1)&=\frac{1}{4\cdot1}+\frac{1}{8\cdot1}+6\cdot1\\ &=\tfrac14+\tfrac18+6\\ &=6.375\end{aligned}$$
<blockquote><b>Proposition 1.</b> $z^L(\lambda)\ge z^*$ for all $\lambda\ge 0$.</blockquote>
<p>The smallest bound is the tightest: $3\le z^*\le 3.125$. In fact $z^*=3$, reached by $\tilde x$, and $z^L(\tfrac14)=3$ would close the gap:</p>
$$\begin{aligned}z^L(\tfrac14)&=\frac{1}{4\cdot\frac14}+\frac{1}{8\cdot\frac14}+6\cdot\tfrac14\\ &=1+\tfrac12+\tfrac32\\ &=3\end{aligned}$$`,
d:["",String.raw`Uses $\hat x$, which is feasible but not the best known point.`,
String.raw`Takes the largest upper bound instead of the smallest.`,
String.raw`Reads an upper bound as the optimal value: the relaxation only proves $z^*\le 3.125$.`,""]},

{i:"The Lagrange dual program", c: "Weak duality and the Lagrange dual",q:String.raw`<p>For a maximization NLP, the Lagrange dual program is $\min_{\lambda\ge 0} z^L(\lambda)$. Why is it a <i>minimization</i>?</p>`,
o:[String.raw`Each $z^L(\lambda)$ with $\lambda\ge 0$ is an upper bound on $z^*$, and we look for the tightest one.`,
String.raw`Because the minimizing $\lambda$ gives the primal optimal solution $x^*$ directly.`,
String.raw`Because the dual of a maximization must maximize a lower bound on $z^*$.`,
String.raw`Because $z^L(\lambda)$ is concave in $\lambda$, so only its minimum is defined.`,NONE],ok:[0],
e:String.raw`<blockquote>Given that $z^L(\lambda)\ge z^*$ for all $\lambda\ge 0$, it is natural to define $\min_{\lambda\ge 0}z^L(\lambda)$ as the Lagrange dual program. Lagrange multipliers are dual variables in NLP.</blockquote>
<p>It mirrors LP duality: any feasible dual solution gives a bound to the primal LP, and a dual optimal solution gives the tightest bound.</p>`,
d:["",String.raw`Is false: the dual gives multipliers and a bound, not $x^*$.`,
String.raw`Inverts the direction: for a max, the relaxation gives upper bounds, so the dual minimizes them.`,
String.raw`Is false: $z^L$ is convex in $\lambda$, which is why minimizing it is reasonable.`,""]},

{i:"The KKT condition", c: "The KKT condition",q:String.raw`<p>For a "regular" NLP</p>$$\begin{aligned}\max\ & f(x)\\ \text{s.t.}\ & g_i(x)\le b_i\\ & i=1,\dots,m\end{aligned}$$<p>which system is the KKT condition that a local maximum $\bar x$ must satisfy for some $\lambda\in\mathbb{R}^m$?</p>`,
o:[String.raw`$$\begin{aligned}g_i(\bar x)&\le b_i\ \forall i\\ \lambda&\ge 0\\ \nabla f(\bar x)&=\sum_i\lambda_i\nabla g_i(\bar x)\\ \lambda_i[b_i-g_i(\bar x)]&=0\ \forall i\end{aligned}$$`,
String.raw`$$\begin{aligned}g_i(\bar x)&\le b_i\ \forall i\\ \lambda&\ge 0\\ \nabla f(\bar x)&=0\\ \lambda_i[b_i-g_i(\bar x)]&=0\ \forall i\end{aligned}$$`,
String.raw`$$\begin{aligned}g_i(\bar x)&\le b_i\ \forall i\\ \lambda&\le 0\\ \nabla f(\bar x)&=\sum_i\lambda_i\nabla g_i(\bar x)\\ \lambda_i[b_i-g_i(\bar x)]&=0\ \forall i\end{aligned}$$`,
String.raw`$$\begin{aligned}g_i(\bar x)&\le b_i\ \forall i\\ \lambda&\ge 0\\ \nabla f(\bar x)&=\sum_i\lambda_i\nabla g_i(\bar x)\\ \lambda_i\,g_i(\bar x)&=0\ \forall i\end{aligned}$$`,NONE],ok:[0],
e:String.raw`<p>The KKT condition has three parts:</p>
$$\begin{aligned}\text{primal feasibility:}&\quad g_i(\bar x)\le b_i\\ \text{dual feasibility:}&\quad \lambda\ge 0\\ &\quad \nabla f(\bar x)=\textstyle\sum_i\lambda_i\nabla g_i(\bar x)\\ \text{complementary slackness:}&\quad \lambda_i[b_i-g_i(\bar x)]=0\end{aligned}$$
<p>The equality of dual feasibility is the FOC of the Lagrangian:</p>
$$\begin{aligned}\nabla\Big\{f(x)+\sum_i\lambda_i[b_i-g_i(x)]\Big\}&=0\\ &\Leftrightarrow\ \nabla f(\bar x)-\sum_i\lambda_i\nabla g_i(\bar x)=0\end{aligned}$$`,
d:["",String.raw`Uses the unconstrained FOC: at a constrained optimum, $\nabla f$ is usually not zero.`,
String.raw`Reverses the sign of the multipliers, which would reward violations.`,
String.raw`Drops $b_i$ from complementary slackness: the product is dual variable times primal <i>slack</i> $b_i-g_i(\bar x)$.`,""]},

{i:"The KKT condition", c: "The KKT condition",q:String.raw`<p>Which statement about the KKT condition for an NLP $\max f(x)$ s.t. $g_i(x)\le b_i$ is correct?</p>`,
o:[String.raw`It is necessary for a local max of any regular NLP, and also sufficient when the NLP is convex.`,
String.raw`It is sufficient for any regular NLP, and also necessary when the NLP is a convex program.`,
String.raw`It is necessary and sufficient for a global max of any regular NLP.`,
String.raw`It is necessary only when all the constraints are linear.`,NONE],ok:[0],
e:String.raw`<blockquote>All NLPs in this course (and most in the world) are "regular", i.e., they satisfy a constraint qualification. The condition is necessary for any regular NLP, and it is also sufficient when the NLP is a CP.</blockquote>
<p>For a nonconvex NLP, a KKT point is only a candidate: it may not even be a local maximum, so you must compare all KKT points.</p>`,
d:["",String.raw`Swaps necessary and sufficient.`,
String.raw`Is false for nonconvex NLPs: some KKT points are not even local maxima.`,
String.raw`Is invented: what the condition needs is regularity, not linearity.`,""]},

{i:"The KKT condition", c: "The KKT condition",q:String.raw`<p>Consider</p>$$\begin{aligned}\max\ & 4x_1+x_2\\ \text{s.t.}\ & x_1^2+x_2^2\le 10\\ & x_1\le 3.\end{aligned}$$<p>At $\bar x=(3,1)$, which multiplier vector $\lambda=(\lambda_1,\lambda_2)$ satisfies the KKT condition?</p>`,
o:[String.raw`$\lambda=(\tfrac12,\ 1)$`,String.raw`$\lambda=(1,\ 1)$`,String.raw`$\lambda=(\tfrac12,\ 0)$`,String.raw`$\lambda=(-\tfrac12,\ -1)$`,NONE],ok:[0],
e:String.raw`<p><b>1. Feasibility.</b></p>
$$\begin{aligned}g_1(\bar x)&=3^2+1^2\\ &=9+1\\ &=10\\ &\le 10\\ g_2(\bar x)&=3\\ &\le 3\end{aligned}$$
<p>Both constraints are binding, so complementary slackness allows $\lambda_1,\lambda_2&gt;0$.</p>
<p><b>2. Gradients at $\bar x$.</b></p>
$$\begin{aligned}\nabla f(\bar x)&=(4,1)\\ \nabla g_1(\bar x)&=(2x_1,2x_2)\\ &=(2\cdot3,\ 2\cdot1)\\ &=(6,2)\\ \nabla g_2(\bar x)&=(1,0)\end{aligned}$$
<p><b>3. Solve $\nabla f=\lambda_1\nabla g_1+\lambda_2\nabla g_2$.</b></p>
$$\begin{aligned}\text{second component:}&\quad 1=2\lambda_1+0\cdot\lambda_2\\ &\quad \lambda_1=\tfrac12\\ \text{first component:}&\quad 4=6\lambda_1+1\cdot\lambda_2\\ 4&=6\cdot\tfrac12+\lambda_2\\ &=3+\lambda_2\\ \lambda_2&=4-3\\ &=1\end{aligned}$$
<p>Both are $\ge 0$, so $\bar x$ is a KKT point. The program is convex (linear objective, convex constraints), so $\bar x$ is optimal, with value 13.</p>
$$\begin{aligned}f(\bar x)&=4\cdot3+1\\ &=12+1\\ &=13\end{aligned}$$`,
d:["",String.raw`Uses $\nabla g_1=(x_1,x_2)$ and forgets the factor 2. With the true gradient:$$\begin{aligned}\lambda_1\nabla g_1+\lambda_2\nabla g_2&=1\cdot(6,2)+1\cdot(1,0)\\ &=(6+1,\ 2+0)\\ &=(7,2)\\ &\ne(4,1)\end{aligned}$$`,
String.raw`Sets $\lambda_2=0$ as if $x_1\le 3$ were nonbinding:$$\begin{aligned}\lambda_1\nabla g_1+\lambda_2\nabla g_2&=\tfrac12\cdot(6,2)+0\cdot(1,0)\\ &=(3,1)+(0,0)\\ &=(3,1)\\ &\ne(4,1)\end{aligned}$$`,
String.raw`Uses $\nabla f+\sum_i\lambda_i\nabla g_i=0$, the sign for a minimization. Negative multipliers break $\lambda\ge 0$.`,""]},

{i:"The KKT condition", c: "The KKT condition",q:String.raw`<p>Consider</p>$$\begin{aligned}\max\ & x_1+2x_2\\ \text{s.t.}\ & x_1^2+x_2^2\le 25\\ & x_2\le 3.\end{aligned}$$<p>Which of these points is a KKT point?</p>`,
o:[String.raw`$(4,\ 3)$`,String.raw`$(\sqrt5,\ 2\sqrt5)$`,String.raw`$(-4,\ 3)$`,String.raw`$(0,\ -5)$`,NONE],ok:[0],
e:String.raw`<p>The gradients are</p>
$$\begin{aligned}\nabla f&=(1,2)\\ \nabla g_1&=(2x_1,2x_2)\\ \nabla g_2&=(0,1)\end{aligned}$$
<p>Only the binding constraints may have a positive multiplier.</p>
<p><b>Point $(4,3)$.</b> Both constraints bind:</p>
$$\begin{aligned}g_1(4,3)&=4^2+3^2\\ &=16+9\\ &=25\\ g_2(4,3)&=3\\ \nabla g_1(4,3)&=(2\cdot4,\ 2\cdot3)\\ &=(8,6)\\ (1,2)&=\lambda_1(8,6)+\lambda_2(0,1)\\ \text{first component:}\quad 1&=8\lambda_1\\ \lambda_1&=\tfrac18\\ \text{second component:}\quad 2&=6\lambda_1+\lambda_2\\ 2&=6\cdot\tfrac18+\lambda_2\\ &=\tfrac34+\lambda_2\\ \lambda_2&=2-\tfrac34\\ &=\tfrac54\\ \lambda&=(\tfrac18,\tfrac54)\\ &\ge 0\end{aligned}$$
<p><b>Point $(\sqrt5,2\sqrt5)$.</b> It is infeasible:</p>
$$\begin{aligned}x_2&=2\sqrt5\\ &\approx 4.47\\ &&gt;3\end{aligned}$$
<p><b>Point $(-4,3)$.</b> Both constraints bind:</p>
$$\begin{aligned}g_1(-4,3)&=(-4)^2+3^2\\ &=16+9\\ &=25\\ \nabla g_1(-4,3)&=(2\cdot(-4),\ 2\cdot3)\\ &=(-8,6)\\ (1,2)&=\lambda_1(-8,6)+\lambda_2(0,1)\\ \text{first component:}\quad 1&=-8\lambda_1\\ \lambda_1&=-\tfrac18\end{aligned}$$
<p><b>Point $(0,-5)$.</b> Only the circle binds:</p>
$$\begin{aligned}\nabla g_1(0,-5)&=(2\cdot0,\ 2\cdot(-5))\\ &=(0,-10)\\ (1,2)&=\lambda_1(0,-10)\\ \text{first component:}\quad 1&=0\cdot\lambda_1\ \text{has no solution}\end{aligned}$$
<p>Only $(4,3)$ satisfies the three parts. The program is convex, so $(4,3)$ is the optimum, with value 10:</p>
$$\begin{aligned}f(4,3)&=4+2\cdot3\\ &=4+6\\ &=10\end{aligned}$$`,
d:["",String.raw`Satisfies the gradient equation with only the circle binding ($\lambda_1=\tfrac{1}{2\sqrt5}$), but violates $x_2\le 3$: primal feasibility fails.`,
String.raw`Needs $$\begin{aligned}\lambda_1&=-\tfrac18\\ &&lt;0:\end{aligned}$$ dual feasibility fails.`,
String.raw`Only the circle is binding, and $\nabla f=(1,2)$ is not a multiple of $\nabla g_1=(0,-10)$.`,""]},

{i:"The geometry of the KKT condition", c: "The KKT condition",q:String.raw`<p>At a feasible point $\bar x$ of</p>$$\begin{aligned}\max\ & f(x)\\ \text{s.t.}\ & g_1(x)\le b_1\\ & g_2(x)\le b_2\end{aligned}$$<p>both constraints are binding, with</p>$$\begin{aligned}\nabla g_1(\bar x)&=(2,1)\\ \nabla g_2(\bar x)&=(1,3).\end{aligned}$$<p>For which values of $\nabla f(\bar x)$ does $\bar x$ satisfy the KKT condition?</p>`,m:true,
o:[String.raw`$\nabla f(\bar x)=(3,4)$`,String.raw`$\nabla f(\bar x)=(4,2)$`,String.raw`$\nabla f(\bar x)=(1,-2)$`,String.raw`$\nabla f(\bar x)=(0,5)$`,String.raw`$\nabla f(\bar x)=(1,8)$`],ok:[0,1],
e:String.raw`<p>Solve $\nabla f(\bar x)=\lambda_1(2,1)+\lambda_2(1,3)$ for $\nabla f=(a,b)$:</p>
$$\begin{aligned}a&=2\lambda_1+\lambda_2\\ b&=\lambda_1+3\lambda_2\\ 3a-b&=6\lambda_1+3\lambda_2-\lambda_1-3\lambda_2\\ &=5\lambda_1\\ 2b-a&=2\lambda_1+6\lambda_2-2\lambda_1-\lambda_2\\ &=5\lambda_2\\ \lambda_1&=\frac{3a-b}{5}\\ \lambda_2&=\frac{2b-a}{5}\end{aligned}$$
<p>Keep the vector only if $\lambda\ge 0$:</p>
$$\begin{aligned}(3,4):\quad\lambda_1&=\tfrac{3\cdot3-4}{5}\\ &=\tfrac{9-4}{5}\\ &=1\\ \lambda_2&=\tfrac{2\cdot4-3}{5}\\ &=\tfrac{8-3}{5}\\ &=1\\[1mm] (4,2):\quad\lambda_1&=\tfrac{3\cdot4-2}{5}\\ &=\tfrac{12-2}{5}\\ &=2\\ \lambda_2&=\tfrac{2\cdot2-4}{5}\\ &=\tfrac{4-4}{5}\\ &=0\\[1mm] (1,-2):\quad\lambda_1&=\tfrac{3\cdot1-(-2)}{5}\\ &=\tfrac{3+2}{5}\\ &=1\\ \lambda_2&=\tfrac{2\cdot(-2)-1}{5}\\ &=\tfrac{-4-1}{5}\\ &=-1\\[1mm] (0,5):\quad\lambda_1&=\tfrac{3\cdot0-5}{5}\\ &=\tfrac{0-5}{5}\\ &=-1\\ \lambda_2&=\tfrac{2\cdot5-0}{5}\\ &=\tfrac{10-0}{5}\\ &=2\\[1mm] (1,8):\quad\lambda_1&=\tfrac{3\cdot1-8}{5}\\ &=\tfrac{3-8}{5}\\ &=-1\\ \lambda_2&=\tfrac{2\cdot8-1}{5}\\ &=\tfrac{16-1}{5}\\ &=3\end{aligned}$$
<blockquote>The existence of $\lambda\ge 0$ such that $\nabla f(x^*)=\lambda_1\nabla g_1(x^*)+\lambda_2\nabla g_2(x^*)$ means that $\nabla f(x^*)$ is a nonnegative combination of $\nabla g_1(x^*)$ and $\nabla g_2(x^*)$, i.e., $\nabla f$ is "in between" $\nabla g_1$ and $\nabla g_2$ at $x^*$.</blockquote>

{i:"The geometry of the KKT condition", c: "The KKT condition",q:String.raw`<p>At a feasible point $\bar x$ of a regular NLP $\max f(x)$ s.t. $g_i(x)\le b_i$, the gradient $\nabla f(\bar x)$ is <i>not</i> a nonnegative combination of the gradients of the constraints that are binding at $\bar x$. What can you conclude?</p>`,
o:[String.raw`There is a feasible improving direction at $\bar x$, so $\bar x$ is not a local maximum.`,
String.raw`$\bar x$ is a local minimum.`,
String.raw`$\bar x$ can still be a local maximum if $f$ is concave.`,
String.raw`Nothing yet: the gradients of the nonbinding constraints can still complete the combination.`,NONE],ok:[0],
e:String.raw`<blockquote>The existence of $\lambda\ge 0$ such that $\nabla f(x^*)=\lambda_1\nabla g_1(x^*)+\lambda_2\nabla g_2(x^*)$ means that $\nabla f(x^*)$ is a nonnegative combination of $\nabla g_1(x^*)$ and $\nabla g_2(x^*)$. Otherwise, there would be a feasible improving direction at $x^*$. Complementary slackness $\lambda_i[b_i-g_i(x^*)]=0$ says that only constraints binding at $x^*$ matter.</blockquote>
<p>So the KKT condition fails at $\bar x$. For a regular NLP the condition is necessary, so $\bar x$ is not a local maximum.</p>`,
d:["",String.raw`Does not follow: failing the condition for a max says nothing about being a min.`,
String.raw`Is false: the condition is necessary for every regular NLP, concave $f$ or not.`,
String.raw`Forgets complementary slackness: a nonbinding constraint has $\lambda_i=0$, so its gradient cannot help.`,""]},

{i:"Example: the retailer's problem", c: "The KKT condition",q:String.raw`<p>A retailer chooses $q_1,q_2\ge 0$ to maximize $q_1(a_1-b_1q_1)+q_2(a_2-b_2q_2)$ subject to $q_1+q_2\le K$, with $a_i,b_i,K&gt;0$. Why is this a convex program?</p>`,
o:[String.raw`The Hessian of the negated profit is $\mathrm{diag}(2b_1,2b_2)$, positive definite, so the profit is concave, and it is maximized subject to a linear constraint.`,
String.raw`The Hessian of the profit is $\mathrm{diag}(2b_1,2b_2)$, positive definite, so the profit is convex, and it is maximized.`,
String.raw`Because its constraint is linear, whatever the objective function is.`,
String.raw`Because the FOC solution $(\tfrac{a_1}{2b_1},\tfrac{a_2}{2b_2})$ is always feasible.`,NONE],ok:[0],
e:String.raw`<p>Let $f(q_1,q_2)=-[q_1(a_1-b_1q_1)+q_2(a_2-b_2q_2)]$. Then</p>
$$\nabla^2 f(q_1,q_2)=\begin{bmatrix}2b_1&0\\0&2b_2\end{bmatrix}$$
<blockquote>This is positive definite (hence positive semi-definite) because $b_i&gt;0$. This implies that $f$ is convex, i.e., the objective function $-f$ is concave. As we are maximizing a concave function subject to linear constraints, this is a convex program.</blockquote>`,
d:["",String.raw`Gets the sign wrong: the profit's Hessian is $\mathrm{diag}(-2b_1,-2b_2)$. Maximizing a convex function would not be a convex program.`,
String.raw`A linear constraint is not enough: the objective of a maximization must also be concave.`,
String.raw`Is false: when $\tfrac{a_1}{2b_1}+\tfrac{a_2}{2b_2}&gt;K$ it is infeasible. Feasibility is unrelated to convexity anyway.`,""]},

{i:"Example: the retailer's problem", c: "The KKT condition",q:String.raw`<p>A retailer sells two products in quantities $q_1,q_2\ge 0$. The market-clearing prices are</p>$$\begin{aligned}p_1&=20-q_1\\ p_2&=16-2q_2\end{aligned}$$<p>and the total supply cannot exceed $K=8$:</p>$$\begin{aligned}\max_{q_1,q_2\ge 0}\ & q_1(20-q_1)+q_2(16-2q_2)\\ \text{s.t.}\ & q_1+q_2\le 8.\end{aligned}$$<p>What is the optimal solution?</p>`,
o:[String.raw`$(q_1^*,q_2^*)=(6,\ 2)$`,String.raw`$(q_1^*,q_2^*)=(10,\ 4)$`,String.raw`$(q_1^*,q_2^*)=(4,\ 4)$`,String.raw`$(q_1^*,q_2^*)=(\tfrac{40}{7},\ \tfrac{16}{7})$`,NONE],ok:[0],
e:String.raw`<p><b>1. Lagrangian.</b></p>
$$\mathcal{L}(q|\lambda)=q_1(20-q_1)+q_2(16-2q_2)+\lambda(8-q_1-q_2)$$
<p><b>2. FOC.</b></p>
$$\begin{aligned}\frac{\partial\mathcal{L}}{\partial q_1}&=20-2q_1-\lambda\\ &=0\\ \frac{\partial\mathcal{L}}{\partial q_2}&=16-4q_2-\lambda\\ &=0\end{aligned}$$
<p><b>3. Case $\lambda=0$.</b></p>
$$\begin{aligned}20-2q_1&=0\\ &\Rightarrow\ q_1=10\\ 16-4q_2&=0\\ &\Rightarrow\ q_2=4\\ q_1+q_2&=10+4\\ &=14\\ &&gt;8\end{aligned}$$
<p>This point is infeasible.</p>
<p><b>4. Case $\lambda&gt;0$.</b> Complementary slackness gives $q_1+q_2=8$, so $q_2=8-q_1$. Equate the two expressions of $\lambda$:</p>
$$\begin{aligned}20-2q_1&=16-4(8-q_1)\\ 20-2q_1&=16-32+4q_1\\ 20+32-16&=4q_1+2q_1\\ 36&=6q_1\\ q_1&=6\\ q_2&=8-6\\ &=2\\ \lambda&=20-2\cdot6\\ &=20-12\\ &=8\\ &\ge 0\end{aligned}$$
<p>The program is convex, so this KKT point is optimal, with profit 108:</p>
$$\begin{aligned}q_1(20-q_1)+q_2(16-2q_2)&=6\cdot(20-6)+2\cdot(16-2\cdot2)\\ &=6\cdot14+2\cdot12\\ &=84+24\\ &=108\end{aligned}$$
<p>It matches the general formula:</p>
$$\begin{aligned}q_1&=\frac{2b_2K+a_1-a_2}{2(b_1+b_2)}\\ &=\frac{2\cdot2\cdot8+20-16}{2\,(1+2)}\\ &=\frac{32+20-16}{6}\\ &=\frac{36}{6}\\ &=6\end{aligned}$$`,
d:["",String.raw`Is the unconstrained FOC solution $(\tfrac{a_1}{2b_1},\tfrac{a_2}{2b_2})$; it violates $q_1+q_2\le 8$.`,
String.raw`Splits $K$ equally. It is feasible, but its profit is lower than 108:$$\begin{aligned}q_1(20-q_1)+q_2(16-2q_2)&=4\cdot(20-4)+4\cdot(16-2\cdot4)\\ &=4\cdot16+4\cdot8\\ &=64+32\\ &=96\\ &&lt;108\end{aligned}$$`,
String.raw`Scales $(10,4)$ down by $\tfrac{8}{14}$. It is feasible, but the marginal revenues $20-2q_1$ and $16-4q_2$ differ, and the profit is lower than 108.`,""]},

{i:"Example: the retailer's problem", c: "The KKT condition",q:String.raw`<p>A retailer sells two identical products: $p_i=12-2q_i$ for $i=1,2$, with the constraints</p>$$\begin{aligned}q_1+q_2&\le K\quad\text{(total supply)}\\ q_1,q_2&\ge 0\end{aligned}$$<p>It maximizes its total profit $q_1p_1+q_2p_2$. What is $q_1^*$ for $K=4$ and for $K=16$?</p>`,
o:[String.raw`$$\begin{aligned}q_1^*&=2\\ \text{for }K&=4\\ q_1^*&=3\\ \text{for }K&=16\end{aligned}$$`,String.raw`$$\begin{aligned}q_1^*&=2\\ \text{for }K&=4\\ q_1^*&=8\\ \text{for }K&=16\end{aligned}$$`,
String.raw`$$\begin{aligned}q_1^*&=2\\ \text{for }K&=4\\ q_1^*&=6\\ \text{for }K&=16\end{aligned}$$`,String.raw`$$\begin{aligned}q_1^*&=3\\ \text{for }K&=4\\ q_1^*&=3\\ \text{for }K&=16\end{aligned}$$`,NONE],ok:[0],
e:String.raw`<p>For both products:</p>
$$\begin{aligned}a&=12\\ b&=2\\ \frac{a}{2b}&=\frac{12}{2\cdot2}\\ &=\frac{12}{4}\\ &=3\quad\text{(unconstrained quantity)}\\ \frac{a}{b}&=\frac{12}{2}\\ &=6\quad\text{(threshold on }K)\end{aligned}$$
<p>When the constraint binds, symmetry gives each product $\tfrac K2$:</p>
$$q^*=\begin{cases}\tfrac K2 & K\le 6\\ 3 & K\ge 6\end{cases}$$
$$\begin{aligned}K&=4\\ &\le 6:\\ q_1^*&=\tfrac K2\\ &=\tfrac42\\ &=2\\ K&=16\\ &\ge 6:\\ q_1^*&=3\end{aligned}$$
