{i:"Example: the retailer's problem", c: "The KKT condition",q:String.raw`<p>A retailer sells two products with market-clearing prices</p>$$\begin{aligned}p_1&=30-2q_1\\ p_2&=18-q_2\end{aligned}$$<p>and total supply $q_1+q_2\le K$. It maximizes $q_1(30-2q_1)+q_2(18-q_2)$ over $q_1,q_2\ge 0$. Let $\lambda$ be the Lagrange multiplier of the supply constraint. For $K=9$, which statements are correct?</p>`,m:true,
o:[String.raw`The supply constraint is binding, because $$\begin{aligned}\tfrac{30}{4}+\tfrac{18}{2}&=16.5\\ &&gt;9\end{aligned}$$`,
String.raw`$(q_1^*,q_2^*)=(5,4)$.`,String.raw`$\lambda=10$.`,
String.raw`If $K$ rose to 20, the optimal solution would be $(7.5,\ 9)$.`,
String.raw`If $K$ rose from 9 to 12, $q_1^*$ would decrease.`],ok:[0,1,2,3],
e:String.raw`<p><b>1. Threshold.</b> The unconstrained FOC solution is</p>
$$\begin{aligned}\frac{a_1}{2b_1}&=\frac{30}{2\cdot2}\\ &=\frac{30}{4}\\ &=7.5\\ \frac{a_2}{2b_2}&=\frac{18}{2\cdot1}\\ &=\frac{18}{2}\\ &=9\end{aligned}$$
<p>with total</p>
$$\begin{aligned}\frac{a_1}{2b_1}+\frac{a_2}{2b_2}&=7.5+9\\ &=16.5\end{aligned}$$
<p><b>2. $$\begin{aligned}K&=9\\ &&lt;16.5:\end{aligned}$$</b></p>
$$\begin{aligned}\lambda&&gt;0\\ q_1+q_2&=9\\ q_1&=\frac{2b_2K+a_1-a_2}{2(b_1+b_2)}\\ &=\frac{2\cdot1\cdot9+30-18}{2\,(2+1)}\\ &=\frac{18+30-18}{6}\\ &=\frac{30}{6}\\ &=5\\ q_2&=\frac{2b_1K+a_2-a_1}{2(b_1+b_2)}\\ &=\frac{2\cdot2\cdot9+18-30}{2\,(2+1)}\\ &=\frac{36+18-30}{6}\\ &=\frac{24}{6}\\ &=4\\ \lambda&=a_1-2b_1q_1\\ &=30-2\cdot2\cdot5\\ &=30-20\\ &=10\\ \lambda&=a_2-2b_2q_2\\ &=18-2\cdot1\cdot4\\ &=18-8\\ &=10\end{aligned}$$
<p><b>3. Other values of $K$.</b></p>
$$\begin{aligned}K&=20\\ &\ge 16.5:\\ \lambda&=0\\ (q_1^*,q_2^*)&=(7.5,\ 9)\end{aligned}$$
$$\begin{aligned}K&=12\\ &&lt;16.5:\\ q_1&=\frac{2\cdot1\cdot12+30-18}{2\,(2+1)}\\ &=\frac{24+30-18}{6}\\ &=\frac{36}{6}\\ &=6\\ q_2&=\frac{2\cdot2\cdot12+18-30}{2\,(2+1)}\\ &=\frac{48+18-30}{6}\\ &=\frac{36}{6}\\ &=6\end{aligned}$$
<blockquote>If $K$ increases, $q_1^*$ and $q_2^*$ weakly increase.</blockquote>`,
d:[String.raw`Correct.`,String.raw`Correct.`,String.raw`Correct: both FOCs give 10.`,
String.raw`Correct: $16.5\le 20$, so $\lambda=0$ and the unconstrained solution is optimal.`,
String.raw`Wrong. $q_1^*$ goes from 5 to 6: more capacity never lowers a quantity.`]},

{i:"KKT case analysis", c: "The KKT condition",q:String.raw`<p>Consider</p>$$\begin{aligned}\max\ & -(x_1-4)^2-(x_2-3)^2\\ \text{s.t.}\ & x_1+x_2\le 4\\ & x_1\le 2.\end{aligned}$$<p>You examine the four cases of the KKT condition. Which pair $(x^*,\lambda^*)$ is the solution?</p>`,
o:[String.raw`$$\begin{aligned}x^*&=(2,2)\\ \lambda^*&=(2,2)\end{aligned}$$`,String.raw`$$\begin{aligned}x^*&=(\tfrac52,\tfrac32)\\ \lambda^*&=(3,0)\end{aligned}$$`,String.raw`$$\begin{aligned}x^*&=(2,3)\\ \lambda^*&=(0,4)\end{aligned}$$`,String.raw`$$\begin{aligned}x^*&=(2,2)\\ \lambda^*&=(-2,-2)\end{aligned}$$`,NONE],ok:[0],
e:String.raw`<p><b>Dual feasibility.</b></p>
$$\begin{aligned}\nabla f(x)&=\big(-2(x_1-4),\ -2(x_2-3)\big)\\ &=(8-2x_1,\ 6-2x_2)\\ \nabla f(x)&=\lambda_1(1,1)+\lambda_2(1,0)\end{aligned}$$
<p><b>Case $$\begin{aligned}\lambda_1&=\lambda_2\\ &=0\end{aligned}$$</b></p>
$$\begin{aligned}8-2x_1&=0\\ &\Rightarrow\ x_1=4\\ 6-2x_2&=0\\ &\Rightarrow\ x_2=3\\ x_1+x_2&=4+3\\ &=7\\ &&gt;4\end{aligned}$$
<p>This point is infeasible.</p>
<p><b>Case $\lambda_1&gt;0$, with $\lambda_2=0$.</b> Then</p>
$$\begin{aligned}x_1+x_2&=4\\ 8-2x_1&=\lambda_1\\ 6-2x_2&=\lambda_1\\ 8-2x_1&=6-2x_2\\ 2x_1-2x_2&=8-6\\ &=2\\ x_1-x_2&=1\\ 2x_1&=4+1\\ &=5\\ x_1&=\tfrac52\\ x_2&=4-\tfrac52\\ &=\tfrac32\\ \lambda_1&=8-2\cdot\tfrac52\\ &=8-5\\ &=3\end{aligned}$$
<p>But $\tfrac52&gt;2$ violates the second constraint.</p>
<p><b>Case $\lambda_2&gt;0$, with $\lambda_1=0$.</b> Then</p>
$$\begin{aligned}x_1&=2\\ 6-2x_2&=0\\ &\Rightarrow\ x_2=3\\ \lambda_2&=8-2x_1\\ &=8-2\cdot2\\ &=8-4\\ &=4\end{aligned}$$
<p>so $x=(2,3)$ with $\lambda_2=4$. But $2+3&gt;4$ violates the first constraint.</p>
<p><b>Case $\lambda_1,\lambda_2&gt;0$.</b> Then</p>
$$\begin{aligned}x_1&=2\\ x_1+x_2&=4\\ x_2&=4-2\\ &=2\end{aligned}$$
<p>so $x=(2,2)$:</p>
$$\begin{aligned}\nabla f(2,2)&=(8-2\cdot2,\ 6-2\cdot2)\\ &=(8-4,\ 6-4)\\ &=(4,2)\\ (4,2)&=\lambda_1(1,1)+\lambda_2(1,0)\\ \text{second component:}\quad 2&=\lambda_1\cdot1+\lambda_2\cdot0\\ \lambda_1&=2\\ \text{first component:}\quad 4&=\lambda_1+\lambda_2\\ &=2+\lambda_2\\ \lambda_2&=4-2\\ &=2\end{aligned}$$
<p>The program is convex (concave objective, linear constraints), so this KKT point is optimal, with</p>
$$\begin{aligned}f(2,2)&=-(2-4)^2-(2-3)^2\\ &=-(-2)^2-(-1)^2\\ &=-4-1\\ &=-5\end{aligned}$$`,
d:["",String.raw`Stops at the case $\lambda_2=0$ without checking primal feasibility: $$\begin{aligned}x_1&=\tfrac52\\ &&gt;2\end{aligned}$$`,
String.raw`Stops at the case $\lambda_1=0$ without checking primal feasibility: $2+3&gt;4$.`,
String.raw`Uses $\nabla f+\sum_i\lambda_i\nabla g_i=0$, the sign for a minimization; it breaks $\lambda\ge 0$.`,""]},

{i:"KKT case analysis", c: "The KKT condition",q:String.raw`<p>Consider the nonconvex program</p>$$\begin{aligned}\max\ & f(x)=x_1x_2\\ \text{s.t.}\ & x_1^2+x_2^2\le 2.\end{aligned}$$<p>Which statements are correct?</p>`,m:true,
o:[String.raw`$(0,0)$ is a KKT point, with $\lambda=0$.`,
String.raw`$(0,0)$ is a local maximum, since it is a KKT point.`,
String.raw`$(1,-1)$ is a KKT point.`,
String.raw`The global maximum is 1, reached at $(1,1)$ and at $(-1,-1)$.`,
String.raw`Since $f$ is not concave, the KKT condition is not necessary here.`],ok:[0,3],
e:String.raw`<p><b>KKT system.</b></p>
$$\begin{aligned}\nabla f(x)&=(x_2,\ x_1)\\ \nabla g(x)&=(2x_1,\ 2x_2)\\ x_2&=2\lambda x_1\\ x_1&=2\lambda x_2\\ \lambda&\ge 0\\ \lambda(2-x_1^2-x_2^2)&=0\end{aligned}$$
<p><b>Case $\lambda=0$.</b> $x=(0,0)$, which is feasible: a KKT point with $f=0$.</p>
$$\begin{aligned}f(0,0)&=0\cdot0\\ &=0\end{aligned}$$
<p><b>Case $\lambda&gt;0$.</b> $x_1^2+x_2^2=2$. Substitute the second equation into the first, with $x_1\ne 0$ (else $x=0$):</p>
$$\begin{aligned}x_1&=2\lambda x_2\\ &=2\lambda\,(2\lambda x_1)\\ &=4\lambda^2x_1\\ 4\lambda^2&=1\\ \lambda&=\tfrac12\quad(\lambda&gt;0)\\ x_2&=2\cdot\tfrac12\cdot x_1\\ &=x_1\\ x_1^2+x_1^2&=2\\ x_1&=\pm1\\ x&\in\{(1,1),\ (-1,-1)\}\\ f(1,1)&=1\cdot1\\ &=1\\ f(-1,-1)&=(-1)\cdot(-1)\\ &=1\end{aligned}$$
<p>The points $(1,-1)$ and $(-1,1)$ solve the gradient equation only with $\lambda=-\tfrac12$, so they are not KKT points:</p>
$$\begin{aligned}(1,-1):\quad x_2&=2\lambda x_1\\ -1&=2\lambda\cdot1\\ \lambda&=-\tfrac12\end{aligned}$$
<blockquote>These three points are the only candidates for local maxima (and thus for the global maximum). Note that not all of these three points are local maxima.</blockquote>
<p>Comparing, the global maximum is 1. And $(0,0)$ is not a local maximum: $$\begin{aligned}f(t,t)&=t^2\\ &&gt;0\end{aligned}$$ for small $t$.</p>`,
d:[String.raw`Correct: $\nabla f(0,0)=(0,0)$ and the constraint is nonbinding.`,
String.raw`Wrong. For a nonconvex NLP, KKT is only necessary: $$\begin{aligned}f(t,t)&=t^2\\ &&gt;0\end{aligned}$$ near $(0,0)$.`,
String.raw`Wrong. It needs $$\begin{aligned}\lambda&=-\tfrac12\\ &&lt;0\end{aligned}$$ It is a global minimum, not a candidate for a maximum.`,
String.raw`Correct.`,
String.raw`Wrong. KKT is necessary for every regular NLP. Convexity only makes it sufficient.`]},

{i:"The size of the KKT system", c: "The KKT condition",q:String.raw`<p>A regular NLP has $n=4$ variables and $m=3$ inequality constraints $g_i(x)\le b_i$. You write its KKT condition. How many dual variables, dual-feasibility equalities and complementary-slackness equalities does it have, and how many cases must you examine to find all KKT points?</p>`,
o:[String.raw`4 dual variables, 3 dual-feasibility equalities, 4 complementary-slackness equalities, 16 cases.`,
String.raw`3 dual variables, 4 dual-feasibility equalities, 3 complementary-slackness equalities, 6 cases.`,
String.raw`3 dual variables, 3 dual-feasibility equalities, 4 complementary-slackness equalities, 8 cases.`,
String.raw`3 dual variables, 4 dual-feasibility equalities, 3 complementary-slackness equalities, 16 cases.`,NONE],ok:[4],
e:String.raw`<blockquote>In general, suppose there are $n$ variables and $m$ constraints: there are $n$ primal variables ($x$) and $m$ dual variables ($\lambda$). There are $n$ equalities for dual feasibility. There are $m$ equalities for complementary slackness.</blockquote>
$$\begin{aligned}\text{dual variables}&=m\\ &=3\\ \text{dual-feasibility equalities}&=n\\ &=4\\ \text{complementary-slackness equalities}&=m\\ &=3\\ \text{cases}&=2^m\\ &=2^3\\ &=8\end{aligned}$$
<p>Each multiplier is either $0$ or $&gt;0$, which gives $2^m$ cases. No option gives 3, 4, 3 and 8.</p>`,
d:[String.raw`Swaps $n$ and $m$ everywhere.`,
String.raw`Counts $2m$ cases instead of $2^m$.`,
String.raw`Swaps the two kinds of equalities: dual feasibility has one per variable, complementary slackness one per constraint.`,
String.raw`Uses $2^n$ cases: the cases come from the $m$ multipliers.`,""]},

{i:"Convexity of the Lagrange dual", c: "Solving the Lagrange dual",q:String.raw`<p>Why is the function $z^L(\lambda)=\max_{x\in\mathbb{R}^n}\mathcal{L}(x|\lambda)$ convex over $\lambda\in[0,\infty)^m$, whatever the primal NLP?</p>`,
o:[String.raw`For each fixed $x$, $\mathcal{L}(x|\lambda)$ is affine in $\lambda$, and a pointwise maximum of convex functions is convex.`,
String.raw`Because the primal objective $f$ is concave and each $g_i$ is convex.`,
String.raw`Because $z^L(\lambda)\ge z^*$ for every $\lambda\ge 0$.`,
String.raw`Because the maximizer $x(\lambda)$ of the Lagrangian is an affine function of $\lambda$.`,NONE],ok:[0],
e:String.raw`<blockquote>For any fixed $x\in\mathbb{R}^n$, the Lagrangian $\mathcal{L}(x|\lambda)=f(x)+\sum_{i=1}^m\lambda_i[b_i-g_i(x)]$ is an affine (hence convex) function of $\lambda$. The pointwise maximum of any family of convex functions is convex.</blockquote>
<p>So the Lagrange dual program $\min_{\lambda\ge 0}z^L(\lambda)$ is a convex program for any primal NLP, and it is reasonable to solve it.</p>`,
d:["",String.raw`Adds a hypothesis that the result does not need: it holds for any primal NLP.`,
String.raw`Is weak duality, which says nothing about the shape of $z^L$.`,
String.raw`Is false in general: for $\max x$ s.t. $x^2\le 4$, the maximizer is $x=\tfrac{1}{2\lambda}$, which is not affine.`,""]},

{i:"Convexity of the Lagrange dual", c: "Solving the Lagrange dual",q:String.raw`<p>The Lagrange relaxation of</p>$$\begin{aligned}\max\ & 3x_1+2x_2\\ \text{s.t.}\ & x_1^2+x_2^2\le 13\\ & x_2\le 1\end{aligned}$$<p>is, for $\lambda_1&gt;0$,</p>$$z^L(\lambda)=\frac{9+(2-\lambda_2)^2}{4\lambda_1}+13\lambda_1+\lambda_2.$$<p>What is the determinant of its Hessian $\nabla^2 z^L(\lambda)$?</p>`,
o:[String.raw`$\dfrac{9}{4\lambda_1^4}$`,String.raw`$\dfrac{9+(2-\lambda_2)^2}{4\lambda_1^4}$`,String.raw`$\dfrac{9+2(2-\lambda_2)^2}{4\lambda_1^4}$`,String.raw`$-\dfrac{9}{4\lambda_1^4}$`,NONE],ok:[0],
e:String.raw`<p><b>1. Gradient.</b></p>
$$\begin{aligned}\frac{\partial z^L}{\partial\lambda_1}&=-\frac{9+(2-\lambda_2)^2}{4\lambda_1^2}+13\\ \frac{\partial z^L}{\partial\lambda_2}&=\frac{2\,(2-\lambda_2)\cdot(-1)}{4\lambda_1}+1\\ &=-\frac{2-\lambda_2}{2\lambda_1}+1\end{aligned}$$
$$\nabla z^L(\lambda)=\begin{bmatrix}-\dfrac{9+(2-\lambda_2)^2}{4\lambda_1^2}+13\\[2mm] -\dfrac{2-\lambda_2}{2\lambda_1}+1\end{bmatrix}$$
<p><b>2. Hessian.</b></p>
$$\begin{aligned}\frac{\partial^2 z^L}{\partial\lambda_1^2}&=\frac{2\,\big[9+(2-\lambda_2)^2\big]}{4\lambda_1^3}\\ &=\frac{9+(2-\lambda_2)^2}{2\lambda_1^3}\\ \frac{\partial^2 z^L}{\partial\lambda_1\,\partial\lambda_2}&=\frac{2-\lambda_2}{2\lambda_1^2}\\ \frac{\partial^2 z^L}{\partial\lambda_2^2}&=\frac{1}{2\lambda_1}\end{aligned}$$
$$\nabla^2 z^L(\lambda)=\begin{bmatrix}\dfrac{9+(2-\lambda_2)^2}{2\lambda_1^3}&\dfrac{2-\lambda_2}{2\lambda_1^2}\\[2mm] \dfrac{2-\lambda_2}{2\lambda_1^2}&\dfrac{1}{2\lambda_1}\end{bmatrix}$$
<p><b>3. Determinant.</b></p>
$$\begin{aligned}\det\nabla^2 z^L(\lambda)&=\frac{9+(2-\lambda_2)^2}{2\lambda_1^3}\cdot\frac{1}{2\lambda_1}-\Big(\frac{2-\lambda_2}{2\lambda_1^2}\Big)^2\\ &=\frac{9+(2-\lambda_2)^2}{4\lambda_1^4}-\frac{(2-\lambda_2)^2}{4\lambda_1^4}\\ &=\frac{9}{4\lambda_1^4}+\frac{(2-\lambda_2)^2}{4\lambda_1^4}-\frac{(2-\lambda_2)^2}{4\lambda_1^4}\\ &=\frac{9}{4\lambda_1^4}\\ &&gt;0\end{aligned}$$
<p>The first diagonal entry is positive too, so the Hessian is positive definite for $\lambda_1&gt;0$: $z^L$ is convex there. This agrees with the general result: $z^L(\lambda)$ is convex over $[0,\infty)^m$ for any primal NLP.</p>`,
d:["",String.raw`Multiplies the diagonal entries and forgets to subtract the square of the off-diagonal entry.`,
String.raw`Adds the square of the off-diagonal entry instead of subtracting it.`,
String.raw`Computes (off-diagonal)$^2$ minus the product of the diagonal entries, the reverse order.`,""]},

{i:"Strong duality", c: "Solving the Lagrange dual",q:String.raw`<p>Let $w^*=\min_{\lambda\ge 0}z^L(\lambda)$ be the optimal value of the Lagrange dual program of $z^*=\max\{f(x)\,|\,g_i(x)\le b_i\ \forall i\}$. Under which condition does the strong duality result guarantee $w^*=z^*$?</p>`,
o:[String.raw`When the primal is a "regular" convex program.`,
String.raw`Always, because $z^L(\lambda)$ is convex for any primal NLP.`,
String.raw`Whenever the multipliers satisfy $\lambda\ge 0$.`,
String.raw`Only when the primal NLP is a linear program, as in LP duality.`,NONE],ok:[0],
e:String.raw`<blockquote><b>Proposition 4 (strong duality of Lagrange relaxation).</b> $w^*=z^*$ if the primal NLP is a "regular" convex program.</blockquote>
<p>Weak duality always gives $w^*\ge z^*$. The convexity of $z^L$ holds for any NLP and only says that the dual is reasonable to solve; it does not close the gap.</p>`,
d:["",String.raw`Confuses the convexity of the dual with the absence of a gap.`,
String.raw`$\lambda\ge 0$ gives only weak duality, $z^L(\lambda)\ge z^*$.`,
String.raw`Is too narrow: LP is one case, but any regular convex program works.`,""]},

{i:"Strong duality", c: "Solving the Lagrange dual",q:String.raw`<p>Consider the nonconvex program</p>$$\begin{aligned}z^*=\max\ & x^2\\ \text{s.t.}\ & x\le 1\\ & -x\le 1,\end{aligned}$$<p>whose optimal value is $z^*=1$. What is the optimal value $w^*$ of its Lagrange dual program?</p>`,
o:[String.raw`$$\begin{aligned}w^*&=+\infty\\ &&gt;z^*\end{aligned}$$`,String.raw`$w^*=1$, by strong duality.`,String.raw`$w^*=0$, reached at $\lambda=0$.`,
String.raw`$w^*=1$, reached at $\lambda=0$, where $\mathcal{L}(x|0)=x^2$ peaks at $x=\pm1$.`,NONE],ok:[0],
e:String.raw`<p><b>1. Lagrangian.</b></p>
$$\mathcal{L}(x|\lambda)=x^2+\lambda_1(1-x)+\lambda_2(1+x)$$
<p><b>2. Relaxation.</b> The maximization is over all $x\in\mathbb{R}$, and the term $x^2$ dominates the linear terms. So, for every $\lambda\ge 0$,</p>
$$\begin{aligned}z^L(\lambda)&=\max_{x\in\mathbb{R}}\mathcal{L}(x|\lambda)\\ &=+\infty\end{aligned}$$
<p><b>3. Dual.</b> $$\begin{aligned}w^*&=\min_{\lambda\ge 0}z^L(\lambda)\\ &=+\infty\\ &&gt;1\\ &=z^*\end{aligned}$$</p>
<p>Weak duality holds ($w^*\ge z^*$), but the bound is not tight. Strong duality does not apply: maximizing the convex function $x^2$ is not a convex program.</p>`,
d:["",String.raw`Applies strong duality to a nonconvex program; it needs a regular convex program.`,
String.raw`Minimizes the Lagrangian over $x$ instead of maximizing it.`,
String.raw`Maximizes the Lagrangian over the feasible set $[-1,1]$ instead of over $\mathbb{R}$: that is not the relaxation.`,""]},

{i:"Solving the Lagrange dual program", c: "Solving the Lagrange dual",q:String.raw`<p>Consider</p>$$\begin{aligned}z^*=\max\ & 2x_1+4x_2\\ \text{s.t.}\ & x_1^2+x_2^2\le 5\\ & x_2\le 1.\end{aligned}$$<p>For</p>$$\begin{aligned}\lambda_1&&gt;0\\ \lambda_2&\ge 0\end{aligned}$$<p>what is its Lagrange relaxation $z^L(\lambda)$?</p>`,
o:[String.raw`$\dfrac{4+(4-\lambda_2)^2}{2\lambda_1}+5\lambda_1+\lambda_2$`,
String.raw`$\dfrac{4+(4+\lambda_2)^2}{4\lambda_1}+5\lambda_1-\lambda_2$`,
String.raw`$\dfrac{2+(4-\lambda_2)^2}{4\lambda_1}+5\lambda_1+\lambda_2$`,
String.raw`$\dfrac{4+(4-\lambda_2)^2}{4\lambda_1}$`,NONE],ok:[4],
e:String.raw`<p><b>1. Lagrangian.</b></p>
$$\begin{aligned}\mathcal{L}(x|\lambda)&=2x_1+4x_2+\lambda_1(5-x_1^2-x_2^2)+\lambda_2(1-x_2)\\ &=2x_1+4x_2+5\lambda_1-\lambda_1x_1^2-\lambda_1x_2^2\\ &\quad+\lambda_2-\lambda_2x_2\\ &=\big[2x_1-\lambda_1x_1^2\big]\\ &\quad+\big[(4-\lambda_2)x_2-\lambda_1x_2^2\big]+5\lambda_1+\lambda_2\end{aligned}$$
<p><b>2. Maximize each bracket.</b> For $\lambda_1&gt;0$, $ax-\lambda_1x^2$ is a concave parabola that peaks at $x=\tfrac{a}{2\lambda_1}$, with value</p>
$$\begin{aligned}a\cdot\frac{a}{2\lambda_1}-\lambda_1\cdot\frac{a^2}{4\lambda_1^2}&=\frac{a^2}{2\lambda_1}-\frac{a^2}{4\lambda_1}\\ &=\frac{a^2}{4\lambda_1}\end{aligned}$$
<p><b>3. Result</b>, with</p>
$$\begin{aligned}a&=2\\ a&=4-\lambda_2\end{aligned}$$
<p>so</p>
$$\begin{aligned}z^L(\lambda)&=\frac{2^2}{4\lambda_1}+\frac{(4-\lambda_2)^2}{4\lambda_1}+5\lambda_1+\lambda_2\\ &=\frac{4+(4-\lambda_2)^2}{4\lambda_1}+5\lambda_1+\lambda_2\end{aligned}$$
<p>No option has it.</p>`,
d:[String.raw`Keeps only $a\cdot\tfrac{a}{2\lambda_1}$ and forgets the $-\lambda_1x^2$ part, which gives $\tfrac{a^2}{2\lambda_1}$.`,
String.raw`Writes the second reward as $\lambda_2(x_2-1)$, which reverses both signs of $\lambda_2$.`,
String.raw`Uses $a=2$ instead of $a^2=4$ for the $x_1$ part.`,
String.raw`Forgets the constant terms $5\lambda_1+\lambda_2$ that the rewards leave after the maximization.`,""]},

{i:"Solving the Lagrange dual program", c: "Solving the Lagrange dual",q:String.raw`<p>The Lagrange relaxation of</p>$$\begin{aligned}\max\ & 2x_1+6x_2\\ \text{s.t.}\ & x_1^2+x_2^2\le 8\\ & x_2\le 2\end{aligned}$$<p>is, for $\lambda_1&gt;0$,</p>$$z^L(\lambda)=\frac{4+(6-\lambda_2)^2}{4\lambda_1}+8\lambda_1+2\lambda_2.$$<p>You solve the Lagrange dual program $\min_{\lambda_1\ge 0,\lambda_2\ge 0}z^L(\lambda)$ with the KKT condition, with a multiplier $\mu\ge 0$ for $\lambda_2\ge 0$. What are $\lambda^*$ and $w^*$?</p>`,
o:[String.raw`$$\begin{aligned}\lambda^*&=(\tfrac12,\ 4)\\ w^*&=16\end{aligned}$$`,String.raw`$$\begin{aligned}\lambda^*&=(\tfrac{\sqrt5}{2},\ 0)\\ w^*&=8\sqrt5\end{aligned}$$`,
String.raw`$$\begin{aligned}\lambda^*&=(-\tfrac12,\ 8)\\ w^*&=8\end{aligned}$$`,String.raw`$$\begin{aligned}\lambda^*&=(0,\ 6)\\ w^*&=12\end{aligned}$$`,NONE],ok:[0],
e:String.raw`<p><b>1. KKT of the dual.</b> $\lambda_1\ge 0$ cannot bind, since $z^L\to\infty$ when $\lambda_1\to 0$. With $\mu$ for $\lambda_2\ge 0$:</p>
$$\begin{aligned}\frac{\partial z^L}{\partial\lambda_1}&=-\frac{4+(6-\lambda_2)^2}{4\lambda_1^2}+8\\ &=0\\ \frac{\partial z^L}{\partial\lambda_2}-\mu&=\frac{2\,(6-\lambda_2)\cdot(-1)}{4\lambda_1}+2-\mu\\ &=-\frac{6-\lambda_2}{2\lambda_1}+2-\mu\\ &=0\\ \mu\lambda_2&=0\end{aligned}$$
<p><b>2. Case $\mu&gt;0$.</b> Then</p>
$$\begin{aligned}\lambda_2&=0\\ -\frac{4+(6-0)^2}{4\lambda_1^2}+8&=0\\ \frac{4+36}{4\lambda_1^2}&=8\\ 40&=32\lambda_1^2\\ \lambda_1^2&=\tfrac{40}{32}\\ &=\tfrac54\end{aligned}$$
<p>This gives $\lambda_1=\tfrac{\sqrt5}{2}$. But</p>
$$\begin{aligned}\mu&=-\frac{6-0}{2\cdot\frac{\sqrt5}{2}}+2\\ &=-\frac{6}{\sqrt5}+2\\ &\approx -0.68\\ &&lt;0\end{aligned}$$
<p>which contradicts $\mu&gt;0$.</p>
<p><b>3. Case $\mu=0$.</b> The second equation gives $6-\lambda_2=4\lambda_1$. Substitute it into the first:</p>
$$\begin{aligned}\frac{4+(4\lambda_1)^2}{4\lambda_1^2}&=8\\ 4+16\lambda_1^2&=32\lambda_1^2\\ 4&=16\lambda_1^2\\ \lambda_1^2&=\tfrac14\\ \lambda_1&=\tfrac12\quad(\lambda_1\ge 0)\\ \lambda_2&=6-4\cdot\tfrac12\\ &=6-2\\ &=4\\ &\ge 0\end{aligned}$$
<p><b>4. Value.</b></p>
$$\begin{aligned}w^*&=z^L(\tfrac12,4)\\ &=\frac{4+(6-4)^2}{4\cdot\frac12}+8\cdot\tfrac12+2\cdot4\\ &=\frac{4+4}{2}+4+8\\ &=4+4+8\\ &=16\end{aligned}$$
<p>The primal optimum is $x^*=(2,2)$, with $$\begin{aligned}z^*&=4+12\\ &=16:\end{aligned}$$ strong duality holds, as the primal is a regular convex program.</p>
$$\begin{aligned}z^*&=f(x^*)\\ &=2\cdot2+6\cdot2\\ &=4+12\\ &=16\end{aligned}$$`,
d:["",String.raw`Accepts the case $\mu&gt;0$ without checking its sign: $$\begin{aligned}\mu&=2-\tfrac{6}{\sqrt5}\\ &&lt;0\end{aligned}$$`,
String.raw`Takes the negative root of $\lambda_1^2=\tfrac14$. It breaks $\lambda_1\ge 0$, and it would even contradict weak duality: $$\begin{aligned}w&=8\\ &&lt;z^*\\ &=16\end{aligned}$$$$\begin{aligned}\lambda_2&=6-4\cdot\big(-\tfrac12\big)\\ &=6+2\\ &=8\\ z^L(-\tfrac12,8)&=\frac{4+(6-8)^2}{4\cdot(-\frac12)}+8\cdot\big(-\tfrac12\big)+2\cdot8\\ &=\frac{4+4}{-2}-4+16\\ &=-4-4+16\\ &=8\end{aligned}$$`,
String.raw`Sets $\lambda_1=0$ and forgets that $z^L\to+\infty$ there: the term $2x_1$ is unbounded.`,""]},

{i:"Solving the Lagrange dual program", c: "Solving the Lagrange dual",q:String.raw`<p>Consider</p>$$\begin{aligned}z^*=\max\ & 3x_1+4x_2\\ \text{s.t.}\ & x_1^2+x_2^2\le 25\\ & x_1+x_2\le 10,\end{aligned}$$<p>whose optimal solution is $x^*=(3,4)$, with $z^*=25$. You solve its Lagrange dual program $\min_{\lambda\ge 0}z^L(\lambda)$, with a multiplier $\mu\ge 0$ for $\lambda_2\ge 0$. Which statements are correct?</p>`,m:true,
o:[String.raw`For $\lambda_1&gt;0$, the Lagrange relaxation is $z^L(\lambda)=\dfrac{(3-\lambda_2)^2+(4-\lambda_2)^2}{4\lambda_1}+25\lambda_1+10\lambda_2$.`,
String.raw`The dual optimal solution is $\lambda^*=(\tfrac12,\ 0)$.`,
String.raw`$$\begin{aligned}w^*&=25\\ &=z^*\end{aligned}$$`,
String.raw`At the dual optimum, the multiplier $\mu$ of $\lambda_2\ge 0$ is positive.`,
String.raw`Strong duality holds here only because $x_1+x_2\le 10$ is nonbinding at $x^*$.`],ok:[0,1,2,3],
e:String.raw`<p><b>1. Relaxation.</b></p>
$$\begin{aligned}\mathcal{L}(x|\lambda)&=3x_1+4x_2+\lambda_1(25-x_1^2-x_2^2)+\lambda_2(10-x_1-x_2)\\ &=\big[(3-\lambda_2)x_1-\lambda_1x_1^2\big]\\ &\quad+\big[(4-\lambda_2)x_2-\lambda_1x_2^2\big]+25\lambda_1+10\lambda_2\end{aligned}$$
<p>Each bracket $ax_j-\lambda_1x_j^2$ peaks at $\tfrac{a^2}{4\lambda_1}$, with</p>
$$\begin{aligned}a&=3-\lambda_2\\ a&=4-\lambda_2\end{aligned}$$
<p>so</p>
$$\begin{aligned}z^L(\lambda)&=\frac{(3-\lambda_2)^2}{4\lambda_1}+\frac{(4-\lambda_2)^2}{4\lambda_1}+25\lambda_1+10\lambda_2\\ &=\frac{(3-\lambda_2)^2+(4-\lambda_2)^2}{4\lambda_1}+25\lambda_1+10\lambda_2\end{aligned}$$
<p><b>2. KKT of the dual.</b> $\lambda_1\ge 0$ cannot bind, since $z^L\to\infty$ when $\lambda_1\to 0$.</p>
$$\begin{aligned}\frac{\partial z^L}{\partial\lambda_1}&=-\frac{(3-\lambda_2)^2+(4-\lambda_2)^2}{4\lambda_1^2}+25\\ &=0\\ \frac{\partial z^L}{\partial\lambda_2}-\mu&=-\frac{2\,(3-\lambda_2)}{4\lambda_1}-\frac{2\,(4-\lambda_2)}{4\lambda_1}+10-\mu\\ &=-\frac{7-2\lambda_2}{2\lambda_1}+10-\mu\\ &=0\\ \mu\lambda_2&=0\end{aligned}$$
<p><b>3. Case $\mu&gt;0$.</b> Then $\lambda_2=0$, and the first equation gives</p>
$$\begin{aligned}\frac{(3-0)^2+(4-0)^2}{4\lambda_1^2}&=25\\ \frac{9+16}{4\lambda_1^2}&=25\\ \frac{25}{4\lambda_1^2}&=25\\ \lambda_1^2&=\tfrac14\\ \lambda_1&=\tfrac12\\ \mu&=-\frac{2\,(3-0)}{4\cdot\frac12}-\frac{2\,(4-0)}{4\cdot\frac12}+10\\ &=-3-4+10\\ &=3\\ &&gt;0\end{aligned}$$
<p>which is consistent.</p>
<p><b>4. Case $\mu=0$.</b> The second equation gives</p>
$$\begin{aligned}7-2\lambda_2&=20\lambda_1\\ \lambda_2&=\tfrac{7-20\lambda_1}{2}\\ 3-\lambda_2&=\tfrac{6-7+20\lambda_1}{2}\\ &=\tfrac{20\lambda_1-1}{2}\\ 4-\lambda_2&=\tfrac{8-7+20\lambda_1}{2}\\ &=\tfrac{20\lambda_1+1}{2}\end{aligned}$$
<p>The first equation, multiplied by $4\lambda_1^2$, becomes</p>
$$\begin{aligned}(3-\lambda_2)^2+(4-\lambda_2)^2&=100\lambda_1^2\\ \frac{(20\lambda_1-1)^2}{4}+\frac{(20\lambda_1+1)^2}{4}&=100\lambda_1^2\\ \frac{400\lambda_1^2-40\lambda_1+1}{4}+\frac{400\lambda_1^2+40\lambda_1+1}{4}&=100\lambda_1^2\\ \big(100\lambda_1^2-10\lambda_1+\tfrac14\big)+\big(100\lambda_1^2+10\lambda_1+\tfrac14\big)&=100\lambda_1^2\\ 200\lambda_1^2+\tfrac12&=100\lambda_1^2\\ 100\lambda_1^2+\tfrac12&=0\end{aligned}$$
<p>which is impossible.</p>
<p><b>5. Value.</b></p>
$$\begin{aligned}w^*&=z^L(\tfrac12,0)\\ &=\frac{(3-0)^2}{4\cdot\frac12}+\frac{(4-0)^2}{4\cdot\frac12}+25\cdot\tfrac12+10\cdot0\\ &=\tfrac92+\tfrac{16}{2}+\tfrac{25}{2}+0\\ &=4.5+8+12.5+0\\ &=25\\ &=z^*\end{aligned}$$`,
d:[String.raw`Correct.`,String.raw`Correct: the case $\mu&gt;0$ gives it, and the case $\mu=0$ has no solution.`,
String.raw`Correct:$$\begin{aligned}w^*&=\tfrac92+\tfrac{16}{2}+\tfrac{25}{2}+0\\ &=4.5+8+12.5+0\\ &=25\\ z^*&=3\cdot3+4\cdot4\\ &=9+16\\ &=25\end{aligned}$$`,String.raw`Correct: $\mu=3$.`,
String.raw`Wrong. Strong duality holds because the primal is a regular convex program. A binding constraint would just get a positive multiplier.`]},

{i:"LP duality as a special case", c: "LP duality as a special case",q:String.raw`<p>To relax the LP</p>$$\begin{aligned}\max\ & c^Tx\\ \text{s.t.}\ & Ax=b\\ & x\ge 0\end{aligned}$$<p>you keep $x\ge 0$ and relax $Ax=b$ with multipliers $\lambda\in\mathbb{R}^m$:</p>$$z^L(\lambda)=\max_{x\ge 0}\ c^Tx+\lambda^T(b-Ax).$$<p>Why is $\lambda$ left unrestricted in sign?</p>`,
o:[String.raw`An equality can be violated in either direction, so no multiplier of a fixed sign can reward feasibility or penalize infeasibility.`,
String.raw`Because $x\ge 0$ is kept as a constraint, which already makes the Lagrangian bounded.`,
String.raw`Because an LP is a convex program, so strong duality holds with any sign.`,
String.raw`Because the dual of a maximization LP always has free variables.`,NONE],ok:[0],
e:String.raw`<blockquote>We set no sign restriction for $\lambda$. For an equality constraint, a violation may occur in either direction, so no multiplier with a specific sign can reward feasibility or penalize infeasibility.</blockquote>
<p>With $Ax\le b$, a positive slack is good and $\lambda\ge 0$ rewards it. With $Ax=b$, both of these are violations:</p>
$$\begin{aligned}b-Ax&&gt;0\\ b-Ax&&lt;0\end{aligned}$$`,
d:["",String.raw`Is false: $x\ge 0$ does not bound the Lagrangian; for many $\lambda$ it is unbounded.`,
String.raw`Mixes up two facts: strong duality is about $w^*=z^*$, not about the sign of $\lambda$.`,
String.raw`Is false: the $\le$ constraints of a max give dual variables $\ge 0$; only equalities give free ones.`,""]},

{i:"LP duality as a special case", c: "LP duality as a special case",q:String.raw`<p>Consider the LP</p>$$\begin{aligned}\max\ & 3x_1+2x_2+4x_3\\ \text{s.t.}\ & x_1+x_2+x_3=4\\ & x_1+2x_2+3x_3=6\\ & x\ge 0,\end{aligned}$$<p>and its Lagrange relaxation $z^L(\lambda)=\max_{x\ge 0}\ c^Tx+\lambda^T(b-Ax)$, with $\lambda\in\mathbb{R}^2$. Which statements are correct?</p>`,m:true,
o:[String.raw`$z^L(1,1)=+\infty$.`,String.raw`$z^L(2,1)=14$.`,String.raw`$z^L(3,0)=12$.`,String.raw`$z^L(-2,5)=22$.`,
String.raw`$\lambda=(-2,5)$ cannot be used, because Lagrange multipliers must be nonnegative.`],ok:[0,1,3],
e:String.raw`<p><b>1. Rewrite.</b></p>
$$z^L(\lambda)=\lambda^Tb+\max_{x\ge 0}\,(c^T-\lambda^TA)x$$
<p>If a component of $c^T-\lambda^TA$ is positive, that $x_j$ can grow forever and $z^L=+\infty$. Otherwise the maximum is 0, at $x=0$, and</p>
$$\begin{aligned}z^L&=\lambda^Tb\\ &=4\lambda_1+6\lambda_2\end{aligned}$$
<p><b>2. Check each $\lambda$.</b> Compare $\lambda^TA=(\lambda_1+\lambda_2,\ \lambda_1+2\lambda_2,\ \lambda_1+3\lambda_2)$ with $c=(3,2,4)$:</p>
$$\begin{aligned}\lambda&=(1,1):\\ \lambda^TA&=(1+1,\ 1+2\cdot1,\ 1+3\cdot1)\\ &=(2,3,4)\\ c_1&=3\\ &&gt;2\\ &\Rightarrow\ z^L(1,1)=+\infty\\[1mm] \lambda&=(2,1):\\ \lambda^TA&=(2+1,\ 2+2\cdot1,\ 2+3\cdot1)\\ &=(3,4,5)\\ &\ge c\\ z^L(2,1)&=4\cdot2+6\cdot1\\ &=8+6\\ &=14\\[1mm] \lambda&=(3,0):\\ \lambda^TA&=(3+0,\ 3+2\cdot0,\ 3+3\cdot0)\\ &=(3,3,3)\\ c_3&=4\\ &&gt;3\\ &\Rightarrow\ z^L(3,0)=+\infty\\[1mm] \lambda&=(-2,5):\\ \lambda^TA&=(-2+5,\ -2+2\cdot5,\ -2+3\cdot5)\\ &=(3,8,13)\\ &\ge c\\ z^L(-2,5)&=4\cdot(-2)+6\cdot5\\ &=-8+30\\ &=22\end{aligned}$$
<p>The multipliers of equalities are free, so $(-2,5)$ is allowed and gives a valid, loose, bound. For reference, $z^*=13$ at $x^*=(3,0,1)$.</p>
$$\begin{aligned}f(x^*)&=3\cdot3+2\cdot0+4\cdot1\\ &=9+0+4\\ &=13\end{aligned}$$`,
d:[String.raw`Correct: the coefficient of $x_1$ is $$\begin{aligned}3-(1+1)&=3-2\\ &=1\\ &&gt;0\end{aligned}$$`,String.raw`Correct.`,
String.raw`Wrong. It computes $\lambda^Tb=12$ without checking $c^T\le\lambda^TA$: $x_3$ has the coefficient $$\begin{aligned}4-3&=1\\ &&gt;0,\end{aligned}$$ so $z^L=+\infty$.$$\begin{aligned}\lambda^Tb&=4\cdot3+6\cdot0\\ &=12+0\\ &=12\\ c_3-(\lambda^TA)_3&=4-(3+3\cdot0)\\ &=4-3\\ &=1\\ &&gt;0\end{aligned}$$`,
String.raw`Correct: $c^T\le\lambda^TA$ holds.`,
String.raw`Wrong. For equality constraints there is no sign restriction on $\lambda$.`]},

{i:"LP duality as a special case", c: "LP duality as a special case",q:String.raw`<p>You apply Lagrange duality to the LP</p>$$\begin{aligned}\max\ & 3x_1+2x_2+4x_3\\ \text{s.t.}\ & x_1+x_2+x_3=4\\ & x_1+2x_2+3x_3=6\\ & x\ge 0,\end{aligned}$$<p>with multipliers on the two equalities. Which program is its Lagrange dual program?</p>`,

<blockquote>The dual program is meaningful only if $c^T\le\lambda^TA$. If $\lambda$ satisfies $c^T\le\lambda^TA$, we know $\max_{x\ge 0}(c^T-\lambda^TA)x=0$ (attained at $x=0$).</blockquote>
<p>So the Lagrange dual becomes</p>
$$\begin{aligned}\min_{\lambda\ \text{urs.}}\ & \lambda^Tb\\ \text{s.t.}\ & \lambda^TA\ge c^T\end{aligned}$$

// El ✎ de un apartado copia al portapapeles un prompt para Claude Code, en español: que reescriba el apartado entero en el HTML para que se entienda,
// según «Mejorar un apartado a petición» de modos/apuntes-de-diapositivas.md. Si cambias el nombre de esa sección, cámbialo aquí.
// El prompt lleva dónde está el HTML, la unidad, el bloque, el hilo y el texto del apartado, y acaba en una línea opcional para que Óscar diga qué no entiende.
function mejora(k, b) {
  const x = D[k], h = hilo(k);
  const t = "Usa la skill second-brain-assistant y sigue «Mejorar un apartado a petición» de modos/apuntes-de-diapositivas.md.\n" +
    "No entiendo este apartado de mi material de estudio. Reescríbelo entero en el HTML para que se entienda mejor: más detallado, con cada paso escrito y con el salto de cada idea a la siguiente.\n\n" +
    `HTML: ${decodeURI(location.href)}\nCURSO: ${CURSO.t}\nCONTEXTO: ${CTX}\nUNIDAD: ${UN.n} - ${UN.t}, vista ${VI}\n\n` +
    `DÓNDE ESTÁ\nBloque ${BL.indexOf(x.c) + 1} de ${BL.length}: "${x.c}". Sus apartados:\n${lista(x, "   ← ESTE")}` +
    (h ? `\n\nEL HILO DE LA CLASE\n${h}` : "") + `\n\nEL APARTADO: ${x.t}\n${txt(x.h)}\n\nLO QUE NO ENTIENDO EN CONCRETO (opcional): `;
  copia(t);
  b.textContent = ICON.check; setTimeout(() => b.textContent = ICON.cc, 1500);
}
function explain(id) {
  const it = Q[id], ok = it.ok.map(k => perm[id].indexOf(k)).sort().map(p => `(${L[p]})`);
  return `<p class="hd"><button class="ask" title="${T.ask}" aria-label="${T.ask}" onclick="ask(${id})">?</button></p><p class="ansl"><b>${T.answer}: ${list(ok)}.</b></p>` + sub(id, it.e) +
    perm[id].map((k, p) => it.d[k] ? `<p class="cm ${it.ok.includes(k) ? "cok" : "cko"}"><b>(${L[p]})</b> ${sub(id, it.d[k])}</p>` : "").join("");
}
// Una pregunta en sus tres huecos: el enunciado, las opciones y la solución. re la vuelve a pintar tras un clic.
function pregunta(id, eq, eo, ee, re) {
  const it = Q[id], a = ans[id] || [], s = !!shown[id], o = out[id] || [];
  eq.innerHTML = it.q;
  eo.replaceChildren(...perm[id].map((k, p) => {
    const b = document.createElement("button");
    // Una pregunta de varias respuestas lleva una casilla delante de cada opción: así se ve que admite varias.
    b.className = "opt"; b.innerHTML = `${it.m ? '<i class="cb" aria-hidden="true"></i>' : ""}<b>(${L[p]})</b><span>${sub(id, it.o[k])}</span>`;
    if (it.m) { b.setAttribute("role", "checkbox"); b.setAttribute("aria-checked", a.includes(k)) }
    if (a.includes(k)) b.classList.add("sel");
    if (s) { if (it.ok.includes(k)) b.classList.add("ok"); else if (a.includes(k)) b.classList.add("ko") }
    b.disabled = lock[id] || s;
    b.onclick = () => {
      if (it.m) ans[id] = a.includes(k) ? a.filter(x => x !== k) : [...a, k];
      else ans[id] = a.includes(k) ? [] : [k];
      re();
    };
    // El tachado solo marca a la vista una opción descartada: no responde ni corrige.
    const x = document.createElement("button"), r = document.createElement("div");
    x.className = "x"; x.textContent = "✕"; x.title = T.strike; x.setAttribute("aria-label", `${T.strike} (${L[p]})`);
    x.setAttribute("aria-pressed", o.includes(k));
    x.onclick = () => { out[id] = o.includes(k) ? o.filter(y => y !== k) : [...o, k]; re() };
    r.className = o.includes(k) ? "row out" : "row"; r.append(b, x);
    return r;
  }));
  ee.innerHTML = s ? explain(id) : ""; ee.hidden = !s;
}
// La etiqueta del botón de la solución, y su clic: corrige la elección y la bloquea.
const etiqueta = id => shown[id] ? "hide" : ((ans[id] || []).length && !lock[id] ? "check" : "show");
const alterna = id => { shown[id] = !shown[id]; if (shown[id] && (ans[id] || []).length) check(id) };
// El mapa: el botón de arriba, que comprime y despliega la lista, y sus filas.
function mapa(filas) {
  document.body.classList.toggle("fold", fold);
  const tg = document.createElement("button"), tk = fold ? "unfold" : "fold";
  tg.className = "tog"; tg.title = T[tk]; tg.setAttribute("aria-label", T[tk]);
  tg.innerHTML = fold ? `<span class="ic" aria-hidden="true">${ICON[tk]}</span>` : lbl(tk);
  tg.onclick = () => { fold = !fold; try { localStorage.setItem("test-mapa", fold ? "fold" : "open") } catch (e) {} draw() };
  $("m").replaceChildren(tg, ...filas);
  // La primera fila de un bloque lleva a la vista también su cabecera, que si no queda bajo el botón fijo de la lista.
  const cur = $("m").querySelector(".cur");
  if (cur?.previousElementSibling?.className === "grp") cur.previousElementSibling.scrollIntoView({block: "nearest", inline: "nearest"});
  cur?.scrollIntoView({block: "nearest", inline: "nearest"});
}
// La fila de la pregunta k en la posición p del mapa, con el color de su estado; la cabecera de un cluster.
function fila(k, p, cur, salta) {
  const b = document.createElement("button"), s = document.createElement("span");
  s.textContent = SNIP[k]; b.innerHTML = `<b>P${p + 1}</b>`; b.append(s);
  b.className = lock[k] ? (right(k) ? "ok" : part(k) ? "part" : "ko") : ((ans[k] || []).length ? "ans" : "");
  if (cur) b.classList.add("cur");
  b.onclick = salta;
  return b;
}
const cabecera = c => { const g = document.createElement("div"); g.className = "grp"; g.textContent = g.title = c; return g };
function draw() {
  if (ESTUDIO) return marca();
  const id = order[i], it = Q[id], s = !!shown[id];
  mapa(order.flatMap((k, p) => {
    const b = fila(k, p, p === i, () => go(p));
    if (p && Q[order[p - 1]].c === Q[k].c) return [b];
    const g = cabecera(Q[k].c); g.style.setProperty("--k", tono(Q[k].c));
    return [g, b];
  }));
  $("n").textContent = (retry ? T.review : "") + `${T.q} ${i + 1} / ${order.length}`;
  $("c").textContent = it.c;
  ["c", "k"].forEach(x => $(x).style.setProperty("--k", tono(it.c)));
  pregunta(id, $("q"), $("o"), $("e"), draw);
  $("e").scrollTop = 0;
  document.body.classList.toggle("split", s);
  $("s").innerHTML = lbl(etiqueta(id));
  $("p").innerHTML = lbl("prev"); $("x").innerHTML = lbl("next");
  $("p").disabled = i === 0; $("x").disabled = i === order.length - 1;
  $("r").innerHTML = lbl("wrong", `${T.wrong} (${wrong.size})`); $("r").disabled = !wrong.size;
  $("t").innerHTML = lbl("back", `${T.back} (${Q.length})`); $("t").hidden = !retry;
  tex(document.body);
}

// Una gráfica de funciones con un deslizador nativo por parámetro, en los colores del tema.
// g = {x: [x0, x1], y: [y0, y1], f: [(x, p) => ...], p: {nombre: [mínimo, máximo, paso, inicial]}}. Donde f no da un número, la curva deja un hueco.
// Con t: [t0, t1], cada curva es paramétrica: f es (t, p) => [x, y], como el lugar de Nyquist con t = log10 ω. l: ["eje x", "eje y"] rotula los ejes.
function grafica(el, g) {
  const W = 600, H = 300, p = {}, X = x => (x - g.x[0]) / (g.x[1] - g.x[0]) * W, Y = y => H - (y - g.y[0]) / (g.y[1] - g.y[0]) * H;
  const ejes = (g.x[0] <= 0 && g.x[1] >= 0 ? `<line x1="${X(0)}" y1="0" x2="${X(0)}" y2="${H}"/>` : "") + (g.y[0] <= 0 && g.y[1] >= 0 ? `<line x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}"/>` : "");
  const rot = g.l ? `<g style="fill:currentColor;opacity:.75;font-size:15px"><text x="${W - 4}" y="${H - 6}" text-anchor="end">${g.l[0]}</text><text x="6" y="16">${g.l[1]}</text></g>` : "";
  const punto = (f, k) => { if (g.t) return f(g.t[0] + k / 300 * (g.t[1] - g.t[0]), p) || []; const x = g.x[0] + k / 300 * (g.x[1] - g.x[0]); return [x, f(x, p)] };
  el.className = "viz"; el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"></svg>`;
  const pinta = () => el.firstChild.innerHTML = `<g style="stroke:currentColor;opacity:.4">${ejes}</g>` + rot + (g.f || []).map((f, n) => {
    let d = "", up = false;
    for (let k = 0; k <= 300; k++) { const [x, y] = punto(f, k); if (Number.isFinite(x) && Number.isFinite(y)) { d += (up ? "L" : "M") + X(x).toFixed(1) + " " + Y(y).toFixed(1); up = true } else up = false }
    return `<path d="${d}" fill="none" stroke-width="2.5" style="stroke:var(${["--ac", "--ko", "--ok", "--qt"][n % 4]})"/>`;
  }).join("");
  Object.entries(g.p || {}).forEach(([n, [a, b, st, v]]) => {
    const l = document.createElement("label"), r = document.createElement("input"), o = document.createElement("output");
    p[n] = v; r.type = "range"; r.min = a; r.max = b; r.step = st; r.value = v; o.value = v;
    r.oninput = () => { p[n] = +r.value; o.value = r.value; pinta() };
    l.append(n, r, o); el.append(l);
  });
  pinta();
}
// La página de estudio: cada sección con su apartado, y al final de cada bloque sus preguntas en tarjetas. QD[id] es la posición de la pregunta id en D.
const QD = D.flatMap((x, k) => "h" in x ? [] : [k]);
// Los bloques en su orden, y el color de cada uno: --k0 a --k4, que se repiten.
const BL = [...new Set(D.map(y => y.c))], tono = c => `var(--k${BL.indexOf(c) % 5})`;
let leo = -1;
function estudio() {
  ["c", "k", "e"].forEach(x => $(x).remove()); document.querySelector("footer").remove();
  document.documentElement.style.setProperty("--fh", "0px");
  const pg = document.createElement("main"); pg.id = "pg";
  pg.innerHTML = `<h1></h1><p class="sub"></p>`; pg.firstChild.textContent = document.title; pg.children[1].textContent = CTX;
  D.forEach((x, k) => {
    if (!k || D[k - 1].c !== x.c) { const h = document.createElement("h2"); h.textContent = x.c; h.style.setProperty("--k", tono(x.c)); pg.append(h) }
    const b = document.createElement(!("h" in x) ? "div" : "section"); b.id = "b" + k; b.style.setProperty("--k", tono(x.c));
    if (!("h" in x)) { b.className = "p"; b.innerHTML = `<p class="n hd"><button class="ask" title="${T.what}" aria-label="${T.what}" onclick="ask(${QD.indexOf(k)}, false)">?</button><span></span></p><div class="q"></div><div class="o"></div><div class="e" hidden></div>` }
    else {
      b.innerHTML = `<div class="her"><button class="ask" title="${T.cc}" aria-label="${T.cc}" onclick="mejora(${k}, this)">${ICON.cc}</button><button class="ask" title="${T.sec}" aria-label="${T.sec}" onclick="askS(${k})">?</button></div><div class="hd"><h3></h3></div><div class="h">${x.h}</div>`;
      b.querySelector("h3").textContent = x.t;
      b.querySelectorAll("[data-g]").forEach(el => grafica(el, x.g[el.dataset.g]));
    }
    pg.append(b);
  });
  // Un enlace data-t lleva a otro apartado de la vista, con su número T; uno data-u abre otra unidad del curso por su número n.
  const S = D.filter(y => "h" in y);
  pg.querySelectorAll("a[data-t]:not([data-u])").forEach(a => {
    const s = S.find(y => y.t === a.dataset.t);
    if (!s) return;
    a.textContent = `T${S.indexOf(s) + 1} · ${s.t}`; a.href = "#";
    a.onclick = e => { e.preventDefault(); ir(D.indexOf(s)) };
  });
  // Con data-t además, abre la vista completa de esa unidad en el apartado de ese título, y sin texto propio enseña «<unidad> · <título>».
  pg.querySelectorAll("a[data-u]").forEach(a => {
    const k = CURSO.u.findIndex(u => u.n === a.dataset.u);
    if (k < 0) return;
    const t = a.dataset.t, v = t && CURSO.u[k].v.completa ? "completa" : VISTAS.find(v => CURSO.u[k].v[v]);
    a.href = `#${k}/${v}` + (t ? "/" + encodeURIComponent(t) : "");
    if (t && !a.textContent.trim()) a.textContent = `${CURSO.u[k].n} · ${t}`;
  });
  document.body.insertBefore(pg, $("hq"));
  const cw = () => document.documentElement.style.setProperty("--cw", document.documentElement.clientWidth + "px");
  Q.forEach((_, id) => dibuja(id, false));
  tex(pg); cw();
  let t; onscroll = () => { clearTimeout(t); t = setTimeout(sigue, 200) };
  addEventListener("resize", () => { cw(); Q.forEach((_, id) => shown[id] && alto(id)) });
  // Vuelve al bloque donde se dejó la lectura, cuando las imágenes ya tienen su alto.
  // Una dirección con título salta a ese apartado, y la quita para que la próxima carga vuelva a donde se dejó la lectura.
  const vuelve = () => {
    cw();
    const s = ht ? D.findIndex(y => "h" in y && y.t === ht) : -1;
    if (s >= 0) { $("b" + s).scrollIntoView({block: "start"}); history.replaceState(null, "", `#${UI}/${VI}`) }
    else try { const v = JSON.parse(localStorage.getItem(POS)); if (v && $("b" + v.k)) scrollTo(0, $("b" + v.k).getBoundingClientRect().top + scrollY - v.y) } catch (e) {}
    sigue();
  };
  // Ocultar las preguntas deja en su sitio el apartado que se lee. La elección vale para todas las páginas.
  const hq = $("hq"), pon = v => { document.body.classList.toggle("sinp", v); hq.setAttribute("aria-pressed", v) };
  hq.hidden = !Q.length; hq.title = T.noq; hq.setAttribute("aria-label", T.noq);
  try { pon(Q.length > 0 && localStorage.getItem("estudio-sinp") === "1") } catch (e) {}
  hq.onclick = () => {
    const a = [...document.querySelectorAll("#pg section")].find(x => x.getBoundingClientRect().bottom > 60), y = a?.getBoundingClientRect().top;
    const v = !document.body.classList.contains("sinp"); pon(v);
    try { localStorage.setItem("estudio-sinp", v ? "1" : "0") } catch (e) {}
    if (a) scrollBy(0, a.getBoundingClientRect().top - y);

  document.readyState === "complete" ? vuelve() : addEventListener("load", vuelve);
}
// Pinta la tarjeta de la pregunta id. Abrir su solución cierra la que estuviera abierta, como en el test, donde solo se ve la de la pregunta actual.
function dibuja(id, todo = true) {
  const c = $("b" + QD[id]), [n, q, o, e] = c.children;
  n.lastChild.textContent = `${T.q} ${id + 1} / ${Q.length}`;
  pregunta(id, q, o, e, () => dibuja(id));
  const w = document.createElement("p"), b = document.createElement("button");
  w.className = "qa";
  b.className = "chk"; b.innerHTML = lbl(etiqueta(id));
  b.onclick = () => { alterna(id); if (shown[id]) for (const k in shown) if (+k !== id && shown[k]) { shown[k] = false; dibuja(+k) } dibuja(id) };
  w.append(b); o.append(w);
  if (todo) { tex(c); marca() }
  alto(id);
}
// Con el panel lateral, la tarjeta crece hasta el alto de su solución, para que el panel no tape lo que sigue.
const alto = id => { const c = $("b" + QD[id]), e = c.children[3]; c.style.minHeight = shown[id] && getComputedStyle(e).position === "absolute" ? e.offsetHeight + "px" : "" };
// El bloque que se lee es el primero que asoma bajo la barra; se guarda con su desplazamiento para volver a él.
function sigue() {
  const b = [...document.querySelectorAll("#pg [id^=b]")].find(x => x.getBoundingClientRect().bottom > 60) || $("b0");
  if (!b) return;
  try { localStorage.setItem(POS, JSON.stringify({k: +b.id.slice(1), y: Math.round(b.getBoundingClientRect().top)})) } catch (e) {}
  if (+b.id.slice(1) !== leo) { leo = +b.id.slice(1); marca() }
}
// El índice de la página: la cabecera de cada bloque, una fila T1, T2… por apartado y una P1, P2… por pregunta, que llevan a su sitio.
// El salto se anima, salvo si el sistema pide reducir el movimiento.
const ir = k => $("b" + k).scrollIntoView({block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
function marca() {
  let t = 0;
  mapa(D.flatMap((x, k) => {
    const f = !("h" in x) ? fila(QD.indexOf(k), QD.indexOf(k), k === leo, () => ir(k)) : document.createElement("button");
    if ("h" in x) { f.className = "sr" + (k === leo ? " cur" : ""); f.innerHTML = `<b>T${++t}</b><span></span>`; f.lastChild.textContent = x.t; f.onclick = () => ir(k) }
    if (k && D[k - 1].c === x.c) return [f];
    const g = cabecera(x.c); g.onclick = () => ir(k); g.style.setProperty("--k", tono(x.c));
    return [g, f];
  }));
  tex($("m"));
}

// La barra, arriba, en el idioma del curso: en una vista, el botón de la parrilla, si el curso tiene varias unidades, y una pestaña por vista.
// Ningún botón lleva a otra asignatura. Un curso de una sola unidad, como la página suelta que él comparte, no lleva a ninguna otra página.
function barra() {
  const u = $("u"), vs = UN ? VISTAS.filter(v => UN.v[v]) : [], a = (h, html, cur) => { const e = document.createElement("a"); e.href = h; e.innerHTML = html; if (cur) e.setAttribute("aria-current", "page"); u.append(e) };
  if (V && CURSO.u.length > 1) a("#", lbl("grid", TC.grid));
  if (vs.length > 1) vs.forEach(v => a(`#${UI}/${v}`, TC.vistas[v], v === VI));
  u.hidden = !u.children.length;
  new ResizeObserver(() => document.documentElement.style.setProperty("--uh", u.offsetHeight + "px")).observe(u);
}
// La parrilla del curso: una casilla por unidad, con su número, su título y un enlace por vista. Un clic en la casilla abre su primera vista.
function parrilla() {
  ["c", "k", "e", "m", "hq"].forEach(x => $(x).remove()); document.querySelector("footer").remove();
  const pg = document.createElement("main"); pg.id = "pg";
  pg.innerHTML = `<h1></h1><p class="sub"></p>`;
  pg.children[0].textContent = CURSO.t; pg.children[1].textContent = CURSO.ctx;
  // Una parrilla por grupo: la teoría, los ejercicios resueltos y los tests. Una unidad sin grupo es un test si solo tiene la vista test, y teoría si no.
  const grupo = un => un.g || (Object.keys(un.v).every(v => v === "test") ? "test" : "teoria");
  const gs = ["teoria", "ejercicios", "test"].filter(g => CURSO.u.some(un => grupo(un) === g)), rejilla = {};
  gs.forEach(g => {
    if (gs.length > 1) { const h = document.createElement("h2"); h.textContent = TC.grupos[g]; pg.append(h) }
    rejilla[g] = document.createElement("div"); rejilla[g].className = "grid"; pg.append(rejilla[g]);
  });
  CURSO.u.forEach((un, k) => {
    const c = document.createElement("div"), vs = VISTAS.filter(v => un.v[v]);
    c.className = "tile";
    c.innerHTML = `<b></b><span></span><p></p>`; c.children[0].textContent = un.n; c.children[1].textContent = un.t;
    vs.forEach(v => { const a = document.createElement("a"); a.href = `#${k}/${v}`; a.textContent = TC.vistas[v]; c.lastChild.append(a) });
    c.onclick = e => { if (!e.target.closest("a")) location.hash = `${k}/${vs[0]}` };
    rejilla[grupo(un)].append(c);
  });
  document.body.insertBefore(pg, $("th"));
}

if (V && !ESTUDIO) {
  $("w").title = T.what; $("w").setAttribute("aria-label", T.what); $("w").onclick = () => ask(order[i], false);
  $("s").onclick = () => { alterna(order[i]); draw() };
  $("p").onclick = () => go(i - 1);
  $("x").onclick = () => go(i + 1);
  $("r").onclick = () => start(Q.map((_, k) => k).filter(k => wrong.has(k)), true);
  $("t").onclick = () => start(Q.map((_, k) => k), false);
  // La altura de la botonera, para que el panel de la solución y el mapa no bajen hasta ella.
  const foot = document.querySelector("footer");
  new ResizeObserver(() => document.documentElement.style.setProperty("--fh", foot.offsetHeight + "px")).observe(foot);
  onkeydown = e => { if (e.key === "ArrowLeft" && i > 0) go(i - 1); if (e.key === "ArrowRight" && i < order.length - 1) go(i + 1) };
}
$("th").onclick = () => {
  const r = document.documentElement, d = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = d ? "light" : "dark";

// Comprobaciones de un test o de una página de estudio que no necesitan navegador. Fuente única: montar.py las corre con Node
// y la plantilla las incrusta en validar(). Los errores bloquean el montaje; los avisos no.
// D es la lista de bloques: las preguntas, y en una página de estudio también sus secciones {c, t, h, g}. HILO es el nombre del bloque del hilo
// en el idioma de la página. GRUPO es el grupo de la unidad: teoria, ejercicios o test, como un examen de preguntas abiertas.
function comprobar(D, NONE, ANSWER, katex, HILO, GRUPO = "teoria") {
  const EXAMEN = GRUPO === "test", TEORIA = GRUPO === "teoria";
  const Q = D.filter(x => !("h" in x)), S = D.filter(x => "h" in x), titulos = new Set(S.map(x => x.t));
  const err = [], avisos = [], ideas = {}; let multi = 0, none = 0;
  // Ninguna fórmula puede quedar sin renderizar: cada $...$ y $$...$$ pasa por KaTeX, y no queda ningún $ suelto.
  const html = t => t.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");

      if (crudo(s)) r.errores.push(f + "queda una fórmula sin renderizar");
      s.querySelectorAll(".katex svg").forEach(v => { if (!(v.getBoundingClientRect().height > 0.5) && v.closest(".katex").getBoundingClientRect().height > 0) r.errores.push(f + `un trazo de KaTeX («${v.closest(".katex").textContent.slice(0, 30)}») no tiene alto`) });
      s.querySelectorAll("path").forEach(p => { if (/NaN|Infinity/.test(p.getAttribute("d") || "")) r.errores.push(f + "una curva lleva un punto que no es un número") });
      // Un esquema SVG escrito a mano: no puede estar vacío, y ningún texto se sale de su viewBox.
      // Se mide en pantalla, con sus transform: getBBox() no gira un rótulo vertical, ni traslada un texto dentro de un <g> o de un <svg> anidado.
      s.querySelectorAll("svg[viewBox]").forEach(v => {
        if (!v.closest(".viz") && !(v.getBBox().width > 0)) r.errores.push(f + "un SVG está vacío");
        const R = v.getBoundingClientRect();
        v.querySelectorAll("text").forEach(t => { const b = t.getBoundingClientRect(); if (b.width && (b.left < R.left - 1 || b.top < R.top - 1 || b.right > R.right + 1 || b.bottom > R.bottom + 1)) r.errores.push(f + `el texto «${t.textContent.slice(0, 30)}» se sale de su SVG`) });
      });
    });
  } else {
    const keep = [i, shown, order]; shown = {}; order = Q.map((_, k) => k);
    Q.forEach((_, k) => {
      i = k; shown[k] = true; draw();
      document.querySelectorAll(".katex-error").forEach(e => r.errores.push(`pregunta ${k + 1}: KaTeX ${e.title}`));
      if (["q", "o", "e"].some(id => crudo($(id)))) r.errores.push(`pregunta ${k + 1}: queda una fórmula sin renderizar`);
      ancha("#q, #o, #e", r);
    });
    [i, shown, order] = keep; draw();
  }
  // La misma vista en un iframe de 375 px, con cada solución abierta, no puede desbordar a lo ancho. ?m375 marca ese iframe, que no repite la prueba.
  if (!location.search.includes("m375")) {
    const f = document.createElement("iframe");
    f.style.cssText = "width:375px;height:700px"; f.src = location.pathname + "?m375" + location.hash; document.body.append(f);
    await new Promise(ok => f.onload = ok); await new Promise(ok => setTimeout(ok, 2000));
    const w = f.contentWindow, d = f.contentDocument, ancho = () => d.documentElement.scrollWidth > d.documentElement.clientWidth;
    if (ESTUDIO) {
      // Con las preguntas ocultas no se mediría su ancho.
      d.body.classList.remove("sinp");
      if (ancho()) r.errores.push("la página desborda a 375 px");
      for (let k = 0; k < Q.length; k++) {
        const s = () => d.querySelectorAll(".p")[k].querySelector(".chk");
        s().click();
        if (ancho()) r.errores.push(`pregunta ${k + 1}: desborda a 375 px`);
        s().click();
      }
    } else {
      const s = d.getElementById("s");
      for (let k = 0; k < Q.length; k++) {
        w.go(k); s.click();
        if (ancho()) r.errores.push(`pregunta ${k + 1}: desborda a 375 px`);
        s.click();
      }
    }
    // Quitar el iframe con fuentes a medio cargar las deja en error también en esta página, que comparte la caché.
    await d.fonts.ready; f.remove();
  }
  await Promise.allSettled([...document.fonts].map(x => x.load()));
  document.fonts.forEach(x => { if (x.status === "error") r.errores.push(`la fuente ${x.family} ${x.weight} no carga`) });
  r.katex = !!window.katex;
  return r;
}
// Comprobación de todo el curso desde la parrilla: abre cada vista de las unidades desde..hasta en un iframe y lanza su validar().
// Devuelve los errores de cada vista que los tenga; una lista vacía es un curso válido.
async function validarTodo(desde = 0, hasta = CURSO.u.length) {
  const out = [];
  for (let k = desde; k < Math.min(hasta, CURSO.u.length); k++) for (const v of VISTAS.filter(v => CURSO.u[k].v[v])) {
    const f = document.createElement("iframe");
    // ?v da al iframe una dirección distinta de la de la parrilla: con la misma, salvo el #, la parrilla llegó a saltar a la vista que se validaba.
    f.style.cssText = "position:absolute;left:-10000px;top:0;width:1600px;height:1000px"; f.src = `${location.pathname}?v#${k}/${v}`; document.body.append(f);
    await new Promise(ok => f.onload = ok); await new Promise(ok => setTimeout(ok, 1000));
    const r = await f.contentWindow.validar();
    if (r.errores.length || !r.katex) out.push({vista: `${CURSO.u[k].n} / ${v}`, errores: r.errores, katex: r.katex});
    f.remove();
  }
  return out;
}
barra();
!V ? parrilla() : ESTUDIO ? estudio() : draw();
