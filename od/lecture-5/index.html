<style>
/* Una sola hoja para las tres caras del HTML del curso: el test (body.test), la página de estudio (body.estudio) y la parrilla (body.parrilla). Las reglas sin clase de body son del test o comunes. */
:root{color-scheme:light;--ok:#1a7f37;--ko:#c62828;--ac:#1e6fd9;--qt:#b07d00;--me:#7b3fc4;--bg:#fff;--fg:#1d1d1f;--mute:#666;--box:#f4f5f7;--hov:#e9eaed;--math:#d9730d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--ok:#3fb950;--ko:#f05252;--ac:#5b9dff;--qt:#e0b040;--me:#b48cf0;--bg:#161618;--fg:#e8e8ea;--mute:#9a9aa0;--box:#222226;--hov:#2e2e33;--math:#ffa344}}
:root[data-theme=dark]{color-scheme:dark;--ok:#3fb950;--ko:#f05252;--ac:#5b9dff;--qt:#e0b040;--me:#b48cf0;--bg:#161618;--fg:#e8e8ea;--mute:#9a9aa0;--box:#222226;--hov:#2e2e33;--math:#ffa344}
body{background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif;max-width:max(760px,50vw);margin:0 auto;padding:16px 16px calc(var(--fh, 140px) + 16px);box-sizing:border-box;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
#n,.n{color:var(--mute);margin:8px 0}
/* El cluster de la pregunta, siempre a la vista encima del enunciado. En la página de estudio, el mismo estilo titula cada bloque. */
#c,.estudio h2{color:var(--k,var(--ac));font-size:1.05em;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0 0 22px}
/* Un hueco claro separa el enunciado de la primera opción. */
#q,.q{font-size:1.05em;margin:0 0 22px}
#q p,.q p{margin:.4em 0}
button{font:inherit;color:inherit;background:none;cursor:pointer}
.row{display:flex;gap:6px;margin:8px 0}
.opt{flex:1;min-width:0;display:flex;gap:10px;text-align:left;padding:8px 12px;border:0;border-radius:4px;background:var(--box);overflow-x:auto}
.opt:not(:disabled):hover,.x:hover,#m button:hover,#u a:hover,.tile a:hover,#th:hover,#hq:hover{background:var(--hov)}
.x{flex:none;width:40px;border:0;border-radius:4px;background:var(--box);color:var(--mute)}
.x[aria-pressed=true]{color:var(--fg);background:var(--hov)}
.row.out .opt{opacity:.45;text-decoration:line-through}
/* El tachado no entra en las cajas inline-block de KaTeX: cada fórmula lleva el suyo. */
.row.out .opt .katex .base{text-decoration:line-through}
.opt b{flex:none}
.cb{flex:none;width:.95em;height:.95em;margin-top:.25em;border:1.5px solid currentColor;border-radius:3px;display:grid;place-items:center;font-style:normal;font-size:.95em;line-height:1}
.opt.sel .cb::after{content:"✓";font-weight:700}
.opt.sel{background:color-mix(in srgb,var(--ac) 22%,var(--bg))}.opt.sel:not(:disabled):hover{background:color-mix(in srgb,var(--ac) 32%,var(--bg))}
.opt.ok,.opt.ok:hover{background:color-mix(in srgb,var(--ok) 22%,transparent)}
.opt.ko,.opt.ko:hover{background:color-mix(in srgb,var(--ko) 22%,transparent)}
.opt:disabled{cursor:default}
#e,.e{background:var(--box);border-radius:6px;padding:4px 14px;margin-top:12px;overflow-x:auto}
[hidden]{display:none!important}
/* El mapa siempre está a la vista. Si cabe junto al test, es la lista de preguntas, con el número y el comienzo del enunciado,
   a 24px del borde izquierdo, con la mitad del ancho del hueco hasta la pregunta, centrada en vertical en el espacio que queda sobre la botonera.
   --fh es la altura de la botonera. Si no cabe, es una barra de números fija arriba.
   El mapa se desplaza sin barra de scroll visible. Cada fila recorta su texto y lo difumina al final: los puntos suspensivos no tapan los subíndices de KaTeX, que están posicionados.
   position:relative recorta también el MathML oculto de KaTeX, que es absoluto y si no ensancha la lista. */
#m{display:flex;gap:4px;position:sticky;top:var(--uh,0px);z-index:1;background:var(--bg);overflow-x:auto;padding:6px 3px;margin:0 0 8px;scrollbar-width:none}
#m button{flex:none;min-width:30px;padding:2px 4px;font-size:.75em;border:0;border-radius:4px;background:var(--box)}
#m button:not(.tog)>span{display:none}
#m .tog{display:none}
/* Cada cluster abre su bloque en el mapa. En la barra y en la columna comprimida, su cabecera es un punto; en la columna, también el primero, que guarda el sitio de su nombre. */
#m .grp{flex:none;align-self:center;font-size:0;color:var(--k,var(--mute))}
#m .grp::before{content:"•";font-size:14px}
#m .tog+.grp{display:none}
@media (min-width:1140px){
  /* El mapa se centra en el hueco entre la barra de arriba, --uh, y la botonera, --fh, para que la barra no tape su botón de comprimir. */
  #m{position:fixed;top:calc((100vh - var(--fh, 140px) + var(--uh, 0px)) / 2);transform:translateY(-50%);left:24px;width:calc((50vw - max(380px, 25vw) - 32px) / 2);max-height:calc(100vh - var(--fh, 140px) - var(--uh, 0px) - 48px);flex-direction:column;overflow:auto;padding:4px;margin:0;box-sizing:border-box;scroll-padding-top:2.6em}
  #m button{display:flex;gap:8px;align-items:baseline;text-align:left;font-size:.8em;padding:4px 8px}
  /* La columna de la etiqueta cabe T10 o P10, así que los títulos empiezan todos a la misma altura. */
  #m button>b{flex:none;min-width:2.4em}
  /* Alto fijo: una fórmula en el comienzo del enunciado no alarga su fila, y la lista comprimida mide lo mismo. */
  #m button:not(.tog){height:calc(1.5em + 10px);box-sizing:border-box}
  /* flex:1 lleva la caja al borde de la fila: el difuminado cae donde se corta el texto, y un texto que cabe no se difumina. */
  #m button:not(.tog)>span{display:block;flex:1;position:relative;min-width:0;white-space:nowrap;overflow:hidden;mask-image:linear-gradient(to right,#000 calc(100% - 2.5em),transparent)}
  /* El botón de arriba comprime la lista y la vuelve a desplegar. Comprimida, es una columna de casillas numeradas en el mismo sitio: cada fila y cada cabecera conservan su altura, así que la lista no se mueve.
     La cabecera es entonces un punto, y su nombre, transparente y de ancho 0, guarda el alto sin ensanchar la columna. */
  /* Un halo del color de la página tapa el relleno de arriba y el hueco de abajo: ninguna fila asoma por encima ni pasa visible por debajo. */
  #m .tog{display:block;position:sticky;top:-4px;z-index:1;background:var(--box);font-weight:600;box-shadow:0 0 0 4px var(--bg)}
  #m .grp{align-self:stretch;position:relative;font-size:.7em;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:10px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #m .grp::before{content:none}
  #m .tog+.grp{display:block;padding-top:4px}
  body.fold #m{width:auto}
  body.fold #m .grp{color:transparent;width:0;min-width:100%;box-sizing:border-box}
  body.fold #m .grp::before{content:"•";position:absolute;left:0;right:0;bottom:0;text-align:center;color:var(--k,var(--mute))}
  body.fold #m button:not(.tog){justify-content:center;padding:4px 6px}
  body.fold #m button>b{min-width:0}
  body.fold #m button:not(.tog)>span{display:none}
}
#m .ans{background:color-mix(in srgb,#1e6fd9 45%,transparent)}#m .ans:hover{background:color-mix(in srgb,#1e6fd9 62%,transparent)}
#m .ok{background:color-mix(in srgb,var(--ok) 45%,transparent)}#m .ok:hover{background:color-mix(in srgb,var(--ok) 62%,transparent)}
#m .ko{background:color-mix(in srgb,var(--ko) 45%,transparent)}#m .ko:hover{background:color-mix(in srgb,var(--ko) 62%,transparent)}
#m .part{background:color-mix(in srgb,#e0b000 50%,transparent)}#m .part:hover{background:color-mix(in srgb,#e0b000 68%,transparent)}
/* La pregunta o la sección donde estás va resaltada en amarillo claro, en los dos temas, con el texto oscuro para que se lea. */
#m .cur{font-weight:700;background:#fff1a8;color:#1d1d1f}#m .cur:hover{background:#ffe57a}
/* Los botones que piden a Claude una explicación son solo un «?», con su texto al pasar el ratón; al pasar el ratón o al pulsarlos, el fondo se vuelve naranja Claude. */
/* El «?» lleva un velo del color del texto, y no un gris fijo: así contrasta con cualquier fondo, también con el gris del panel de la solución. */
.ask{width:40px;padding:4px 0;border:0;border-radius:4px;background:color-mix(in srgb,var(--fg) 14%,transparent);font-weight:700}
.ask:hover,.ask:active,.ask:focus-visible{background:#d97757;color:#fff}
/* Los tres van en la esquina superior derecha de su marco, en la cabecera .hd: el de explicar la pregunta, el de un apartado y el de la solución.
   En un apartado van fuera de la cabecera, en .her, con el ✎ a la izquierda del «?». */
.hd{display:flex;align-items:center;gap:12px}.hd>.ask{order:1;flex:none;margin-left:auto}
/* La fila del botón de la solución, al pie de una tarjeta de la página de estudio. */
.qa{display:flex;justify-content:flex-end;margin:6px 0 0}
/* Una sola fila de botones del mismo tamaño, para dejar el alto a la pregunta: repasar y volver a la izquierda, la solución a la derecha.
   La fila va centrada en la pantalla. Cada botón mide hasta 240px, lo que pide la etiqueta más larga; si no cabe, encoge y parte su etiqueta.
   En una pantalla estrecha, la fila se parte en dos. El botón de la solución de una pregunta de la página de estudio, .chk, es el mismo botón. */
nav{display:flex;justify-content:center;gap:8px}
nav button,.chk{flex:0 1 240px;min-width:0;padding:10px;border:0;border-radius:6px;font-weight:600;background:color-mix(in srgb,var(--c,#888) 28%,transparent)}
nav button:disabled{opacity:.4;cursor:default}
/* Todo lo que se pulsa se resalta un poco al pasar el ratón: los botones de color ganan color, y un enlace del texto lleva un fondo suave. */
nav button:not(:disabled):hover,.chk:hover{background:color-mix(in srgb,var(--c,#888) 45%,transparent)}
@media (max-width:700px){nav{flex-wrap:wrap}nav button{flex:1 1 30%}}
#p,#x{--c:#1e6fd9}#s,.chk{--c:#e08a00}#r{--c:#c62828}#t{--c:#7b3fc4}
button:focus-visible{outline:2px solid currentColor}
.ic{display:inline-block;font-weight:400;font-size:1.15em;line-height:1}
.katex{color:var(--math)}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* En una opción, la columna de ecuaciones arranca a la izquierda, junto a su letra.
   El texto ocupa todo el ancho: encogido a su contenido, el bloque desborda 2px y saca una barra de scroll. */
.opt>span{flex:1;min-width:0}.opt .katex-display{margin:.2em 0}.opt .katex-display>.katex{text-align:left}
#q img,#e img,.q img,.e img,.h img{display:block;max-width:100%;height:auto;margin:8px auto;border:1px solid #8888;border-radius:4px}
figcaption{text-align:center;font-size:.85em;color:var(--mute)}
/* Código de colores de la solución: respuesta en verde, títulos de paso en azul, comentario de cada opción con la banda de su veredicto, extractos de la lecture en ámbar.
   En la página de estudio, el ámbar marca también la cita literal del curso. */
#e blockquote,.e blockquote,.h blockquote{margin:8px 0;padding:4px 12px;border-radius:4px;background:color-mix(in srgb,var(--qt) 12%,transparent)}
#e .ansl,.e .ansl{color:var(--ok)}
#e p>b:first-child,.e p>b:first-child{color:var(--ac)}
#e .cm,.e .cm{padding:4px 10px;margin:10px 0;border-radius:4px;background:color-mix(in srgb,var(--c) 10%,transparent)}
#e .cok,.e .cok{--c:var(--ok)}#e .cko,.e .cko{--c:var(--ko)}
#e .ansl>b:first-child,#e .cok>b:first-child,.e .ansl>b:first-child,.e .cok>b:first-child{color:var(--ok)}#e .cko>b:first-child,.e .cko>b:first-child{color:var(--ko)}
/* Todo va con las esquinas redondeadas, también una tabla: su borde exterior es el de la tabla, y cada celda pinta solo su línea izquierda y la de arriba. */
table{border-collapse:separate;border-spacing:0;border:1px solid #888;border-radius:4px;margin:6px 0}td,th{border:0;border-left:1px solid #888;border-top:1px solid #888;padding:2px 8px;text-align:center}th::first-letter{text-transform:uppercase}
tr>:first-child{border-left:0}table>:first-child>tr:first-child>*{border-top:0}
pre,code{border-radius:4px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid #8886}
footer>div{margin:0 auto;padding:10px 16px;box-sizing:border-box}
#th,#hq{position:fixed;right:12px;bottom:12px;z-index:2;width:38px;height:38px;border:0;border-radius:50%;background:var(--box);font-size:18px}
/* En la página de estudio con preguntas, el botón P, a la izquierda del de tema, oculta las preguntas y sus filas del índice, para leer solo la teoría. */
/* Con las preguntas ocultas, un tachón rojo en diagonal cruza el botón (decisión del usuario). */
#hq{right:58px;font-size:15px;font-weight:700}#hq[aria-pressed=true]{color:var(--mute)}
#hq[aria-pressed=true]::after{content:"";position:absolute;left:7px;right:7px;top:calc(50% - 1.5px);height:3px;border-radius:2px;background:var(--ko);transform:rotate(-45deg)}
body.sinp .p,body.sinp #m button:not(.tog,.sr){display:none}
/* El botón de tema no tapa la botonera: el mismo relleno a los dos lados la deja centrada. */
@media (max-width:1620px){footer>div{padding:10px 62px}}
/* La pregunta va siempre centrada y no se mueve. La solución abierta es un rectángulo fijo en el hueco entre la pregunta y el borde derecho,
   a 24px de la pregunta, de los bordes y de la línea de la botonera, con su propio scroll. La columna mide max(760px, 50vw), así que 50vw + max(380px, 25vw) es el borde derecho de la pregunta, y 8px más su relleno de 16px dan los 24px.
   El panel mide 25vw - 32px, y su texto 25vw - 75px, con el relleno y la barra de scroll. Desde 3340px cabe en él una fórmula de 760px,
   la que cabe en la columna de lectura (decisión del usuario): por debajo, el panel cortaría las fórmulas, y la solución sale debajo de las opciones. */
@media (min-width:3340px){
  body.split #e{position:fixed;z-index:3;top:calc(var(--uh, 0px) + 24px);bottom:calc(var(--fh, 140px) + 24px);left:calc(50vw + max(380px, 25vw) + 8px);right:24px;margin:0;overflow-y:auto;box-sizing:border-box;border-radius:6px;box-shadow:0 8px 28px #0005}
}

/* La página de estudio y la parrilla del curso: la lectura ocupa la mitad de la pantalla, centrada, y nunca menos que el test. Sin botonera, el mapa se centra en toda la altura. */
body.estudio,body.parrilla{display:block;min-height:0;max-width:max(760px,50vw);padding-bottom:64px}
/* La barra de la unidad: la parrilla y las pestañas de las vistas, centradas arriba y fijas al hacer scroll, sobre el mapa de la barra estrecha. barra() fija --uh, su alto.
   En el test va encima de la página, que se centra en vertical. */
#u{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;padding:8px 0;position:sticky;top:0;z-index:2;background:var(--bg)}
.test #u{position:fixed;left:0;right:0}body.test:has(#u:not([hidden])){padding-top:60px}
#u a,.tile a{padding:4px 12px;border-radius:4px;color:inherit;text-decoration:none;font-size:.85em;background:var(--box)}
#u a[aria-current]{background:var(--ac);color:#fff}#u a[aria-current]:hover{background:color-mix(in srgb,var(--ac) 85%,var(--fg))}
/* Una casilla por unidad. Todas miden lo mismo, la fila más alta fija el alto de todas, y van sin color: grises sobre negro o sobre blanco, según el tema. Solo el título de la página lleva color. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-rows:1fr;gap:16px;margin:28px 0}
/* Con varios grupos, cada parrilla lleva su título, sin color: en la parrilla, solo el título de la página lleva color. */
.parrilla h2{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;font-size:1.6em;font-weight:700;margin:44px 0 0}.parrilla h2+.grid{margin-top:16px}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:6px;background:var(--box);cursor:pointer}
.tile:hover{background:var(--hov)}
/* Sin borde, el enlace de una vista se separa de su casilla con un velo del color del texto, que se nota sobre el gris y sobre el gris oscurecido. */
.tile a{background:color-mix(in srgb,var(--fg) 8%,transparent)}.tile a:hover{background:color-mix(in srgb,var(--fg) 16%,transparent)}
.tile>b{color:var(--mute);font-size:.8em;text-transform:uppercase;letter-spacing:.04em}
.tile>span{flex:1;font-weight:600;line-height:1.3}
.tile>p{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.h a[data-t]{cursor:pointer}
.h a:hover{background:color-mix(in srgb,var(--ac) 16%,transparent);border-radius:3px}
.estudio #m .grp:hover{background:var(--hov);border-radius:4px}
/* Los títulos van en color, para distinguirlos del texto: la página en el azul del cluster, y cada bloque, o cada cluster del test, en el suyo, --k.
   Es uno de cinco colores, que se repiten: lo llevan el título del bloque o el nombre del cluster, el título y el fondo de sus apartados, el marco de sus preguntas y su cabecera en el índice.
   Ninguno es el verde, el rojo, el amarillo, el morado ni el ámbar, que ya dicen acierto, fallo, incompleta, lo mío y cita. */
/* --sf es cuánto color del bloque lleva el fondo de un apartado: sobre blanco hace falta más que sobre negro para que se note. */
:root{--k0:#1e6fd9;--k1:#0a8a80;--k2:#5f6b7a;--k3:#b8327a;--k4:#5b5bd6;--sf:16%}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--k0:#5b9dff;--k1:#2cc0b2;--k2:#a3aebb;--k3:#e86aa8;--k4:#9a9af2;--sf:9%}}
:root[data-theme=dark]{--k0:#5b9dff;--k1:#2cc0b2;--k2:#a3aebb;--k3:#e86aa8;--k4:#9a9af2;--sf:9%}
.estudio h1,.parrilla h1{color:var(--ac)}
.estudio section h3{color:var(--k)}
/* La tarjeta de una pregunta, en el test (#k) y en la página de estudio, lleva el fondo de la página y un borde fino del color de su sección. */
.p{background:none;border:1px solid color-mix(in srgb,var(--k) 60%,transparent)}
/* Los títulos llevan una fuente distinta de la del texto (serif del sistema, sin descargar nada) y son más grandes. */
.estudio h1,.parrilla h1,.estudio h2,.estudio h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;overflow-wrap:anywhere}
.estudio h1,.parrilla h1{font-size:2.5em;line-height:1.2;margin:28px 0 4px}
.estudio .sub,.parrilla .sub{color:var(--mute);margin:0 0 8px}
/* El título de un bloque es grande y deja un hueco claro con lo anterior. */
.estudio h2{font-size:2.1em;line-height:1.2;margin:140px 0 16px}
.estudio h3{font-size:1.5em;line-height:1.25;margin:28px 0 6px}
/* Cada apartado va en un recuadro con las esquinas redondeadas, a todo el ancho de la columna, con un fondo del color de su bloque (decisión del usuario). Lo separa de los demás un hueco grande. */
.estudio section{border-radius:6px;padding:2px 20px 12px;margin:64px 0;background:color-mix(in srgb,var(--k) var(--sf),transparent)}
/* El primer apartado de un bloque queda cerca del título del bloque: el hueco grande es solo entre apartados. */
.estudio h2+section{margin-top:0}
.estudio section>.hd{margin:14px 0 6px}.estudio .hd>h3{margin:0;padding-right:98px}
/* El ✎ y el «?» de un apartado bajan con el scroll mientras el apartado está en pantalla (decisión del usuario), y se paran en el borde inferior de su recuadro.
   .her es sticky y alto como sus botones, 14px de margen y 34px de botón: un sticky se para cuando su caja con márgenes toca el final del contenido del apartado.
   Su margin-bottom de -12px, el padding inferior del apartado, lleva ese tope hasta el borde del recuadro.
   El margin-top de -34px del título le devuelve el sitio que .her ocupa: se funde con el -12px y deja el título a 14px del borde, como si .her no estuviera.
   El título les deja el hueco a la derecha. Sobre el texto llevan un fondo opaco, el mismo velo sobre el fondo del apartado.
   Por debajo de 1140px el índice es una barra fija arriba, de unos 30px de alto, y los botones quedan 10px por debajo de ella. */
.estudio section>.her{position:sticky;top:calc(var(--uh,0px) + 12px);z-index:1;height:48px;margin-bottom:-12px;display:flex;justify-content:flex-end;gap:6px}
.estudio section>.her+.hd{margin-top:-34px}
.her>.ask{margin-top:14px;height:34px}.her>.ask:not(:hover,:active,:focus-visible){background:color-mix(in srgb,var(--fg) 14%,color-mix(in srgb,var(--k) var(--sf),var(--bg)))}
@media (max-width:1139px){.estudio section>.her{top:calc(var(--uh,0px) + 26px)}}
.estudio [id^=b]{scroll-margin-top:calc(var(--uh,0px) + 56px)}
.h td,.h th{text-align:left}
/* Una tabla más ancha que la columna se desplaza dentro de su caja, y no ensancha la página a 375px.
   position:relative la hace contenedora del MathML oculto de KaTeX, que va en absoluto y si no escapa del recorte. */
#q table,#e table,.q table,.e table,.h table{display:block;position:relative;width:fit-content;max-width:100%;overflow-x:auto}
/* Una foto o un objeto va al 40% de la columna, y un esquema que se lee al 70%. Sin clase, la imagen ocupa la columna. */
.h img.cosa{max-width:40%}.h img.esq{max-width:70%}
/* Un esquema SVG con width fijo encoge en una pantalla estrecha: su viewBox conserva la proporción. */
/* Solo los esquemas: KaTeX dibuja la raíz y las flechas con SVG de alto fijo, y height:auto los deja a 0 de alto.
   Un esquema va centrado en la columna, como una imagen, en una sección, en un enunciado y en una solución. */
#q svg:not(.katex svg),#e svg:not(.katex svg),.q svg:not(.katex svg),.e svg:not(.katex svg),.h svg:not(.katex svg){display:block;margin-left:auto;margin-right:auto;max-width:100%;height:auto}
/* Lo que no es del curso va en un recuadro sin borde, con su etiqueta escrita en color y un fondo tenue del mismo color: morado lo mío, azul el rumbo que abre cada apartado, gris la duda, rojo el error de la diapositiva. */
.b{padding:4px 12px;margin:12px 0;border-radius:4px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.b>b:first-child,.b>p:first-child>b:first-child,.rumbo p>b:first-child{color:var(--c)}
.mio{--c:var(--me)}.rumbo{--c:var(--ac)}.err{--c:var(--ko)}.duda{--c:var(--mute)}
span.mio,td.mio{background:color-mix(in srgb,var(--me) 14%,transparent);border-radius:3px}
/* Una cadena A → B → C en cajas con borde fino, unidas por una línea con su punta, como un esquema SVG. Se parte sola en una pantalla estrecha.
   La sangría francesa deja dentro de la caja la flecha que abre cada línea partida: la cadena reserva su hueco a la izquierda, y el primer paso lo recupera. */
.flow{--ln:color-mix(in srgb,var(--fg) 65%,transparent);display:flex;flex-wrap:wrap;align-items:center;gap:10px 30px;margin:16px 0;padding-left:30px}
.flow>:first-child{margin-left:-30px}
.flow>*{position:relative;border-radius:6px;padding:5px 14px;border:1.5px solid var(--ln)}
.flow>*+*::before{content:"";position:absolute;left:-31.5px;top:calc(50% - .75px);width:24px;border-top:1.5px solid var(--ln)}
.flow>*+*::after{content:"";position:absolute;left:-8px;top:calc(50% - 4px);border:4px solid transparent;border-right:0;border-left:6.5px solid var(--ln)}
/* El hilo de la clase: una línea de tiempo vertical, con un punto numerado por parte. Debajo del nombre de la parte va su pregunta, y en gris lo que deja, con el relevo en blanco. */
ol.hilo{list-style:none;counter-reset:hilo;margin:16px 0 16px 13px;padding:0 0 0 28px;border-left:2px solid color-mix(in srgb,var(--k,var(--ac)) 45%,transparent)}
ol.hilo>li{counter-increment:hilo;position:relative;padding:0 0 22px;margin:0}
ol.hilo>li:last-child{padding-bottom:0}
ol.hilo>li::before{content:counter(hilo);position:absolute;left:-43px;top:0;width:26px;height:26px;border-radius:50%;background:var(--k,var(--ac));color:#fff;font-size:.8em;font-weight:700;display:grid;place-items:center}
ol.hilo>li>span{display:block;color:var(--k,var(--ac));font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.85em}
ol.hilo>li>b{display:block}
ol.hilo>li>p{margin:4px 0 0;color:var(--mute)}
ol.hilo>li>p b{color:var(--fg)}
/* Una gráfica de grafica(): el SVG y un deslizador por parámetro. */
.viz{background:var(--box);border-radius:6px;padding:8px 12px;margin:12px auto;max-width:728px;box-sizing:border-box}
.viz svg{display:block;width:100%;height:auto}
.viz label{display:flex;gap:10px;align-items:center;font-size:.9em}.viz input{flex:1;accent-color:var(--ac)}
/* Una pregunta es una tarjeta del ancho del test, con su «?» y su contador arriba. En la página de estudio va centrada, con el botón de la solución al pie; en el test, #k, va bajo el cluster. */
.p{position:relative;box-sizing:border-box;margin:20px auto;padding:10px 16px 14px;border-radius:6px}
#k.p{margin:0;width:100%}
/* Desde 3340px, la solución abierta es el panel del test, a 24px de la tarjeta y del borde derecho, a la altura de su pregunta: con menos, no cabe una fórmula de 760px. */
@media (min-width:3340px){
  .estudio .p .e{position:absolute;z-index:3;top:0;left:calc(100% + 24px);width:calc(var(--cw, 100vw) / 2 - max(380px, 25vw) - 32px);max-height:calc(100vh - 48px);margin:0;overflow-y:auto;box-sizing:border-box;border-radius:6px;box-shadow:0 8px 28px #0005}
}
/* El mapa es el índice de la página: una cabecera por bloque, una fila T1, T2… por apartado y una P1, P2… por pregunta. Ocupa el hueco a la izquierda de la lectura.
   --cw es el ancho visible sin la barra de scroll de la página, que el test no tiene; lo fija estudio(). */
@media (min-width:1140px){.estudio #m{width:calc((var(--cw, 100vw) - max(760px, 50vw)) / 2 - 48px)}.estudio #m .grp{cursor:pointer}}
/* En la barra estrecha, cada bloque lleva su nombre corto, para navegar también la página sin preguntas; los apartados se quedan en la lista ancha. */
@media (max-width:1139px){
  .estudio #m .grp,.estudio #m .tog+.grp{display:block;font-size:.7em;font-weight:600;text-transform:uppercase;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:0 4px}
  .estudio #m .grp::before{content:none}
  .estudio #m .sr{display:none}
}
</style>
</head>

<div id="u" hidden></div>
<div id="m"></div>
<p id="c"></p>
<div id="k" class="p"><p class="n hd"><button id="w" class="ask">?</button><span id="n"></span></p><div id="q"></div><div id="o"></div></div>
<div id="e" hidden></div>
<footer><div>
<nav><button id="r"></button><button id="t" hidden></button><button id="p"></button><button id="x"></button><button id="s"></button></nav>
</div></footer>

<button id="th" aria-label="Light / dark">◐</button>

<!-- Los bloques de cada vista, como texto: solo se evalúan los de la vista que se abre. -->
<script type="text/plain" id="d0-test">
{i:"Sequential decision making", c: "Bandits and the Markov property",q:String.raw`<p>In sequential decision making, as modelled with a Markov decision process (MDP), what does the decision maker look for?</p>`,
o:[String.raw`A policy: the action to take, or a probability over actions, in each state.`,
String.raw`An optimal plan: the list of actions to take at each period, fixed once before the process starts.`,
String.raw`The single action with the highest expected reward, repeated at every period whatever happens.`,
String.raw`The sequence of states with the highest total reward, which the system then follows step by step.`,NONE],ok:[0],
e:String.raw`<blockquote>The objective in sequential decision making is to find a decision "policy" that optimizes the decision in terms of minimizing losses or maximizing gains, including observation costs.</blockquote>
<blockquote>Interest in finding a decision rule that depends on the observed system state, and not just a "one-shot" set of decisions (actions).</blockquote>
<p>A policy $\pi$ maps states to actions. In general $\pi(a\mid s)$ is the probability of taking $a$ in $s$; a deterministic policy gives probability 1 to one action. In class, the lecturer contrasted it with classical optimization, stochastic optimization included, whose result is an optimal solution: a plan that says what to do on each day. Here the result is a function.</p>`,
d:["",String.raw`Is the result of classical optimization: a plan. It cannot react to the state that the system actually reaches.`,
String.raw`Is a one-shot decision. The best action depends on the state.`,
String.raw`Treats the trajectory as if it could be chosen. The transitions are random, so the system cannot be made to follow a fixed sequence of states.`,""]},

{i:"Sequential decision making", c: "Bandits and the Markov property",q:String.raw`<p>Which statements about sequential decision problems and the MDP framework are correct?</p>`,m:true,
o:[String.raw`Each observation can have an implicit or explicit cost, and the policy is optimized including these costs.`,
String.raw`Inventory management and maintenance planning are examples of sequential decision problems.`,
String.raw`The time steps of an MDP must be fixed intervals of time, such as days or hours.`,
String.raw`The set of available actions can depend on the state, which is written $A(s)$.`,
String.raw`The states of an MDP must be physical quantities that can be measured directly.`],ok:[0,1,3],
e:String.raw`<blockquote>In most sequential decision problems, there is an implicit or explicit cost associated with each observation.</blockquote>
<blockquote>Time steps do not need to refer to fixed intervals of time, they can refer to arbitrary successive stages of decision making and acting. Actions can be any decisions we want to learn how to make, and states can be anything we can know about the environment of the problem.</blockquote>
<p>In the machine maintenance example, the actions depend on the state:</p>$$\begin{aligned}A(\text{good})&=\{\text{full},\text{reduced}\}\\ A(\text{worn})&=\{\text{full},\text{reduced},\text{maintain}\}\end{aligned}$$`,
d:[String.raw`Correct. The objective includes the observation costs.`,
String.raw`Correct. The lecture also cites mobility on demand.`,
String.raw`Wrong. A step can be any successive stage of decision, for example an event.`,
String.raw`Correct. The sums of the dynamics run over $a\in A(s)$.`,
String.raw`Wrong. A state can be anything we can know about the environment of the problem.`]},

{i:"k-armed bandit", c: "Bandits and the Markov property",q:String.raw`<p>A buyer orders a critical component, each time from one of three suppliers (a k-armed bandit). The reward of an order is $R=1$ if the lot is on time and conforming, and $R=0$ otherwise. Before order $t=17$, the observed rewards are:</p>
$$\begin{aligned}\text{Supplier 1}:&\quad 1,0,1,1,0,1,1,0\\ \text{Supplier 2}:&\quad 1,1,0\\ \text{Supplier 3}:&\quad 1,0,0,1,1\end{aligned}$$
<p>The value of each supplier is estimated by the sample average $Q_{17}({a})$. Which supplier does a buyer who always picks the highest estimate (greedy) choose at $t=17$?</p>`,
o:[String.raw`$Q_{17}=(\tfrac58,\ \tfrac23,\ \tfrac35)$, so supplier 2.`,
String.raw`$Q_{17}=(\tfrac{5}{16},\ \tfrac{2}{16},\ \tfrac{3}{16})$, so supplier 1.`,
String.raw`$Q_{17}=(5,\ 2,\ 3)$, so supplier 1.`,
String.raw`$Q_{17}=(\tfrac38,\ \tfrac13,\ \tfrac25)$, so supplier 3.`,NONE],ok:[0],
e:String.raw`<blockquote>$Q_t({a})$ = sum of rewards when $a$ was chosen before $t$, divided by the number of times $a$ was chosen before $t$.</blockquote>
<p>Each supplier is divided by its own number of orders:</p>
$$\begin{aligned}Q_{17}(1)&=\frac{1+0+1+1+0+1+1+0}{8}\\ &=\tfrac{5}{8}\\ &=0.625\\ Q_{17}(2)&=\frac{1+1+0}{3}\\ &=\tfrac{2}{3}\\ &\approx 0.667\\ Q_{17}(3)&=\frac{1+0+0+1+1}{5}\\ &=\tfrac{3}{5}\\ &=0.6\end{aligned}$$
<p>Supplier 2 has the highest estimate, although it rests on only 3 orders.</p>`,
d:["",String.raw`Divides every sum by the 16 orders placed in total, instead of by the orders of each supplier.`,
String.raw`Uses the number of good lots, not the average: it favours the supplier that was tried most often.`,
String.raw`Computes the share of bad lots ($R=0$), and then picks the highest one.`,""]},

{i:"k-armed bandit", c: "Bandits and the Markov property",q:String.raw`<p>In a supplier-selection bandit, after 9 orders the buyer's sample averages are 4/6 for supplier 1, 1/2 for supplier 2 and 0/1 for supplier 3, whose only lot was late. Which statement is correct?</p>`,
o:[String.raw`$Q_{10}(3)=0$ rests on one order: the true $q_*(3)$ is unknown and may be higher.`,
String.raw`$q_*(3)=0$: supplier 3 is always late, so the buyer should never choose it again in the future.`,
String.raw`$q_*(3)$ is by definition the sample average of the rewards of supplier 3, so it equals $Q_{10}(3)$.`,
String.raw`The estimate of supplier 1 is exact, because it rests on more orders than those of the others.`,NONE],ok:[0],

{i:"Markov property", c: "Bandits and the Markov property",q:String.raw`<p>Which statement expresses the Markov property of an MDP?</p>`,
o:[String.raw`Given the current state and action, the probability of the next state and reward does not depend on the earlier states and actions.`,
String.raw`Given the current period $t$, the next state does not depend on what happened in the earlier periods.`,
String.raw`Given the current state and action, the next state is known with certainty.`,
String.raw`The reward of each step depends only on the action, never on the state.`,NONE],ok:[0],
e:String.raw`<blockquote>A Markov process defines a process in which the state of the future is independent of the past, given the present. In MDPs, this means knowledge about the current state only (without further history) is sufficient to determine the action/decision outcome on the next state.</blockquote>
$$p(s',r\mid s,a)=\Pr\{S_t=s',R_t=r\mid S_{t-1}=s,A_{t-1}=a\}$$
<p>$S_{t-2},A_{t-2},\dots$ do not appear: the current state and action are enough.</p>`,
d:["",String.raw`Confuses the period with the state. In class, the lecturer corrected exactly this answer: what matters is the current state, not the current period.`,
String.raw`Confuses "Markov" with "deterministic". The transition is a probability distribution.`,
String.raw`Is false: the reward function is in general $R(s,a,s')$.`,""]},

{i:"Markov property", c: "Bandits and the Markov property",q:String.raw`<p>The probability that a person develops an illness depends on the illnesses of their family. A model takes as state only the person's current health. What did the lecturer conclude about such a case?</p>`,
o:[String.raw`Not Markov with this state; adding the family history to the state can make it Markov.`,
String.raw`The process can never be Markov, because the past always matters for an illness.`,
String.raw`The process is Markov, because only the current period matters, never the earlier ones.`,
String.raw`The process is Markov only if its transition probabilities do not change over time.`,NONE],ok:[0],
e:String.raw`<p>The current health alone is not enough to predict the next step, so with this state the process is not Markov. If the family history is included in the state, the current state again holds all the information that is needed.</p>
<p>The lecturer's conclusion: the Markov property depends on how you define the state. The lecturer added that almost all engineering systems are Markov: to control a drone you need its current position, speed and acceleration, not those of 17 days ago.</p>`,
d:["",String.raw`Ignores that the state can be redefined to include the relevant history.`,
String.raw`Confuses the period with the state, and the current health does not hold the family history.`,
String.raw`Confuses the Markov property with time-invariant probabilities, which is another condition.`,""]},

{i:"Components of an MDP", c: "Markov decision processes and returns",q:String.raw`<p>According to the lecture, which elements define a Markov decision process?</p>`,m:true,
o:[String.raw`A set of system states $S$.`,
String.raw`A set of decisions, or actions, $A$.`,
String.raw`A state transition function, $p(s',r\mid s,a)$.`,
String.raw`A reward function $R(s,a,s')$.`,
String.raw`A final time step $T$ at which the process stops.`],ok:[0,1,2,3],
e:String.raw`<blockquote>A MDP is defined by: a set of system states $s\in S$; a set of decisions (or actions) $a\in A$; a state transition function describing the dynamics of the environment (the conditional probability $P(s',r\mid s,a)$); a reward function $R(s,a,s')$, sometimes just $R({a})$ or $R(s')$.</blockquote>
<p>An MDP does not need a final time step. The undiscounted return "only works if there is a final time step $T$, which is not always the case for many practical applications", and that is why the lecture introduces discounting.</p>`,
d:[String.raw`Correct.`,String.raw`Correct.`,String.raw`Correct. It models the physics of the system as probabilities.`,String.raw`Correct.`,
String.raw`Wrong. In class: the decision process has no beginning and no end.`]},

{i:"Components of an MDP", c: "Markov decision processes and returns",q:String.raw`<p>In class, the lecturer stressed one difference between dynamic programming and reinforcement learning, two ways to solve an MDP. Which one?</p>`,
o:[String.raw`Dynamic programming needs a known transition function $p(s',r\mid s,a)$; reinforcement learning does not.`,
String.raw`Dynamic programming maximizes the expected return, while reinforcement learning maximizes the mean reward per step.`,
String.raw`Dynamic programming needs $\gamma&lt;1$, while reinforcement learning works only with $\gamma=1$.`,
String.raw`Dynamic programming finds only deterministic policies, and reinforcement learning only stochastic ones.`,NONE],ok:[0],
e:String.raw`<p>The lecturer called it "the only difference", but one that sends the two domains in completely different directions: with the transition function, you are in dynamic programming; without it, you are in reinforcement learning. A student's idea of sampling states and trying actions was, in the lecturer's words, how reinforcement learning works.</p>
<p>In the Bellman equation, the transition function is the term $p(s',r\mid s,a)$.</p>`,
d:["",String.raw`Is invented. The mean reward was cited as an alternative to the reward hypothesis, not as a feature of reinforcement learning.`,
String.raw`Is invented. $\gamma$ is a parameter of the problem, not of the solution method.`,
String.raw`Is invented. The type of policy does not separate the two.`,""]},

{i:"Dynamics of an MDP", c: "Markov decision processes and returns",q:String.raw`<p>For one state $s$ and one action $a$ of an MDP, the dynamics are:</p>
$$\begin{aligned}p(x,4\mid s,a)&=0.3\\ p(x,0\mid s,a)&=0.1\\ p(y,4\mid s,a)&=0.2\\ p(y,-1\mid s,a)&=0.4\end{aligned}$$
<p>What are the expected reward $r(s,a)$, and the expected reward $r(s,a,y)$ of the transitions that end in $y$?</p>`,
o:[String.raw`$$\begin{aligned}r(s,a)&=1.6\\ r(s,a,y)&=\tfrac23\end{aligned}$$`,
String.raw`$$\begin{aligned}r(s,a)&=1.6\\ r(s,a,y)&=0.4\end{aligned}$$`,
String.raw`$$\begin{aligned}r(s,a)&=1.75\\ r(s,a,y)&=1.5\end{aligned}$$`,
String.raw`$$\begin{aligned}r(s,a)&=1.6\\ r(s,a,y)&=3\end{aligned}$$`,NONE],ok:[0],
e:String.raw`<blockquote>$$\begin{aligned}r(s,a)&=\sum_{r}r\sum_{s'}p(s',r\mid s,a)\\ r(s,a,s')&=\sum_r r\,\dfrac{p(s',r\mid s,a)}{p(s'\mid s,a)}\end{aligned}$$ with $p(s'\mid s,a)=\sum_r p(s',r\mid s,a)$.</blockquote>
<p><b>1. Check.</b> $0.3+0.1+0.2+0.4=1$.</p>
<p><b>2. Expected reward.</b></p>
$$\begin{aligned}r(s,a)&=4\cdot0.3+0\cdot0.1+4\cdot0.2+(-1)\cdot0.4\\ &=1.2+0+0.8+(-0.4)\\ &=1.6\end{aligned}$$
<p><b>3. Reward of the transitions to $y$.</b></p>
$$\begin{aligned}p(y\mid s,a)&=p(y,4\mid s,a)+p(y,-1\mid s,a)\\ &=0.2+0.4\\ &=0.6\\ r(s,a,y)&=4\cdot\frac{0.2}{0.6}+(-1)\cdot\frac{0.4}{0.6}\\ &=\tfrac43+\big(-\tfrac23\big)\\ &=\tfrac23\end{aligned}$$`,
d:["",String.raw`Forgets to divide by $p(y\mid s,a)=0.6$. The result is not an expected reward but a part of $r(s,a)$.`,
String.raw`Averages the rewards with equal weights and ignores the probabilities.`,
String.raw`Is the reward of the transitions to $x$ instead of $y$:$$\begin{aligned}p(x\mid s,a)&=0.3+0.1\\ &=0.4\\ r(s,a,x)&=4\cdot\frac{0.3}{0.4}+0\cdot\frac{0.1}{0.4}\\ &=3+0\\ &=3\end{aligned}$$`,""]},

{i:"Machine maintenance as an MDP", c: "Markov decision processes and returns",q:String.raw`<p>A machine is good or worn. In state good, the manager can run it at full or reduced speed; in state worn, at full speed, at reduced speed, or maintain it.</p>
$$\begin{aligned}\text{good, full}:&\quad \text{stays good w.p. }\alpha=0.9,\ \text{else worn; reward }10\\ \text{worn, full}:&\quad \text{stays worn w.p. }\beta=0.6,\ \text{reward }10\\ &\quad \text{else breaks down, repaired, back to good; reward }-20\\ \text{reduced}:&\quad \text{state unchanged; reward }5\\ \text{worn, maintain}:&\quad \text{back to good; reward }0\end{aligned}$$
<p>Which statements are correct?</p>`,m:true,
o:[String.raw`The expected one-step reward of full speed in worn is $r(\text{worn},\text{full})=-2$.`,
String.raw`$p(\text{good}\mid\text{worn},\text{full})=0.4$.`,
String.raw`In state good, reduced speed gives a higher expected one-step reward than full speed.`,
String.raw`Maintenance is also an available action in state good.`,
String.raw`From worn, maintenance leads to good with probability 1 and reward 0.`],ok:[0,1,4],

{i:"Return and discounting", c: "Markov decision processes and returns",q:String.raw`<p>An episode ends at $T=4$, with these rewards and a discount factor $\gamma=0.5$:</p>
$$\begin{aligned}R_1&=2\\ R_2&=-1\\ R_3&=3\\ R_4&=4\end{aligned}$$
<p>What are the returns $G_1$ and $G_0$?</p>`,
o:[String.raw`$$\begin{aligned}G_1&=1.5\\ G_0&=2.75\end{aligned}$$`,String.raw`$$\begin{aligned}G_1&=6\\ G_0&=8\end{aligned}$$`,String.raw`$$\begin{aligned}G_1&=0.75\\ G_0&=1.375\end{aligned}$$`,String.raw`$$\begin{aligned}G_1&=0.5\\ G_0&=1.5\end{aligned}$$`,NONE],ok:[0],
e:String.raw`<blockquote>$G_t\doteq R_{t+1}+\gamma R_{t+2}+\gamma^2R_{t+3}+\dots$, which can be written recursively as $G_t=R_{t+1}+\gamma G_{t+1}$.</blockquote>
<p>Go backwards from the end, where $G_4=0$:</p>
$$\begin{aligned}G_3&=R_4+\gamma G_4\\ &=4+0.5\cdot0\\ &=4+0\\ &=4\\ G_2&=R_3+\gamma G_3\\ &=3+0.5\cdot4\\ &=3+2\\ &=5\\ G_1&=R_2+\gamma G_2\\ &=-1+0.5\cdot5\\ &=-1+2.5\\ &=1.5\\ G_0&=R_1+\gamma G_1\\ &=2+0.5\cdot1.5\\ &=2+0.75\\ &=2.75\end{aligned}$$
<p>Direct check:</p>
$$\begin{aligned}G_0&=R_1+\gamma R_2+\gamma^2R_3+\gamma^3R_4\\ &=2+0.5\cdot(-1)+0.5^2\cdot3+0.5^3\cdot4\\ &=2+(-0.5)+0.75+0.5\\ &=2.75\end{aligned}$$`,
d:["",String.raw`Forgets the discount: it is the plain sum of the rewards.`,
String.raw`Discounts the first reward too, with $\gamma^1$ instead of $\gamma^0$.`,
String.raw`Keeps only the next two rewards: $R_{t+1}+\gamma R_{t+2}$.`,""]},

{i:"Return and discounting", c: "Markov decision processes and returns",q:String.raw`<p>From time $t$, an agent receives $R_{t+1}=10$, and then a reward of 2 at every step, forever. The discount factor is $\gamma=0.8$. What is the return $G_t$?</p>`,
o:[String.raw`$G_t=18$.`,String.raw`$G_t=20$.`,String.raw`$G_t=10$.`,String.raw`$G_t=50$.`,NONE],ok:[0],
e:String.raw`<blockquote>If $R=1$ at every step and $\gamma&lt;1$:
$$\begin{aligned}G_t&=\sum_{k=0}^{\infty}\gamma^k\\ &=\dfrac{1}{1-\gamma}\end{aligned}$$
The return can be written recursively as $G_t=R_{t+1}+\gamma G_{t+1}$.</blockquote>
<p><b>1. The tail.</b> From $t+1$ on, the rewards are a constant 2:</p>
$$\begin{aligned}G_{t+1}&=\frac{2}{1-0.8}\\ &=\frac{2}{0.2}\\ &=10\end{aligned}$$
<p><b>2. The recursion.</b></p>
$$\begin{aligned}G_t&=R_{t+1}+\gamma G_{t+1}\\ &=10+0.8\cdot10\\ &=10+8\\ &=18\end{aligned}$$`,
d:["",String.raw`Forgets the factor $\gamma$ in front of $G_{t+1}$.`,
String.raw`Is only the tail $G_{t+1}$: it forgets the first reward.`,
String.raw`Treats every reward as 10, as if the first one repeated forever.`,""]},

{i:"Return and discounting", c: "Markov decision processes and returns",q:String.raw`<p>Which statements about the discount factor $\gamma$, with $0\le\gamma\le 1$, are correct?</p>`,m:true,
o:[String.raw`A smaller $\gamma$ puts the focus on the immediate rewards.`,
String.raw`With $\gamma&lt;1$ and a reward of 1 at every step, the infinite return equals $\tfrac{1}{1-\gamma}$.`,
String.raw`The weight $\gamma^k$ of a reward $k$ steps ahead decreases linearly with $k$.`,
String.raw`The discounted return is defined only when there is a final time step $T$.`,
String.raw`Setting $\gamma=1$ makes the agent ignore every reward after the first one.`],ok:[0,1],
e:String.raw`<blockquote>Using the discounting factor $\gamma$ leads to the values of rewards decaying exponentially. Smaller $\gamma$ means that the focus is on immediate rewards, while setting $\gamma=1$ means that we want to consider all future rewards equally.</blockquote>
<p>Discounting was introduced precisely for the case without a final time step, where the plain sum could be infinite. In class, the lecturer gave it a physical meaning too: we care less about what happens far in the future.</p>`,
d:[String.raw`Correct.`,String.raw`Correct. It is a geometric series.`,
String.raw`Wrong. $\gamma^k$ decays exponentially.`,
String.raw`Wrong. Discounting is what makes the infinite case finite.`,
String.raw`Wrong. That is $\gamma=0$. With $\gamma=1$ all rewards weigh the same.`]},

{i:"Value functions", c: "Value functions and Bellman equations",q:String.raw`<p>For a policy $\pi$, what is the action-value function $q_\pi(s,a)$?</p>`,
o:[String.raw`The expected return when starting from $s$, taking action $a$, and following $\pi$ afterwards.`,
String.raw`The probability $\pi(a\mid s)$ that the policy takes action $a$ in state $s$.`,
String.raw`The expected immediate reward $r(s,a)$ of taking action $a$ in state $s$.`,
String.raw`The expected return from $s$ when following $\pi$, maximized over the first action.`,NONE],ok:[0],
e:String.raw`<blockquote>$q_\pi(s,a)\doteq\mathbb{E}_\pi[G_t\mid S_t=s,A_t=a]=\mathbb{E}_\pi\left[\sum_{k=0}^{\infty}\gamma^kR_{t+k+1}\,\middle|\,S_t=s,A_t=a\right]$</blockquote>
<p>Compare with $v_\pi(s)=\mathbb{E}_\pi[G_t\mid S_t=s]$: the state value lets $\pi$ choose the first action, and $q_\pi$ fixes it to $a$. In class: Q stands for "quality", and it is the basis of Q-learning.</p>`,
d:["",String.raw`Is the policy itself, not a value.`,
String.raw`Keeps only the first reward and forgets the discounted future, $\gamma G_{t+1}$.`,
String.raw`Mixes $q_\pi$ with the optimality equation: there is no maximum in $q_\pi$, the action $a$ is given.`,""]},

{i:"Value functions", c: "Value functions and Bellman equations",q:String.raw`<p>In state $s$, a policy $\pi$ chooses among three actions. The probabilities and the action values are:</p>
$$\begin{aligned}\pi(a_1\mid s)&=0.5\\ q_\pi(s,a_1)&=6\\ \pi(a_2\mid s)&=0.3\\ q_\pi(s,a_2)&=2\\ \pi(a_3\mid s)&=0.2\\ q_\pi(s,a_3)&=-1\end{aligned}$$
<p>What is $v_\pi(s)$?</p>`,
o:[String.raw`$v_\pi(s)=6$.`,String.raw`$v_\pi(s)=\tfrac73$.`,String.raw`$v_\pi(s)=7$.`,String.raw`$v_\pi(s)=1.3$.`,NONE],ok:[4],
e:String.raw`<p>The right answer is $v_\pi(s)=3.4$.</p>
<p>In the Bellman equation for $v_\pi$, the inner sum is the value of taking $a$ in $s$ and following $\pi$ after it, that is $q_\pi(s,a)$:</p>
$$v_\pi(s)=\sum_a\pi(a\mid s)\underbrace{\sum_{s',r}p(s',r\mid s,a)\,[r+\gamma v_\pi(s')]}_{q_\pi(s,a)}$$
<p>So $v_\pi(s)$ is the average of the action values, weighted by the policy:</p>
$$\begin{aligned}v_\pi(s)&=0.5(6)+0.3(2)+0.2(-1)\\ &=3+0.6-0.2\\ &=3.4\end{aligned}$$`,
d:[String.raw`Takes the best action value. That is the greedy value, not the value of $\pi$.`,
String.raw`Averages the three values with equal weights, and ignores $\pi$.`,
String.raw`Adds the values without the weights $\pi(a\mid s)$.`,
String.raw`Pairs the probabilities with the values in the reverse order.`,""]},

{i:"Bellman equation for v_pi", c: "Value functions and Bellman equations",q:String.raw`<p>Which statements about the Bellman equation for $v_\pi$ are correct?</p>
$$v_\pi(s)=\sum_a\pi(a\mid s)\sum_{s',r}p(s',r\mid s,a)\,[r+\gamma v_\pi(s')]$$`,m:true,
o:[String.raw`It relates the value of a state to the values of its successor states.`,
String.raw`For a fixed $\pi$, solving it directly means solving $|S|$ simultaneous linear equations in $|S|$ unknowns.`,
String.raw`It contains a maximum over the actions, which makes it nonlinear.`,
String.raw`It holds only for deterministic policies, where $\pi(a\mid s)$ is 0 or 1.`,
String.raw`Any two policies have the same value function $v_\pi$.`],ok:[0,1],
e:String.raw`<blockquote>This recursive equation is called the Bellman equation for $v_\pi$, it expresses a relationship between the value of a state and the values of its successor states.</blockquote>
<blockquote>To solve this equation we need to solve $|S|$ simultaneous linear equations in $|S|$ unknowns! This can be very computationally demanding.</blockquote>
<p>For a fixed $\pi$, the $\pi(a\mid s)$, $p$, $r$ and $\gamma$ are numbers, so each equation is linear in the unknowns $v_\pi(\cdot)$.</p>`,
d:[String.raw`Correct.`,String.raw`Correct. One equation and one unknown per state.`,
String.raw`Wrong. The maximum is in the Bellman <i>optimality</i> equation.`,
String.raw`Wrong. $\pi(a\mid s)$ can be any probability distribution.`,
String.raw`Wrong. $v_\pi$ is indexed by $\pi$ because it depends on the policy followed.`]},

{i:"Bellman equation for v_pi", c: "Value functions and Bellman equations",q:String.raw`<p>A machine is good or worn, and the policy $\pi$ is "always full speed", with $\gamma=0.5$:</p>
$$\begin{aligned}\text{good}:&\quad \text{stays good w.p. }0.6,\ \text{else worn; reward }10\\ \text{worn}:&\quad \text{stays worn w.p. }0.8,\ \text{reward }10\\ &\quad \text{else breaks down, repaired, back to good; reward }-30\end{aligned}$$
<p>What are $v_\pi(\text{good})$ and $v_\pi(\text{worn})$?</p>`,
o:[String.raw`$$\begin{aligned}v_\pi(\text{good})&=16\\ v_\pi(\text{worn})&=6\end{aligned}$$`,
String.raw`$$\begin{aligned}v_\pi(\text{good})&=10\\ v_\pi(\text{worn})&=2\end{aligned}$$`,
String.raw`$$\begin{aligned}v_\pi(\text{good})&=20\\ v_\pi(\text{worn})&=4\end{aligned}$$`,
String.raw`$$\begin{aligned}v_\pi(\text{good})&=17\\ v_\pi(\text{worn})&=9.5\end{aligned}$$`,NONE],ok:[0],
e:String.raw`<p><b>1. The Bellman equations.</b> Write:</p>$$\begin{aligned}g&=v_\pi(\text{good})\\ w&=v_\pi(\text{worn})\end{aligned}$$<p>Then:</p>
$$\begin{aligned}g&=0.6\,(10+0.5g)+0.4\,(10+0.5w)\\ w&=0.8\,(10+0.5w)+0.2\,(-30+0.5g)\end{aligned}$$
<p><b>2. The linear system.</b> Expand each product:</p>
$$\begin{aligned}g&=6+0.3g+4+0.2w\\ &=10+0.3g+0.2w\\ w&=8+0.4w+(-6)+0.1g\\ &=2+0.1g+0.4w\end{aligned}$$
<p>Move the unknowns to the left:</p>
$$\begin{aligned}0.7g-0.2w&=10\\ -0.1g+0.6w&=2\end{aligned}$$
<p><b>3. Solve.</b> The second equation gives:</p>
$$\begin{aligned}0.1g&=0.6w-2\\ g&=6w-20\end{aligned}$$
<p>Substitute it in the first equation:</p>
$$\begin{aligned}0.7\,(6w-20)-0.2w&=10\\ 4.2w-14-0.2w&=10\\ 4w-14&=10\\ 4w&=24\\ w&=6\\ g&=6\cdot6-20\\ &=36-20\\ &=16\end{aligned}$$
<p><b>4. Check.</b></p>
$$\begin{aligned}v_\pi(\text{good})&=0.6\,(10+0.5\cdot16)+0.4\,(10+0.5\cdot6)\\ &=0.6\cdot18+0.4\cdot13\\ &=10.8+5.2\\ &=16\\ v_\pi(\text{worn})&=0.8\,(10+0.5\cdot6)+0.2\,(-30+0.5\cdot16)\\ &=0.8\cdot13+0.2\cdot(-22)\\ &=10.4+(-4.4)\\ &=6\end{aligned}$$`,
d:["",String.raw`Is one sweep from $v_0=0$: only the expected one-step rewards.$$\begin{aligned}v_1(\text{good})&=0.6\,(10+0.5\cdot0)+0.4\,(10+0.5\cdot0)\\ &=0.6\cdot10+0.4\cdot10\\ &=6+4\\ &=10\\ v_1(\text{worn})&=0.8\,(10+0.5\cdot0)+0.2\,(-30+0.5\cdot0)\\ &=0.8\cdot10+0.2\cdot(-30)\\ &=8+(-6)\\ &=2\end{aligned}$$`,
String.raw`Treats each state as if the machine never left it:$$\begin{aligned}v(\text{good})&=\frac{10}{1-0.5}\\ &=\frac{10}{0.5}\\ &=20\\ v(\text{worn})&=\frac{2}{1-0.5}\\ &=\frac{2}{0.5}\\ &=4\end{aligned}$$`,
String.raw`Gives the reward 10 and the cost 30 together on a breakdown, $-20$ instead of $-30$.`,""]},

{i:"Bellman optimality", c: "Value functions and Bellman equations",q:String.raw`<p>Which statements about optimal policies and the Bellman optimality equations are correct?</p>`,m:true,
o:[String.raw`There can be several optimal policies, but they all share the same optimal value function $v_*$.`,
String.raw`$v_*(s)=\max_{a}q_*(s,a)$ for every state $s$.`,
String.raw`An optimal policy maximizes the value of the start state, even if other states get a lower value than under another policy.`,
String.raw`In the optimality equation for $q_*$, the maximum over the next action $a'$ is inside the expectation over $s'$ and $r$.`,
String.raw`Like the Bellman equation for $v_\pi$, the Bellman optimality equation is a system of linear equations.`],ok:[0,1,3],
e:String.raw`<blockquote>There can be different optimal policies $\pi_*$ to a given problem. However, they would all share the same optimal state-value function $v_*$.</blockquote>
$$\begin{aligned}v_*(s)&=\max_{a}q_{\pi_*}(s,a)\\ &=\max_a\sum_{s',r}p(s',r\mid s,a)\,[r+\gamma v_*(s')]\\ q_*(s,a)&=\sum_{s',r}p(s',r\mid s,a)\,\Big[r+\gamma\max_{a'}q_*(s',a')\Big]\end{aligned}$$
<blockquote>The optimal policy is the policy that achieves the highest value for every state.</blockquote>`,
d:[String.raw`Correct.`,String.raw`Correct.`,
String.raw`Wrong. An optimal policy has the highest value in every state, not only in one.`,
String.raw`Correct. The agent picks the best next action once it knows where it landed.`,
String.raw`Wrong. The maximum makes it nonlinear.`]},

{i:"Bellman optimality", c: "Value functions and Bellman equations",q:String.raw`<p>In an MDP with $\gamma=0.5$, action $a$ in state $s$ leads to $s_1$ with probability 0.6 and reward 2, and to $s_2$ with probability 0.4 and reward $-1$. In $s_1$ and $s_2$, two actions $b$ and $c$ are available, with these optimal action values:</p>
$$\begin{aligned}q_*(s_1,b)&=5\\ q_*(s_1,c)&=8\\ q_*(s_2,b)&=3\\ q_*(s_2,c)&=-2\end{aligned}$$
<p>What is $q_*(s,a)$?</p>`,
o:[String.raw`$q_*(s,a)=3.8$.`,String.raw`$q_*(s,a)=2.85$.`,String.raw`$q_*(s,a)=6.8$.`,String.raw`$q_*(s,a)=4.8$.`,NONE],ok:[0],
e:String.raw`<blockquote>$q_*(s,a)=\sum_{s',r}p(s',r\mid s,a)\,\Big[r+\gamma\max_{a'}q_*(s',a')\Big]$</blockquote>
<p><b>1. Best next value in each successor.</b></p>
$$\begin{aligned}\max_{a'}q_*(s_1,a')&=8\\ \max_{a'}q_*(s_2,a')&=3\end{aligned}$$
<p><b>2. Expectation.</b></p>
$$\begin{aligned}q_*(s,a)&=0.6\,(2+0.5\cdot 8)+0.4\,(-1+0.5\cdot 3)\\ &=0.6\cdot6+0.4\cdot0.5\\ &=3.6+0.2\\ &=3.8\end{aligned}$$`,
d:["",String.raw`Averages the two next actions instead of taking the best:$$\begin{aligned}q(s,a)&=0.6\,\big(2+0.5\,(0.5\cdot5+0.5\cdot8)\big)\\ &\quad+0.4\,\big(-1+0.5\,(0.5\cdot3+0.5\cdot(-2))\big)\\ &=0.6\,(2+0.5\cdot6.5)+0.4\,(-1+0.5\cdot0.5)\\ &=0.6\cdot5.25+0.4\cdot(-0.75)\\ &=3.15+(-0.3)\\ &=2.85\end{aligned}$$`,
String.raw`Forgets the discount $\gamma$.`,
String.raw`Uses the largest value, 8, in both successors: the maximum is taken separately in each $s'$.`,""]},

{i:"Bellman optimality", c: "Value functions and Bellman equations",q:String.raw`<p>An MDP has two states $A$ and $B$ and a terminal state of value 0, with $\gamma=0.5$:</p>
$$\begin{aligned}A,\ \text{safe}:&\quad \text{reward }1,\ \text{back to }A\\ A,\ \text{risky}:&\quad \text{reward }0,\ \text{to }B\text{ w.p. }0.75,\ \text{to terminal w.p. }0.25\\ B,\ \text{cash}:&\quad \text{reward }6,\ \text{to terminal}\\ B,\ \text{wait}:&\quad \text{reward }2,\ \text{to }B\text{ or to }A\text{, w.p. }0.5\text{ each}\end{aligned}$$
<p>Which vector $\big(v(A),v(B)\big)$ satisfies the Bellman optimality equation?</p>`,
o:[String.raw`$\big(v(A),v(B)\big)=(2.25,\ 6)$.`,String.raw`$\big(v(A),v(B)\big)=(2,\ 6)$.`,String.raw`$\big(v(A),v(B)\big)=(1,\ 6)$.`,String.raw`$\big(v(A),v(B)\big)=(4.5,\ 6)$.`,NONE],ok:[0],
e:String.raw`<blockquote>$v_*(s)=\max_a\sum_{s',r}p(s',r\mid s,a)\,[r+\gamma v_*(s')]$</blockquote>
<p>Plug in $(2.25,6)$ and check that each state equals the maximum of its actions.</p>
<p><b>State $A$:</b></p>
$$\begin{aligned}q(A,\text{safe})&=1\,(1+0.5\cdot2.25)\\ &=1\cdot2.125\\ &=2.125\\ q(A,\text{risky})&=0.75\,(0+0.5\cdot6)+0.25\,(0+0.5\cdot0)\\ &=0.75\cdot3+0.25\cdot0\\ &=2.25+0\\ &=2.25\\ v(A)&=\max(2.125,\ 2.25)\\ &=2.25\end{aligned}$$
<p><b>State $B$:</b></p>
$$\begin{aligned}q(B,\text{cash})&=1\,(6+0.5\cdot0)\\ &=1\cdot6\\ &=6\\ q(B,\text{wait})&=0.5\,(2+0.5\cdot6)+0.5\,(2+0.5\cdot2.25)\\ &=0.5\cdot5+0.5\cdot3.125\\ &=2.5+1.5625\\ &=4.0625\\ v(B)&=\max(6,\ 4.0625)\\ &=6\end{aligned}$$
<p>So $v_*=(2.25,6)$, and the optimal policy is risky in $A$, cash in $B$.</p>`,
d:["",String.raw`Is $v_\pi$ for the policy "safe, cash": it satisfies the Bellman equation of that policy, but risky gives more, so the maximum fails.$$\begin{aligned}q(A,\text{safe})&=1\,(1+0.5\cdot2)\\ &=1\cdot2\\ &=2\\ q(A,\text{risky})&=0.75\,(0+0.5\cdot6)+0.25\,(0+0.5\cdot0)\\ &=0.75\cdot3+0.25\cdot0\\ &=2.25+0\\ &=2.25\\ 2.25&&gt;2\end{aligned}$$`,
String.raw`Is the result of one sweep of value iteration from 0. In $A$ the maximum is not 1:$$\begin{aligned}q(A,\text{safe})&=1\,(1+0.5\cdot1)\\ &=1\cdot1.5\\ &=1.5\\ q(A,\text{risky})&=0.75\,(0+0.5\cdot6)+0.25\,(0+0.5\cdot0)\\ &=0.75\cdot3+0.25\cdot0\\ &=2.25+0\\ &=2.25\\ \max(1.5,\ 2.25)&=2.25\\ 2.25&\ne 1\end{aligned}$$`,
String.raw`Forgets $\gamma$ in the risky action:$$\begin{aligned}q(A,\text{risky})&=0.75\,(0+6)+0.25\,(0+0)\\ &=0.75\cdot6+0.25\cdot0\\ &=4.5+0\\ &=4.5\end{aligned}$$ With the correct equation, the maximum in $A$ is not 4.5:$$\begin{aligned}q(A,\text{safe})&=1\,(1+0.5\cdot4.5)\\ &=1\cdot3.25\\ &=3.25\\ q(A,\text{risky})&=0.75\,(0+0.5\cdot6)+0.25\,(0+0.5\cdot0)\\ &=0.75\cdot3+0.25\cdot0\\ &=2.25+0\\ &=2.25\\ \max(3.25,\ 2.25)&=3.25\\ 3.25&\ne 4.5\end{aligned}$$`,""]},

{i:"Iterative policy evaluation", c: "Dynamic programming algorithms",q:String.raw`<p>Which statement describes iterative policy evaluation?</p>`,
o:[String.raw`The policy $\pi$ stays fixed; from any $v_0$, the Bellman equation for $v_\pi$ is used as an update rule, and $v_k\to v_\pi$ as $k\to\infty$.`,
String.raw`After each sweep, the policy is replaced by the greedy policy with respect to $v_k$.`,
String.raw`Its update takes the maximum over the actions, so $v_k$ converges to $v_*$.`,
String.raw`It gives the exact $v_\pi$ after $|S|$ sweeps, one sweep per state.`,NONE],ok:[0],
e:String.raw`<blockquote>Instead, we can iteratively find a sequence of value functions that approximate the solution. To do this, we can use the Bellman equation for $v_\pi$ as an update rule:</blockquote>
$$v_{k+1}(s)=\sum_a\pi(a\mid s)\sum_{s',r}p(s',r\mid s,a)\,[r+\gamma v_k(s')]$$
<blockquote>The sequence $\{v_k\}$ can be shown in general to converge to $v_\pi$ as $k\to\infty$.</blockquote>
<p>In class, the lecturer gave it as a general way to design algorithms: look at the condition that has to hold, and turn it into an update rule. At convergence, the equality holds.</p>`,
d:["",String.raw`Describes policy improvement, the other half of policy iteration.`,
String.raw`Describes value iteration.`,
String.raw`Is invented: convergence is only as $k\to\infty$.`,""]},

{i:"Iterative policy evaluation", c: "Dynamic programming algorithms",q:String.raw`<p>An MDP has two states $X$ and $Y$ and a terminal state of value 0, with $\gamma=0.8$:</p>
$$\begin{aligned}X,\ \text{left}:&\quad \text{reward }-1,\ \text{stays in }X\\ X,\ \text{right}:&\quad \text{reward }0,\ \text{to }Y\\ Y,\ \text{left}:&\quad \text{reward }0,\ \text{to }X\\ Y,\ \text{right}:&\quad \text{reward }5,\ \text{to terminal}\end{aligned}$$
<p>The policy $\pi$ picks left and right with probability 0.5 each. Starting from $v_0=0$, what is $v_2$, after two sweeps of iterative policy evaluation?</p>`,
o:[String.raw`$$\begin{aligned}v_2(X)&=-0.5\\ v_2(Y)&=2.5\end{aligned}$$`,String.raw`$$\begin{aligned}v_2(X)&=4\\ v_2(Y)&=5\end{aligned}$$`,String.raw`$$\begin{aligned}v_2(X)&=0.22\\ v_2(Y)&=2.588\end{aligned}$$`,String.raw`$$\begin{aligned}v_2(X)&=2.2\\ v_2(Y)&=4.2\end{aligned}$$`,NONE],ok:[4],
e:String.raw`<p>The right answer is:</p>$$\begin{aligned}v_2(X)&=0.3\\ v_2(Y)&=2.3\end{aligned}$$
$$v_{k+1}(s)=\sum_a\pi(a\mid s)\sum_{s',r}p(s',r\mid s,a)\,[r+\gamma v_k(s')]$$
<p><b>Sweep 1</b>, with $v_0=0$:</p>
$$\begin{aligned}v_1(X)&=0.5\,(-1+0.8\cdot0)+0.5\,(0+0.8\cdot0)\\ &=0.5\cdot(-1)+0.5\cdot0\\ &=-0.5+0\\ &=-0.5\\ v_1(Y)&=0.5\,(0+0.8\cdot0)+0.5\,(5+0.8\cdot0)\\ &=0.5\cdot0+0.5\cdot5\\ &=0+2.5\\ &=2.5\end{aligned}$$
<p><b>Sweep 2</b>, every right-hand side uses $v_1$:</p>
$$\begin{aligned}v_2(X)&=0.5\,\big(-1+0.8\cdot(-0.5)\big)+0.5\,(0+0.8\cdot2.5)\\ &=0.5\cdot(-1.4)+0.5\cdot2\\ &=-0.7+1\\ &=0.3\\ v_2(Y)&=0.5\,\big(0+0.8\cdot(-0.5)\big)+0.5\,(5+0.8\cdot0)\\ &=0.5\cdot(-0.4)+0.5\cdot5\\ &=-0.2+2.5\\ &=2.3\end{aligned}$$`,
d:[String.raw`Is $v_1$: it stops after one sweep.`,
String.raw`Takes the maximum over the actions: that is value iteration, not the evaluation of $\pi$.`,
String.raw`Updates in place: it uses the new $v(X)$ when it updates $Y$ in the same sweep, while the update rule uses $v_k$ on the right-hand side.`,
String.raw`Adds the two actions without the weights $\pi(a\mid s)=0.5$.`,""]},

{i:"Policy improvement", c: "Dynamic programming algorithms",q:String.raw`<p>A machine is good or worn, with $\gamma=0.9$. In good, the manager can run it at full or reduced speed; in worn, at full speed, at reduced speed, or maintain it.</p>
$$\begin{aligned}\text{good, full}:&\quad \text{stays good w.p. }0.5,\ \text{else worn; reward }6\\ \text{worn, full}:&\quad \text{stays worn w.p. }0.75,\ \text{reward }6\\ &\quad \text{else breaks down, back to good; reward }-25\\ \text{reduced}:&\quad \text{state unchanged; reward }3\\ \text{worn, maintain}:&\quad \text{back to good; reward }0\end{aligned}$$
<p>For the policy $\pi$ "always full speed":</p>$$\begin{aligned}v_\pi(\text{good})&=15\\ v_\pi(\text{worn})&=5\end{aligned}$$<p>What policy $\pi'$ does one step of policy improvement give?</p>`,
o:[String.raw`Reduced speed in good, maintain in worn.`,
String.raw`Full speed in good, and reduced speed in worn.`,
String.raw`Full speed in both states: $\pi$ is already greedy.`,
String.raw`Full speed in good, and maintain in worn.`,NONE],ok:[0],
e:String.raw`<blockquote>$\pi'(s)=\arg\max_a\sum_{s',r}p(s',r\mid s,a)\,[r+\gamma v_\pi(s')]$</blockquote>
<p><b>State good.</b></p>
$$\begin{aligned}q(\text{good},\text{full})&=0.5\,(6+0.9\cdot15)+0.5\,(6+0.9\cdot5)\\ &=0.5\cdot19.5+0.5\cdot10.5\\ &=9.75+5.25\\ &=15\\ q(\text{good},\text{reduced})&=1\,(3+0.9\cdot15)\\ &=1\cdot16.5\\ &=16.5\end{aligned}$$
<p><b>State worn.</b></p>
$$\begin{aligned}q(\text{worn},\text{full})&=0.75\,(6+0.9\cdot5)+0.25\,(-25+0.9\cdot15)\\ &=0.75\cdot10.5+0.25\cdot(-11.5)\\ &=7.875+(-2.875)\\ &=5\\ q(\text{worn},\text{reduced})&=1\,(3+0.9\cdot5)\\ &=1\cdot7.5\\ &=7.5\\ q(\text{worn},\text{maintain})&=1\,(0+0.9\cdot15)\\ &=1\cdot13.5\\ &=13.5\end{aligned}$$
<p>So $\pi'$ is reduced in good and maintain in worn. Under $\pi$, the worn state is worth little, so the improvement both avoids it and leaves it fast.</p>`,
d:["",String.raw`Picks the highest immediate expected reward: 6 in good, and 3 in worn. It ignores $\gamma v_\pi(s')$.$$\begin{aligned}r(\text{good},\text{full})&=0.5\cdot6+0.5\cdot6\\ &=3+3\\ &=6\\ r(\text{good},\text{reduced})&=1\cdot3\\ &=3\\ r(\text{worn},\text{full})&=0.75\cdot6+0.25\cdot(-25)\\ &=4.5+(-6.25)\\ &=-1.75\\ r(\text{worn},\text{reduced})&=1\cdot3\\ &=3\\ r(\text{worn},\text{maintain})&=1\cdot0\\ &=0\end{aligned}$$`,
String.raw`Is false: $v_\pi$ satisfies the Bellman equation of $\pi$, but another action has a higher value in both states.`,
String.raw`Treats full speed in good as if the machine stayed good. It forgets the probability 0.5 of becoming worn.$$\begin{aligned}q(\text{good},\text{full})&=1\,(6+0.9\cdot15)\\ &=1\cdot19.5\\ &=19.5\\ 19.5&&gt;16.5\end{aligned}$$`,""]},

{i:"Policy iteration", c: "Dynamic programming algorithms",q:String.raw`<p>Which statements about policy iteration are correct?</p>`,m:true,
o:[String.raw`Each of its iterations contains a policy evaluation, which is itself an iterative process.`,
String.raw`The improvement step can change the action in all states at once, taking the greedy action for $v_\pi$ in each one.`,
String.raw`It alternates evaluation and improvement: $\pi_0\to v_{\pi_0}\to\pi_1\to v_{\pi_1}\to\cdots\to\pi_*\to v_*$.`,
String.raw`The improvement step picks, in each state, the action with the highest immediate expected reward.`,
String.raw`Only the evaluation step uses the transition probabilities $p(s',r\mid s,a)$.`],ok:[0,1,2],
e:String.raw`<blockquote>The key idea for policy improvement is to consider the impact of changing all actions at all states, selecting at each state that action that appears to be best according to the greedy policy.</blockquote>
$$\pi_0\xrightarrow{E}v_{\pi_0}\xrightarrow{I}\pi_1\xrightarrow{E}v_{\pi_1}\xrightarrow{I}\pi_2\xrightarrow{E}\cdots\xrightarrow{I}\pi_*\xrightarrow{E}v_*$$
<blockquote>A drawback to policy iteration is that each of its iterations involves policy evaluation, which is itself an iterative process.</blockquote>`,
d:[String.raw`Correct. It is the drawback that value iteration removes.`,
String.raw`Correct.`,
String.raw`Correct. E is evaluation and I is improvement.`,
String.raw`Wrong. The greedy action maximizes $\sum p\,[r+\gamma v_\pi(s')]$, the immediate reward plus the discounted value of the next state.`,
String.raw`Wrong. The improvement step $\arg\max_a\sum_{s',r}p(s',r\mid s,a)[\dots]$ uses them too.`]},

{i:"Policy iteration", c: "Dynamic programming algorithms",q:String.raw`<p>A machine is good or worn, with $\gamma=0.5$. In good, the manager can run it at full or reduced speed; in worn, at full speed, at reduced speed, or maintain it.</p>
$$\begin{aligned}\text{good, full}:&\quad \text{stays good w.p. }0.6,\ \text{else worn; reward }12\\ \text{worn, full}:&\quad \text{stays worn w.p. }0.8,\ \text{reward }12\\ &\quad \text{else breaks down, back to good; reward }-30\\ \text{reduced}:&\quad \text{state unchanged; reward }2\\ \text{worn, maintain}:&\quad \text{back to good; reward }0\end{aligned}$$
<p>You run policy iteration from $\pi_0$ = "reduced speed in both states", with an exact evaluation at each step, until the policy no longer changes. What does it return, with $v_*$ written as $\big(v(\text{good}),v(\text{worn})\big)$?</p>`,
o:[String.raw`$\pi_*$: full speed in good, maintain in worn; $v_*=(20,\ 10)$.`,
String.raw`$\pi_*$: full speed in both states; $v_*=(19.8,\ 9.3)$.`,
String.raw`$\pi_*$: full speed in good, maintain in worn; $v_*=(19.8,\ 9.9)$.`,
String.raw`$\pi_*$: full speed in good, maintain in worn; $v_*=(24,\ 24)$.`,NONE],ok:[0],
e:String.raw`<p>Write $g$ and $w$ for the values of good and worn.</p>
<p><b>1. Evaluate $\pi_0$.</b> Reduced speed keeps the state:</p>
$$\begin{aligned}g&=1\,(2+0.5g)\\ &=2+0.5g\\ 0.5g&=2\\ g&=4\\ w&=1\,(2+0.5w)\\ &=2+0.5w\\ 0.5w&=2\\ w&=4\end{aligned}$$
<p><b>2. Improve</b>, with the values of step 1:</p>
$$\begin{aligned}q(\text{good},\text{full})&=0.6\,(12+0.5\cdot4)+0.4\,(12+0.5\cdot4)\\ &=0.6\cdot14+0.4\cdot14\\ &=8.4+5.6\\ &=14\\ q(\text{good},\text{reduced})&=1\,(2+0.5\cdot4)\\ &=1\cdot4\\ &=4\\ q(\text{worn},\text{full})&=0.8\,(12+0.5\cdot4)+0.2\,(-30+0.5\cdot4)\\ &=0.8\cdot14+0.2\cdot(-28)\\ &=11.2+(-5.6)\\ &=5.6\\ q(\text{worn},\text{reduced})&=1\,(2+0.5\cdot4)\\ &=1\cdot4\\ &=4\\ q(\text{worn},\text{maintain})&=1\,(0+0.5\cdot4)\\ &=1\cdot2\\ &=2\end{aligned}$$
<p>So $\pi_1$ is full speed in both states.</p>
<p><b>3. Evaluate $\pi_1$.</b></p>
$$\begin{aligned}g&=0.6\,(12+0.5g)+0.4\,(12+0.5w)\\ &=7.2+0.3g+4.8+0.2w\\ &=12+0.3g+0.2w\\ w&=0.8\,(12+0.5w)+0.2\,(-30+0.5g)\\ &=9.6+0.4w+(-6)+0.1g\\ &=3.6+0.1g+0.4w\end{aligned}$$
<p>Move the unknowns to the left:</p>
$$\begin{aligned}0.7g-0.2w&=12\\ -0.1g+0.6w&=3.6\end{aligned}$$
<p>The second equation gives:</p>
$$\begin{aligned}0.1g&=0.6w-3.6\\ g&=6w-36\end{aligned}$$
<p>Substitute it in the first equation:</p>
$$\begin{aligned}0.7\,(6w-36)-0.2w&=12\\ 4.2w-25.2-0.2w&=12\\ 4w-25.2&=12\\ 4w&=37.2\\ w&=9.3\\ g&=6\cdot9.3-36\\ &=55.8-36\\ &=19.8\end{aligned}$$
<p><b>4. Improve</b>, with the values of step 3:</p>
$$\begin{aligned}q(\text{good},\text{full})&=0.6\,(12+0.5\cdot19.8)+0.4\,(12+0.5\cdot9.3)\\ &=0.6\cdot21.9+0.4\cdot16.65\\ &=13.14+6.66\\ &=19.8\\ q(\text{good},\text{reduced})&=1\,(2+0.5\cdot19.8)\\ &=1\cdot11.9\\ &=11.9\\ q(\text{worn},\text{full})&=0.8\,(12+0.5\cdot9.3)+0.2\,(-30+0.5\cdot19.8)\\ &=0.8\cdot16.65+0.2\cdot(-20.1)\\ &=13.32+(-4.02)\\ &=9.3\\ q(\text{worn},\text{reduced})&=1\,(2+0.5\cdot9.3)\\ &=1\cdot6.65\\ &=6.65\\ q(\text{worn},\text{maintain})&=1\,(0+0.5\cdot19.8)\\ &=1\cdot9.9\\ &=9.9\end{aligned}$$
<p>So $\pi_2$ is full in good, maintain in worn.</p>
<p><b>5. Evaluate $\pi_2$.</b></p>
$$\begin{aligned}w&=1\,(0+0.5g)\\ &=0.5g\\ g&=0.6\,(12+0.5g)+0.4\,(12+0.5w)\\ &=0.6\,(12+0.5g)+0.4\,(12+0.5\cdot0.5g)\\ &=7.2+0.3g+4.8+0.1g\\ &=12+0.4g\\ 0.6g&=12\\ g&=20\\ w&=0.5\cdot20\\ &=10\end{aligned}$$
<p><b>6. Improve</b>, with the values of step 5:</p>
$$\begin{aligned}q(\text{good},\text{full})&=0.6\,(12+0.5\cdot20)+0.4\,(12+0.5\cdot10)\\ &=0.6\cdot22+0.4\cdot17\\ &=13.2+6.8\\ &=20\\ q(\text{good},\text{reduced})&=1\,(2+0.5\cdot20)\\ &=1\cdot12\\ &=12\\ q(\text{worn},\text{full})&=0.8\,(12+0.5\cdot10)+0.2\,(-30+0.5\cdot20)\\ &=0.8\cdot17+0.2\cdot(-20)\\ &=13.6+(-4)\\ &=9.6\\ q(\text{worn},\text{reduced})&=1\,(2+0.5\cdot10)\\ &=1\cdot7\\ &=7\\ q(\text{worn},\text{maintain})&=1\,(0+0.5\cdot20)\\ &=1\cdot10\\ &=10\end{aligned}$$
<p>The policy does not change, so:</p>$$\begin{aligned}\pi_*&=\pi_2\\ v_*&=(20,10)\end{aligned}$$`,
d:["",String.raw`Stops after the first improvement. The second improvement switches worn to maintain, because $9.9&gt;9.3$.`,
String.raw`Reports the maxima of the second improvement step as $v_*$, without evaluating the new policy.`,
String.raw`Forgets the discount on the maintain transition, which gives:$$\begin{aligned}w&=1\,(0+g)\\ &=g\\ g&=0.6\,(12+0.5g)+0.4\,(12+0.5w)\\ &=0.6\,(12+0.5g)+0.4\,(12+0.5g)\\ &=7.2+0.3g+4.8+0.2g\\ &=12+0.5g\\ 0.5g&=12\\ g&=24\\ w&=24\end{aligned}$$`,""]},

{i:"Value iteration", c: "Dynamic programming algorithms",q:String.raw`<p>Which statement about value iteration is correct?</p>`,
o:[String.raw`Its update is the policy evaluation update with a maximum over the actions.`,
String.raw`It runs a complete policy evaluation, to convergence, before each improvement step.`,
String.raw`It updates the policy explicitly at each sweep, and leaves the value function unchanged.`,
String.raw`Unlike policy iteration, it only reaches an approximation of the optimal value function.`,NONE],ok:[0],
e:String.raw`<blockquote>The key idea of value iteration is to repeatedly update an estimate of the optimal value function according to Bellman optimality equation.</blockquote>
$$v_{k+1}(s)=\max_a\sum_{s',r}p(s',r\mid s,a)\,[r+\gamma v_k(s')]$$
<blockquote>Value iteration can be understood as combining, in each of its sweeps, one sweep of policy evaluation and one sweep of policy improvement. This approach has been shown to also reach the optimal value function.</blockquote>`,
d:["",String.raw`Describes policy iteration, whose drawback is precisely this evaluation inside each iteration.`,
String.raw`Is the reverse: value iteration updates the value function, and the policy only implicitly.`,
String.raw`Is false: value iteration also reaches the optimal value function.`,""]},

{i:"Value iteration", c: "Dynamic programming algorithms",q:String.raw`<p>An MDP has two states $A$ and $B$ and a terminal state of value 0, with $\gamma=0.9$:</p>
$$\begin{aligned}A,\ \text{hold}:&\quad \text{reward }1,\ \text{back to }A\\ A,\ \text{move}:&\quad \text{reward }0,\ \text{to }B\text{ w.p. }0.8,\ \text{to terminal w.p. }0.2\\ B,\ \text{sell}:&\quad \text{reward }4,\ \text{to terminal}\\ B,\ \text{wait}:&\quad \text{reward }1,\ \text{to }B\text{ or to }A\text{, w.p. }0.5\text{ each}\end{aligned}$$
<p>Starting from $v_0=0$, what is $v_2$ after two sweeps of value iteration, and which actions reach the maximum in the second sweep?</p>`,
o:[String.raw`$v_2=(2.88,\ 4)$, with move in $A$ and sell in $B$.`,
String.raw`$v_2=(1,\ 4)$, with hold in $A$ and sell in $B$.`,
String.raw`$v_2=(3.2,\ 4)$, with move in $A$ and sell in $B$.`,
String.raw`$v_2=(2.88,\ 4.096)$, with move in $A$ and wait in $B$.`,NONE],ok:[0],
e:String.raw`$$v_{k+1}(s)=\max_a\sum_{s',r}p(s',r\mid s,a)\,[r+\gamma v_k(s')]$$
<p>Write $q_{k+1}(s,a)$ for the sum inside the maximum.</p>
<p><b>Sweep 1</b>, with $v_0=0$: only the rewards count.</p>
$$\begin{aligned}q_1(A,\text{hold})&=1\,(1+0.9\cdot0)\\ &=1\cdot1\\ &=1\\ q_1(A,\text{move})&=0.8\,(0+0.9\cdot0)+0.2\,(0+0.9\cdot0)\\ &=0.8\cdot0+0.2\cdot0\\ &=0\\ v_1(A)&=\max(1,\ 0)\\ &=1\\ q_1(B,\text{sell})&=1\,(4+0.9\cdot0)\\ &=1\cdot4\\ &=4\\ q_1(B,\text{wait})&=0.5\,(1+0.9\cdot0)+0.5\,(1+0.9\cdot0)\\ &=0.5\cdot1+0.5\cdot1\\ &=0.5+0.5\\ &=1\\ v_1(B)&=\max(4,\ 1)\\ &=4\end{aligned}$$
<p><b>Sweep 2</b>, with $v_1=(1,4)$ on every right-hand side:</p>
$$\begin{aligned}q_2(A,\text{hold})&=1\,(1+0.9\cdot1)\\ &=1\cdot1.9\\ &=1.9\\ q_2(A,\text{move})&=0.8\,(0+0.9\cdot4)+0.2\,(0+0.9\cdot0)\\ &=0.8\cdot3.6+0.2\cdot0\\ &=2.88+0\\ &=2.88\\ v_2(A)&=\max(1.9,\ 2.88)\\ &=2.88\\ q_2(B,\text{sell})&=1\,(4+0.9\cdot0)\\ &=1\cdot4\\ &=4\\ q_2(B,\text{wait})&=0.5\,(1+0.9\cdot4)+0.5\,(1+0.9\cdot1)\\ &=0.5\cdot4.6+0.5\cdot1.9\\ &=2.3+0.95\\ &=3.25\\ v_2(B)&=\max(4,\ 3.25)\\ &=4\end{aligned}$$
<p>So $v_2=(2.88,4)$, with move in $A$ and sell in $B$. The greedy action in $A$ changed between the two sweeps: the value of $B$ only reached $A$ in the second one.</p>`,
d:["",String.raw`Is $v_1$, after one sweep.`,
String.raw`Forgets the discount:$$\begin{aligned}q_2(A,\text{move})&=0.8\,(0+4)+0.2\,(0+0)\\ &=0.8\cdot4+0.2\cdot0\\ &=3.2+0\\ &=3.2\end{aligned}$$`,
String.raw`Updates in place: it uses the new $v(A)=2.88$ inside the same sweep for $B$, so wait gives:$$\begin{aligned}q_2(B,\text{wait})&=0.5\,(1+0.9\cdot4)+0.5\,(1+0.9\cdot2.88)\\ &=0.5\cdot4.6+0.5\cdot3.592\\ &=2.3+1.796\\ &=4.096\end{aligned}$$`,""]},

{i:"Policy iteration vs value iteration", c: "Dynamic programming algorithms",q:String.raw`<p>Which statements comparing policy iteration and value iteration are correct?</p>`,m:true,
o:[String.raw`Policy iteration updates the value function for a fixed policy, then chooses a greedy policy for the new value function.`,
String.raw`Value iteration updates both the value function and, implicitly, the policy at every iteration.`,
String.raw`Both are dynamic programming algorithms that compute the optimal policy of an MDP.`,
String.raw`Value iteration needs an optimal policy as its starting point.`,
String.raw`Both work from sampled transitions, without knowing the transition function.`],ok:[0,1,2],
e:String.raw`<blockquote>Both methods can be used to compute the optimal policy. Policy iteration: iteratively update the value function for a fixed policy; after the policy is evaluated, choose a greedy policy with respect to the new value function; repeat until the optimal policy is reached. Value iteration: every iteration updates both the value function and the policy (implicitly). Both are dynamic programming based algorithms for solving MDPs.</blockquote>`,
d:[String.raw`Correct.`,String.raw`Correct.`,String.raw`Correct.`,
String.raw`Wrong. It starts from any $v_0$, for example 0, and the optimal policy is its result.`,
String.raw`Wrong. Both use $p(s',r\mid s,a)$ in every update. Working from samples is reinforcement learning.`]},

{i:"Gridworld", c: "Dynamic programming algorithms",q:String.raw`<p>In the warehouse gridworld, an automated guided vehicle (AGV) that chooses North moves North with probability 0.8, and West or East with probability 0.1 each; if a rack blocks the move, it stays put. Why does the AGV need a policy, and not only a fixed route to the picking station?</p>`,
o:[String.raw`Because the moves are random, the AGV can end up in any cell, so it needs an action for every cell.`,
String.raw`Because the racks move between steps, so the route has to be computed again at every step.`,
String.raw`Because the rewards come only at the end, so no route can be evaluated before the AGV reaches the station.`,
String.raw`Because a fixed route ignores the living reward that the AGV receives at each step.`,NONE],ok:[0],
e:String.raw`<blockquote>The outcome of an action is random: the AGV needs a policy (an action for every cell), not just a fixed route.</blockquote>
<p>In class, the gridworld was presented as the "hello world" of reinforcement learning, and as an archetype: the same structure models an inventory policy, where the negative reward is a stock-out, or an investment portfolio.</p>`,
d:["",String.raw`Is invented: the racks are fixed cells that block the path.`,
String.raw`Is false: the AGV also receives a small living reward at each step, and a policy is evaluated with the value function before any move.`,
String.raw`Is not the reason: the living reward is part of the return of a route as well.`,""]},

        if (ancho()) r.errores.push(`pregunta ${k + 1}: desborda a 375 px`);
        s.click();
      }
    }
    // Quitar el iframe con fuentes a medio cargar las deja en error también en esta página, que comparte la caché.
    await d.fonts.ready; f.remove();
  }
  await Promise.allSettled([...document.fonts].map(x => x.load()));
  document.fonts.forEach(x => { if (x.status === "error") r.errores.push(`la fuente ${x.family} ${x.weight} no carga`) });
  r.katex = !!window.katex;
  return r;
}
// Comprobación de todo el curso desde la parrilla: abre cada vista de las unidades desde..hasta en un iframe y lanza su validar().
// Devuelve los errores de cada vista que los tenga; una lista vacía es un curso válido.
async function validarTodo(desde = 0, hasta = CURSO.u.length) {
  const out = [];
  for (let k = desde; k < Math.min(hasta, CURSO.u.length); k++) for (const v of VISTAS.filter(v => CURSO.u[k].v[v])) {
    const f = document.createElement("iframe");
    // ?v da al iframe una dirección distinta de la de la parrilla: con la misma, salvo el #, la parrilla llegó a saltar a la vista que se validaba.
    f.style.cssText = "position:absolute;left:-10000px;top:0;width:1600px;height:1000px"; f.src = `${location.pathname}?v#${k}/${v}`; document.body.append(f);
    await new Promise(ok => f.onload = ok); await new Promise(ok => setTimeout(ok, 1000));
    const r = await f.contentWindow.validar();
    if (r.errores.length || !r.katex) out.push({vista: `${CURSO.u[k].n} / ${v}`, errores: r.errores, katex: r.katex});
    f.remove();
  }
  return out;
}

!V ? parrilla() : ESTUDIO ? estudio() : draw();
